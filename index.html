rights-and-democracy-elections-and-political-parties#5","l":21,"q":"Når fikk norske kvinner allmenn stemmerett?","o":["1898","1905","1913","1920"],"a":2,"e":"Norske kvinner fikk allmenn stemmerett i 1913."},{"id":"human-rights-and-democracy-elections-and-political-parties#6","l":21,"q":"Når fikk norske menn allmenn stemmerett?","o":["1890","1898","1905","1913"],"a":1,"e":"Norske menn fikk allmenn stemmerett i 1898."},{"id":"human-rights-and-democracy-elections-and-political-parties#7","l":21,"q":"Hvor mange politiske partier finnes det i Norge?","o":["Rundt ti","Rundt tjue","Rundt tretti","Rundt førti"],"a":1,"e":"Det finnes rundt tjue ulike politiske partier i Norge."},{"id":"human-rights-and-democracy-elections-and-political-parties#8","l":21,"q":"Hva skriver et politisk parti om i programmet sitt?","o":["Partiets historie og navnene på lederne i partiet","Hvilke saker partiet ønsker å jobbe med i valgperioden","Hvor mange medlemmer partiet har i hver kommune","Navn og adresse til alle medlemmene i partiet"],"a":1,"e":"I programmet skriver partiene om hvilke saker de ønsker å jobbe med de neste fire årene, altså i valgperioden som kommer."},{"id":"human-rights-and-democracy-elections-and-political-parties#9","l":21,"q":"Hvilken skala kan de politiske partiene i Norge plasseres på, ifølge leksjonen?","o":["Fra «demokratisk» til «autoritær»","Fra «ung» til «gammel»","Fra «sosialistisk» til «borgerlig»","Fra «by» til «land»"],"a":2,"e":"Vi kan grovt plassere de største partiene på en skala fra «sosialistisk» til «borgerlig»."},{"id":"human-rights-and-democracy-human-rights#0","l":22,"q":"Hva betyr det at menneskerettighetene er «universelle»?","o":["De er rettigheter bare for noen få land.","De er rettigheter som alle mennesker har, uavhengig av bakgrunn.","De er rettigheter som endrer seg fra år til år.","De er rettigheter som er forskjellige for kvinner og menn."],"a":1,"e":"Menneskerettighetene er universelle fordi alle mennesker har dem, ikke fordi de bor bestemte steder eller tilhører en bestemt religion eller folkegruppe."},{"id":"human-rights-and-democracy-human-rights#1","l":22,"q":"Hvilket år ble FNs verdenserklæring om menneskerettigheter vedtatt?","o":["1945","1948","1950","1960"],"a":1,"e":"Leksjonen sier at FNs verdenserklæring om menneskerettigheter ble vedtatt i 1948."},{"id":"human-rights-and-democracy-human-rights#2","l":22,"q":"Hvor mange av FNs medlemsland har sluttet seg til FNs verdenserklæring om menneskerettigheter?","o":["100 land","150 land","193 land","250 land"],"a":2,"e":"Leksjonen sier at alle FNs 193 medlemsland har sluttet seg til erklæringen."},{"id":"human-rights-and-democracy-human-rights#3","l":22,"q":"Hvem har menneskerettigheter ifølge FNs verdenserklæring om menneskerettigheter?","o":["Bare borgere i vestlige land.","Alle mennesker, uavhengig av religion.","Bare mennesker som jobber for FN.","Bare voksne mennesker over 18 år."],"a":1,"e":"Erklæringen sier at alle mennesker har de samme menneskerettighetene uavhengig av kjønn, religion, etnisitet, politisk syn, nasjonalitet osv."},{"id":"human-rights-and-democracy-human-rights#4","l":22,"q":"Hvilken rettighet er nevnt i menneskerettighetserklæringen?","o":["Retten til å eie en bedrift.","Retten til gratis bolig.","Retten til frihet og personlig sikkerhet.","Retten til å ha en bil."],"a":2,"e":"Leksjonen nevner at alle mennesker har rett til frihet og personlig sikkerhet."},{"id":"human-rights-and-democracy-human-rights#5","l":22,"q":"Hva sier menneskerettighetserklæringen om tortur?","o":["Tortur er tillatt i nødssituasjoner.","Tortur er bare galt i noen land.","Tortur i alle former er forbudt.","Tortur er tillatt hvis regjeringen godkjenner det."],"a":2,"e":"Leksjonen sier at tortur i alle former er forbudt."},{"id":"human-rights-and-democracy-human-rights#6","l":22,"q":"Hvordan har FNs menneskerettighetserklæring påvirket Norge?","o":["Den har ikke påvirket norske lover.","Store deler av erklæringen er innarbeidet i de norske lovene.","Norge har avvist den helt.","Den gjelder bare forholdet mellom land, ikke norske lover."],"a":1,"e":"Leksjonen sier at store deler av FNs menneskerettighetserklæring er innarbeidet i de norske lovene."},{"id":"human-rights-and-democracy-human-rights#7","l":22,"q":"Hvordan skal mennesker kunne påvirke den politiske situasjonen i landet sitt ifølge erklæringen?","o":["Bare gjennom demonstrasjoner.","Ved å snakke privat med politikere.","Ved å stemme ved frie, hemmelige valg.","Ved å betale skatt for å påvirke politikken."],"a":2,"e":"Leksjonen sier at alle mennesker har rett til å påvirke den politiske situasjonen i landet sitt gjennom å stemme ved frie, hemmelige valg."},{"id":"human-rights-and-democracy-human-rights#8","l":22,"q":"Hvilket utsagn om menneskerettighetserklæringen er riktig?","o":["Erklæringen sier at noen mennesker har flere rettigheter enn andre.","Erklæringen sier at rettighetene avhenger av religionen din.","Erklæringen sier at alle mennesker er født frie med samme menneskeverd og menneskerettigheter.","Erklæringen sier at bare rike mennesker har menneskerettigheter."],"a":2,"e":"Leksjonen sier at alle mennesker er født frie med samme menneskeverd og menneskerettigheter."},{"id":"human-rights-and-democracy-human-rights#9","l":22,"q":"Hva av følgende er IKKE en menneskerett ifølge leksjonen?","o":["Alle mennesker er født frie med samme menneskeverd.","Tortur i alle former er forbudt.","Alle mennesker har rett til å stemme ved frie, hemmelige valg.","Alle mennesker har rett til ubegrenset rikdom."],"a":3,"e":"Leksjonen nevner ingen rett til ubegrenset rikdom, mens de tre andre alternativene står i menneskerettighetserklæringen."},{"id":"leisure-activities-dugnad#0","l":23,"q":"Hva er det viktigste kjennetegnet ved dugnad?","o":["Det er betalt arbeid som må gjøres","Det er frivillig og ubetalt","Det er obligatorisk for alle innbyggere","Det er bare for profesjonelle arbeidstakere"],"a":1,"e":"Teksten sier at dugnad er frivillig, ubetalt arbeid."},{"id":"leisure-activities-dugnad#1","l":23,"q":"Hva er typiske arbeidsoppgaver for dugnad i barnehagen?","o":["Undervise barna og planlegge menyer","Vaske leker og fikse opp uteområder","Styre budsjettet til barnehagen","Ansette nye medarbeidere"],"a":1,"e":"Teksten sier at foreldrene i barnehagen kan vaske lekene eller fikse opp uteområdene på dugnad."},{"id":"leisure-activities-dugnad#2","l":23,"q":"Hvilket av disse stedene nevnes IKKE som et sted der det er dugnad?","o":["Borettslag","Lag og foreninger","Barnehager","Banker og kontorer"],"a":3,"e":"Teksten nevner dugnad i borettslag, lag og foreninger og barnehager, men ikke i banker og kontorer."},{"id":"leisure-activities-dugnad#3","l":23,"q":"Når er det vanlig med dugnad i et borettslag?","o":["Om sommeren for å gjøre seg klar til ferien","Om høsten for å gjøre seg klar til vinteren","Om våren for å gjøre det pent ute etter vinteren","Om vinteren for å gjøre bygningene klare"],"a":2,"e":"Teksten sier at beboerne i et borettslag gjerne er med på en dugnad om våren for å gjøre det pent ute etter vinteren."},{"id":"leisure-activities-dugnad#4","l":23,"q":"Hvordan kan foreldre skaffe penger til fritidsaktiviteter for barn gjennom dugnad?","o":["Ved å søke staten om støtte","Ved å kreve medlemsavgift av barna","Ved å lage i stand loppemarked eller kulturelle arrangementer","Ved å selge leker til andre familier"],"a":2,"e":"Teksten sier at foreldre kan lage i stand loppemarked eller et kulturelt arrangement for å få inn penger til foreningen."},{"id":"leisure-activities-dugnad#5","l":23,"q":"Er dugnad en tradisjon som bare finnes i Norge?","o":["Ja, den ble funnet opp i Norge og finnes ikke andre steder","Nei, de fleste landbrukssamfunn i verden har en liknende tradisjon","Nei, men den finnes bare i landene i Skandinavia","Ja, det er en ny skikk som startet i Norge i 2004"],"a":1,"e":"Teksten sier at dugnad er en gammel skikk i Norge, og at de fleste landbrukssamfunn i verden har en liknende tradisjon."},{"id":"leisure-activities-dugnad#6","l":23,"q":"Hva skjedde med ordet dugnad i 2004?","o":["Det ble brukt på norsk for første gang","Det ble tatt med i alle engelske ordbøker","Det ble kåret til Norges nasjonalord","Det ble et offisielt lovkrav"],"a":2,"e":"Teksten sier at ordet dugnad ble kåret til Norges nasjonalord i 2004."},{"id":"leisure-activities-dugnad#7","l":23,"q":"Hva mener Henrik og Arne om foreldre som ikke stiller opp på dugnad, ut fra samtalen mellom dem?","o":["De synes det er helt greit og vanlig","De synes det ikke spiller noen rolle så lenge arbeidet blir gjort","De synes det tar seg dårlig ut, og at det viser at man ikke vil være med i fellesskapet","De synes at bare foreldre som Truls' skal få lov til å være unntak"],"a":2,"e":"Henrik sier at det tar seg dårlig ut når noen aldri kommer på dugnad, og Arne er enig."},{"id":"leisure-activities-dugnad#8","l":23,"q":"Hva beskrives som en gammel skikk i Norge, ifølge teksten?","o":["Å betale barn for å hjelpe til med husarbeid","Å arrangere sommerfester i nærmiljøet","Dugnad","Å lære barn formelle tradisjoner"],"a":2,"e":"Teksten sier tydelig at dugnad er en gammel skikk i Norge."},{"id":"leisure-activities-dugnad#9","l":23,"q":"Hvilken ordning har noen lag og foreninger når det gjelder dugnad?","o":["Medlemmene kan jobbe færre timer enn andre","Medlemmene kan betale en viss sum i stedet for å være med på dugnaden","De leier inn profesjonelle arbeidere til å gjøre alt arbeidet","De gjør det obligatorisk for alle medlemmer å delta"],"a":1,"e":"Teksten sier at noen lag og foreninger har en praksis der man kan betale en viss sum i stedet for å være med på dugnaden."},{"id":"leisure-activities-political-engagement#0","l":24,"q":"Hva har alle som bor i et demokrati, ansvar for ifølge leksjonen?","o":["Å stemme ved lokalvalg","Å bli medlem av et politisk parti","Å jobbe som politiker","Å sørge for at demokratiet fungerer"],"a":3,"e":"Leksjonen sier at alle som bor i et demokrati, har ansvar for at demokratiet skal fungere."},{"id":"leisure-activities-political-engagement#1","l":24,"q":"Hvor mye økte valgdeltakelsen blant de yngste velgerne fra 2007 til 2011?","o":["Mindre enn 5 prosent","Nøyaktig 10 prosent","Mer enn 10 prosent","Mer enn 20 prosent"],"a":2,"e":"Leksjonen sier at valgdeltakelsen blant de yngste velgerne økte med mer enn ti prosent fra 2007 til 2011."},{"id":"leisure-activities-political-engagement#2","l":24,"q":"Hvilket av følgende er et eksempel på uformell politisk deltakelse?","o":["Å delta i en demonstrasjon","Å delta i valgkamp","Å fremme en sak i et politisk parti","Å stemme ved valg i et parti"],"a":0,"e":"Leksjonen nevner underskriftskampanjer, demonstrasjoner og diskusjoner i sosiale medier som uformell politisk deltakelse."},{"id":"leisure-activities-political-engagement#3","l":24,"q":"Ifølge leksjonen gir medlemskap i organisasjoner trening i diskusjoner, styrearbeid og avstemninger. Hva slags prosesser er dette?","o":["Økonomiske prosesser","Juridiske prosesser","Religiøse prosesser","Demokratiske prosesser"],"a":3,"e":"Leksjonen sier at man gjennom medlemskap i ulike organisasjoner får kjennskap til og trening i ulike demokratiske prosesser, som diskusjoner, styrearbeid og valg og avstemninger."},{"id":"leisure-activities-political-engagement#4","l":24,"q":"Hvordan har det politiske engasjementet blant unge nordmenn endret seg?","o":["Det har økt sammenlignet med før","Det har gått mye ned","Det har vært likt hele tiden","Det er mindre vanlig enn idrettsaktiviteter"],"a":0,"e":"Leksjonen sier at unge nordmenn er mer politisk aktive enn før."},{"id":"leisure-activities-political-engagement#5","l":24,"q":"Hva er viktig at innbyggerne i et demokrati gjør, ifølge leksjonen?","o":["Å aldri være uenig med regjeringen","Å være aktive og følge med på det som skjer","Å holde seg unna politiske diskusjoner","Å alltid følge det politikerne sier"],"a":1,"e":"Leksjonen sier at det er viktig at innbyggerne er aktive og følger med på det som skjer."},{"id":"leisure-activities-political-engagement#6","l":24,"q":"Hvilken handling er et eksempel på formell politisk deltakelse?","o":["Å delta i valgkamp","Å skrive et kritisk innlegg i sosiale medier","Å arrangere en demonstrasjon","Å skrive under på en underskriftskampanje"],"a":0,"e":"Leksjonen sier at formell politisk deltakelse er å fremme saker i et politisk parti eller delta i valgkamp."},{"id":"leisure-activities-political-engagement#7","l":24,"q":"Hva har økt blant unge nordmenn, ifølge leksjonen?","o":["Bare valgdeltakelsen","Bare medlemstallene i politiske ungdomsorganisasjoner","Ingen av delene","Både valgdeltakelsen og medlemstallene i politiske ungdomsorganisasjoner"],"a":3,"e":"Leksjonen sier at valgdeltakelsen blant de yngste velgerne økte, og at politiske ungdomsorganisasjoner har opplevd en økning i medlemstallene."},{"id":"leisure-activities-political-engagement#8","l":24,"q":"Hva er eksempler på demokratiske prosesser man får trening i gjennom medlemskap i politiske organisasjoner?","o":["Diskusjoner, styrearbeid, valg og avstemninger","Bare avstemninger","Bare diskusjoner og styrearbeid","Hvordan man blir profesjonell politiker"],"a":0,"e":"Leksjonen sier at man får kjennskap til og trening i demokratiske prosesser som diskusjoner, styrearbeid og valg og avstemninger."},{"id":"leisure-activities-political-engagement#9","l":24,"q":"Hva er viktig når det gjelder meninger i et demokrati, ifølge leksjonen?","o":["Man skal aldri være uenig med andre","Alle får ha sine egne meninger og bør gi uttrykk for dem","Man skal holde meningene sine for seg selv","Man skal bare si meninger som regjeringen godkjenner"],"a":1,"e":"Leksjonen sier at det er viktig at alle får ha sine egne meninger, og at de gir uttrykk for dem."},{"id":"leisure-activities-social-arenas#0","l":25,"q":"Ved siden av familie, skoler og arbeidsplasser, hvilke andre eksempler på sosiale arenaer nevnes i leksjonen?","o":["Sykehus, offentlige kontorer og fengsler","Kurs, kor og organisasjoner","Kjøpesentre, kinoer og restauranter","Idrettsarenaer, flyplasser og hoteller"],"a":1,"e":"Leksjonen sier at mange voksne går på kurs, at noen synger i kor, og at andre er med i ulike organisasjoner, og at dette også er sosiale arenaer."},{"id":"leisure-activities-social-arenas#1","l":25,"q":"Hvordan kan foreldre være involvert i barnas organiserte fritidsaktiviteter, ifølge leksjonen?","o":["De betaler for alt utstyr og alle avgifter","De tvinger barna til å være med","De bytter på å kjøre og hente barna","De må være til stede på hver eneste trening"],"a":2,"e":"Leksjonen sier at foreldrene kanskje bytter på å kjøre og hente barna til ulike aktiviteter."},{"id":"leisure-activities-social-arenas#2","l":25,"q":"Hvilken organisasjon med et samfunnsnyttig formål nevnes i leksjonen som et sted der man kan gjøre frivillig arbeid?","o":["Røde Kors","Forsikringsselskaper","Kjøpesentre","Flyselskaper"],"a":0,"e":"Leksjonen nevner Røde Kors, idrettslag og kulturarrangementer som eksempler på organisasjoner med et samfunnsnyttig formål."},{"id":"leisure-activities-social-arenas#3","l":25,"q":"Hvorfor er det spesielt nyttig å være med i organiserte fritidsaktiviteter for en som nylig har flyttet til Norge?","o":["Det er billigere enn andre aktiviteter","Det er et krav i norsk lov","Det er en fin måte å bli kjent med folk på","Det gir høyere lønn"],"a":2,"e":"Leksjonen sier at dette kan være en fin måte å bli kjent med folk i nærmiljøet på for en som er ny i Norge eller har flyttet til et nytt sted."},{"id":"leisure-activities-social-arenas#4","l":25,"q":"Hvordan hjelper frivillige organisasjoner folk med å lære om demokrati, ifølge leksjonen?","o":["Deltakerne får erfaring med møtedeltakelse, valg og avstemninger","De underviser i demokrati bare på skolene","De stemmer fram alle medlemmene i regjeringen","De lager nye nasjonale lover"],"a":0,"e":"Leksjonen sier at deltakerne får erfaring med demokratiske spilleregler, som møtedeltakelse, valg og avstemninger."},{"id":"leisure-activities-social-arenas#5","l":25,"q":"Hvilken misforståelse oppsto i samtalen mellom innvandreren og nordmannen?","o":["Innvandreren inviterte aldri til en spesiell dag og tid","Nordmannen hadde glemt dagen og tiden for besøket","Nordmannen ble fornærmet over å bli invitert på besøk","De to snakket ikke det samme språket"],"a":0,"e":"Leksjonen forklarer at man i Norge må invitere til en spesiell dag og tid, og at nordmenn sjelden går på besøk uten at det er avtalt på forhånd."},{"id":"leisure-activities-social-arenas#6","l":25,"q":"Hva nevner leksjonen som et eksempel på en uskreven regel?","o":["Hvordan vi hilser på hverandre","Hvordan man regner ut skatt","Hvordan man får førerkort","Hvordan man søker på en jobb"],"a":0,"e":"Leksjonen sier at reglene som ikke er skrevet ned er forskjellige fra kultur til kultur, og at et eksempel er hvordan vi hilser på hverandre."},{"id":"leisure-activities-social-arenas#7","l":25,"q":"Hva er det vanlige svaret når en nordmann sier «Hei, hvordan går det?», ifølge leksjonen?","o":["Takk, bare bra. Og med deg?","Jeg har det ikke bra","Jeg har det veldig travelt, la meg være i fred","Det kommer ikke deg ved"],"a":0,"e":"Leksjonen sier at det vanlige svaret er: «Takk, bare bra. Og med deg?»"},{"id":"leisure-activities-social-arenas#8","l":25,"q":"Hvilken fordel kan et større nettverk gjennom frivillig arbeid gi, ifølge leksjonen?","o":["Det kan gi positive utslag for jobb, utdanning og hverdagsliv","Det garanterer at man får en fast jobb i lokalsamfunnet","Det gjør at man ikke lenger trenger noen utdanning","Det gir automatisk høyere lønn på arbeidsplassen"],"a":0,"e":"Leksjonen sier at man får et større nettverk, noe som kan gi positive utslag både når det gjelder jobb, utdanning og hverdagsliv."},{"id":"leisure-activities-social-arenas#9","l":25,"q":"Hva sier leksjonen om hvordan frivillige organisasjoner påvirker samfunnet?","o":["De påvirker politiske prosesser lokalt og nasjonalt","De drives helt av staten og regjeringen","De hjelper bare de rike menneskene i samfunnet","De finansieres bare av skattene som folk betaler"],"a":0,"e":"Leksjonen sier at flere frivillige organisasjoner påvirker de politiske prosessene, både i lokalsamfunnet og nasjonalt."},{"id":"new-in-norway-a-life-in-norway#0","l":26,"q":"Hvor mange barn fødes hvert år i Norge?","o":["omtrent 5000","omtrent 25 000","omtrent 50 000","omtrent 100 000"],"a":2,"e":"Ifølge leksjonen fødes det litt mer enn femti tusen barn i Norge hvert år."},{"id":"new-in-norway-a-life-in-norway#1","l":26,"q":"Hvor gamle er norske kvinner i gjennomsnitt når de får sitt første barn?","o":["25 år","30 år","35 år","40 år"],"a":1,"e":"Leksjonen sier at norske kvinner i gjennomsnitt er omtrent tretti år når de får sitt første barn."},{"id":"new-in-norway-a-life-in-norway#2","l":26,"q":"Hva er strafferammen for å omskjære jenter i Norge?","o":["Fengsel i inntil 2 år","Fengsel i inntil 5 år","Fengsel i inntil 15 år","Fengsel i inntil 25 år"],"a":2,"e":"Leksjonen sier at strafferammen for å utføre eller bidra til omskjæring av jenter er inntil femten år, og at det i tillegg kan medføre utvisning fra Norge."},{"id":"new-in-norway-a-life-in-norway#3","l":26,"q":"Hvor mange uker med foreldrepenger har foreldre som begge er i lønnet arbeid, til sammen rett til?","o":["41 uker","51 uker","61 uker","71 uker"],"a":2,"e":"Leksjonen sier at foreldre som begge er i lønnet arbeid, til sammen har rett til inntil 61 uker med foreldrepenger."},{"id":"new-in-norway-a-life-in-norway#4","l":26,"q":"Hva er myndighetsalderen i Norge?","o":["16 år","18 år","20 år","21 år"],"a":1,"e":"Leksjonen sier at myndighetsalderen i Norge er 18 år."},{"id":"new-in-norway-a-life-in-norway#5","l":26,"q":"I hvilken klasse begynner ungdomstrinnet i Norge?","o":["6. klasse","7. klasse","8. klasse","9. klasse"],"a":2,"e":"Leksjonen forklarer at barnetrinnet er 1.–7. klasse og ungdomstrinnet er 8.–10. klasse."},{"id":"new-in-norway-a-life-in-norway#6","l":26,"q":"Hva er pensjonsalderen i Norge for både menn og kvinner?","o":["62 år","65 år","67 år","70 år"],"a":2,"e":"Leksjonen sier at pensjonsalderen i Norge er 67 år både for menn og kvinner."},{"id":"new-in-norway-a-life-in-norway#7","l":26,"q":"Hvor gamle er folk i Norge i gjennomsnitt når de gifter seg for første gang?","o":["Mellom 20 og 30 år","Mellom 30 og 40 år","Mellom 40 og 50 år","Mellom 50 og 60 år"],"a":1,"e":"Leksjonen sier at gjennomsnittsalderen for å gifte seg for første gang er mellom tretti og førti år, både for menn og kvinner."},{"id":"new-in-norway-a-life-in-norway#8","l":26,"q":"Hvilken påstand om husarbeid i Norge er riktig?","o":["Menn bruker vesentlig mer tid på husarbeid enn kvinner.","Menn og kvinner bruker nøyaktig like mye tid på husarbeid.","Kvinner bruker vesentlig mer tid på husarbeid enn menn.","Bare kvinner gjør husarbeid, og menn hjelper aldri til hjemme."],"a":2,"e":"Leksjonen sier at det er vanlig at kvinner og menn deler på husarbeidet, men at kvinner likevel bruker vesentlig mer tid hver uke på husarbeid enn det menn gjør."},{"id":"new-in-norway-a-life-in-norway#9","l":26,"q":"Hvor mye studiegjeld har mange studenter i Norge når de er ferdige med studiene?","o":["Omtrent 100 000 kroner","Omtrent 200 000 kroner","Mer enn 300 000 kroner","Mer enn 500 000 kroner"],"a":2,"e":"Leksjonen sier at mange har mer enn tre hundre tusen kroner i studiegjeld når de er ferdige med studiene."},{"id":"new-in-norway-rules-for-residence#0","l":27,"q":"Hva betyr ordet innvandrer i denne leksjonen?","o":["En person som er født i utlandet, men som bor i Norge","En person som er født i Norge, men som har bodd i et annet land","En person som jobber midlertidig i et annet land","En person som har bodd i det samme landet i mer enn 5 år"],"a":0,"e":"Leksjonen sier at en innvandrer er en person som er født i utlandet, men som bor i Norge."},{"id":"new-in-norway-rules-for-residence#1","l":27,"q":"Hva må en person fra et EU/EØS-land gjøre hvis de vil jobbe i Norge?","o":["Søke om oppholdstillatelse hos utlendingsmyndighetene","Registrere seg hos politiet","Bestå en norskprøve","Først få en jobbkontrakt"],"a":1,"e":"Innbyggere fra EU/EØS-land kan jobbe i Norge uten å søke om oppholdstillatelse, men de må registrere seg hos politiet."},{"id":"new-in-norway-rules-for-residence#2","l":27,"q":"Gjennom hvem kommer overføringsflyktninger til Norge, ifølge leksjonen?","o":["Den norske statens utlendingsmyndighet","En privat internasjonal organisasjon","En avtale med UNHCR","Røde Kors"],"a":2,"e":"Leksjonen sier at overføringsflyktninger eller kvoteflyktninger kommer til Norge etter avtale med UNHCR (FN)."},{"id":"new-in-norway-rules-for-residence#3","l":27,"q":"Hva er en gyldig grunn til å få asyl i Norge?","o":["Å være arbeidsledig","Å bli forfulgt på grunn av seksuell legning","Å ha et jobbtilbud i Norge","Å komme fra et fattig land"],"a":1,"e":"Personer som er individuelt forfulgt i hjemlandet på grunn av rase, religion, nasjonalitet, seksuell legning eller politisk arbeid, kan få asyl i Norge."},{"id":"new-in-norway-rules-for-residence#4","l":27,"q":"Hvordan kommer asylsøkere til Norge og søker om asyl?","o":["De blir invitert av den norske regjeringen","De kommer gjennom en arbeidsgiver som garanterer for dem","De kommer selv til Norge og søker om asyl","De kommer gjennom UNHCRs overføringsprogram"],"a":2,"e":"Leksjonen sier at asylsøkere kommer selv til Norge og søker om asyl."},{"id":"new-in-norway-rules-for-residence#5","l":27,"q":"Hva kan familiemedlemmer til personer med oppholdstillatelse i Norge søke om?","o":["Et arbeidsvisum","Familiegjenforening","Introduksjonsprogrammet","Norsk statsborgerskap"],"a":1,"e":"Leksjonen sier at familiemedlemmer til personer med oppholdstillatelse i Norge kan søke om familiegjenforening."},{"id":"new-in-norway-rules-for-residence#6","l":27,"q":"Hva kalles en person som har fått innvilget asyl/opphold på grunn av sterke menneskelige hensyn, eller en overføringsflyktning, til daglig?","o":["En innvandrer","En asylsøker","En flyktning","En besøkende"],"a":2,"e":"Leksjonen sier at personer som har fått innvilget asyl/opphold på grunn av sterke menneskelige hensyn, og overføringsflyktninger, til daglig kalles flyktninger."},{"id":"new-in-norway-rules-for-residence#7","l":27,"q":"Hvor ofte må en midlertidig oppholdstillatelse som regel fornyes?","o":["Hver uke","Hver måned","Hvert år","Hvert tiår"],"a":2,"e":"Leksjonen sier at man får en midlertidig oppholdstillatelse de tre eller fem første årene i Norge, og at den som regel må fornyes hvert år."},{"id":"new-in-norway-rules-for-residence#8","l":27,"q":"Etter hvor mange år kan man søke om permanent oppholdstillatelse?","o":["Etter 1 år","Etter 3 eller 5 år","Etter 8 år","Etter 10 år"],"a":1,"e":"Leksjonen sier at man kan søke om permanent oppholdstillatelse etter tre eller fem år."},{"id":"new-in-norway-rules-for-residence#9","l":27,"q":"Etter hvor mange år kan man søke om norsk statsborgerskap?","o":["Etter 3 år","Etter 5 år","Etter 6, 7 eller 8 år","Etter 10 år"],"a":2,"e":"Leksjonen sier at man kan søke om norsk statsborgerskap etter seks, sju eller åtte år."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#0","l":28,"q":"Hva er et av hovedmålene med introduksjonsprogrammet?","o":["At deltakerne skal lære om norske mattradisjoner","At deltakerne skal få grunnleggende ferdigheter i norsk","At deltakerne skal bli norske statsborgere","At deltakerne skal lære å kjøre bil"],"a":1,"e":"Et av målene med introduksjonsprogrammet er å gi deltakerne grunnleggende ferdigheter i norsk."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#1","l":28,"q":"Hvor lenge kan introduksjonsprogrammet vare?","o":["Mellom en måned og ett år","Mellom to måneder og to år","Mellom tre måneder og tre år","Mellom seks måneder og fem år"],"a":2,"e":"Programmet kan vare mellom tre måneder og tre år, avhengig av personens tidligere skolegang og erfaring."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#2","l":28,"q":"Hvem vedtok integreringsloven?","o":["Regjeringen","Stortinget","Kongen","Fylkeskommunene"],"a":1,"e":"Stortinget vedtok loven som kalles integreringsloven."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#3","l":28,"q":"Hvem tilbyr introduksjonsprogrammet?","o":["Kommunen","Fylkeskommunen","Bare staten","Private bedrifter"],"a":0,"e":"Integreringsloven gir blant annet norske kommuner i oppgave å tilby introduksjonsprogram til flyktninger."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#4","l":28,"q":"Hva er IKKE nevnt som en del av introduksjonsprogrammet?","o":["Norskopplæring","Hjelp til livsmestring i et nytt land","Opplæring i norsk matlaging","Arbeids- eller utdanningsrettet innhold"],"a":2,"e":"Introduksjonsprogrammet skal inneholde norskopplæring, hjelp til livsmestring, foreldreveiledning og arbeids- eller utdanningsrettet innhold, men ikke opplæring i matlaging."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#5","l":28,"q":"Får deltakerne i introduksjonsprogrammet økonomisk støtte?","o":["Nei, de får ingen støtte","Ja, de får økonomisk støtte","Bare de som har tidligere arbeidserfaring, får støtte","Bare de som består språktester, får støtte"],"a":1,"e":"De som deltar i programmet, får økonomisk støtte."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#6","l":28,"q":"Hva er målet for deltakerne når de er ferdige med introduksjonsprogrammet?","o":["At deltakerne blir norske statsborgere","At deltakerne blir kjent med norsk kultur","At deltakerne kommer inn i jobb eller utdanning","At deltakerne kan søke om førerkort"],"a":2,"e":"Målet med programmet er at deltakerne skal komme inn i jobb eller utdanning når programmet er ferdig."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#7","l":28,"q":"Hvorfor har Stortinget vedtatt integreringsloven?","o":["Fordi altfor mange mennesker vil flytte til Norge og bo her for alltid","Fordi norske arbeidsgivere ba om mange flere arbeidere fra andre land","Fordi det er vanskelig å finne jobb og forsørge seg selv i et nytt land","Fordi flyktninger må lære seg om norsk mat og norsk kultur veldig raskt"],"a":2,"e":"Myndighetene vet at det er vanskelig å finne jobb og forsørge seg selv den første tiden i et nytt land, og derfor har Stortinget vedtatt integreringsloven."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#8","l":28,"q":"Hva skal deltakerne i introduksjonsprogrammet få opplæring og kunnskap om?","o":["Norsk mat og norske skikker","Trafikkregler og kollektivtrafikk i Norge","Det norske samfunnet og norsk arbeidsliv","Norsk historie og den norske kongefamilien"],"a":2,"e":"Deltakerne skal lære norsk og få opplæring og kunnskap om det norske samfunnet og norsk arbeidsliv."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#9","l":28,"q":"Hvem skal få foreldreveiledning i introduksjonsprogrammet?","o":["Alle deltakere uten unntak","Deltakere med barn i alle aldre","Deltakere med barn under 18 år","Deltakere med barn over 18 år"],"a":2,"e":"Introduksjonsprogrammet skal inneholde foreldreveiledning for alle som har barn under 18 år."},{"id":"personal-finances-homes#0","l":29,"q":"Omtrent hvor mange boliger finnes det i Norge?","o":["Mellom 1,5 og 2 millioner","Mellom 2,7 og 3 millioner","Mellom 3,5 og 4 millioner","Mellom 4,5 og 5 millioner"],"a":1,"e":"Teksten sier at det finnes mellom 2,7 og 3 millioner boliger i Norge."},{"id":"personal-finances-homes#1","l":29,"q":"Hvilken boligtype er vanlig i store byer, som Oslo?","o":["For det meste eneboliger","For det meste blokker og bygårder","For det meste borettslag","For det meste selveierboliger"],"a":1,"e":"Teksten sier at mange av boligene i store byer, som Oslo, er blokker og bygårder."},{"id":"personal-finances-homes#2","l":29,"q":"Hvor mange prosent av husholdningene i Norge eier boligen sin selv?","o":["Rundt femti prosent","Rundt sekstifem prosent","Rundt åttito prosent","Rundt nittifem prosent"],"a":2,"e":"Teksten sier at rundt åttito prosent av husholdningene eier boligen sin selv."},{"id":"personal-finances-homes#3","l":29,"q":"Hvilken beskrivelse passer på et borettslag?","o":["Du eier hele bygningen selv","Du eier en andel og har enerett til bruk av boligen din","Du betaler ikke noe hver måned til noen","Du kan pusse opp og leie ut boligen uten å spørre noen"],"a":1,"e":"I et borettslag eier du en andel og har enerett til bruk av din bolig, men du må forholde deg til regler og vedtekter."},{"id":"personal-finances-homes#4","l":29,"q":"Når du kjøper bolig, hvor mange prosent av kjøpesummen må du ha spart selv (egenkapital)?","o":["5 prosent","10 prosent","25 prosent","50 prosent"],"a":1,"e":"Hovedregelen er at vi må ha spart 10 prosent av kjøpesummen selv."},{"id":"personal-finances-homes#5","l":29,"q":"Hvor mange prosent av kjøpesummen kan de fleste låne i banken når de kjøper bolig?","o":["50 prosent","75 prosent","80 prosent","90 prosent"],"a":3,"e":"Når vi har spart 10 prosent av kjøpesummen selv, kan vi låne 90 prosent i banken."},{"id":"personal-finances-homes#6","l":29,"q":"Hva må du ha for å kunne låne penger i banken til boligkjøp?","o":["En viss sparesum uten krav til prosent","Tidligere erfaring som boligeier","Fast inntekt eller annen økonomisk sikkerhet","Godkjenning fra kommunen"],"a":2,"e":"Teksten sier at vi må ha fast inntekt eller annen økonomisk sikkerhet for å få låne penger i banken."},{"id":"personal-finances-homes#7","l":29,"q":"Hvilken boligtype er vanligst i mindre kommuner?","o":["Blokker","Borettslag","Eneboliger","Utleieboliger"],"a":2,"e":"Teksten sier at mesteparten av boligene ofte er eneboliger i mindre kommuner."},{"id":"personal-finances-homes#8","l":29,"q":"Hva kan du gjøre med en selveierbolig uten å spørre noen?","o":["Selge den med en gang til hvem som helst","Gjøre den om til en virksomhet","Pusse opp og leie ut boligen","Dele den opp i mindre enheter"],"a":2,"e":"Med en selveierbolig kan du pusse opp og leie ut boligen uten å måtte spørre noen."},{"id":"personal-finances-homes#9","l":29,"q":"Hva skal husleien i et borettslag dekke?","o":["Bare utgiftene til din egen leilighet","Din andel av fellesgjelden i borettslaget, kommunale avgifter og huseierforsikring","Alle vedlikeholdskostnader for hele bygningen","Bare kommunale avgifter og ingenting annet"],"a":1,"e":"Husleien skal dekke din andel av fellesgjelden i borettslaget, kommunale avgifter og huseierforsikring."},{"id":"personal-finances-personal-finances#0","l":30,"q":"Hva er en inntekt?","o":["Penger som kommer inn på bankkontoen","Penger som går ut av bankkontoen","Penger vi har spart og satt i banken","Penger du låner i banken"],"a":0,"e":"Inntekter er alle penger som kommer inn på bankkontoen vår, for eksempel lønn, trygd og barnetrygd."},{"id":"personal-finances-personal-finances#1","l":30,"q":"Hva er forskjellen på bruttolønn og nettolønn?","o":["Bruttolønn er lønn før skatt, nettolønn er lønn etter skatt","Bruttolønn er lønn etter skatt, nettolønn er lønn før skatt","Bruttolønn er månedslønn, nettolønn er årslønn","Bruttolønn er lønn fra arbeid, nettolønn er penger fra trygd"],"a":0,"e":"Bruttolønn er lønn før skatt, og nettolønn er lønn etter skatt."},{"id":"personal-finances-personal-finances#2","l":30,"q":"Hva er barnetrygd i Norge?","o":["En økonomisk støtte som blir gitt for alle barn under 18 år som er bosatt i Norge","En økonomisk støtte som bare blir gitt for små barn under 3 år","Penger som arbeidsgivere betaler direkte til foreldrene som er ansatt hos dem","En økonomisk støtte som bare blir gitt til familier med lav inntekt"],"a":0,"e":"Barnetrygd er en økonomisk støtte for alle barn under 18 år som er bosatt i Norge, og den skal bidra til å dekke utgifter som følger med det å ha barn."},{"id":"personal-finances-personal-finances#3","l":30,"q":"Hva viser et budsjett?","o":["Inntekter og utgifter i en bestemt periode","Hvor mye penger du skylder banken","Hvor mye skatt du må betale til staten","Rentene du får på sparekontoen din"],"a":0,"e":"Et budsjett viser inntekter og utgifter i en bestemt periode, og det gjør det lettere for familien å planlegge hvordan de skal bruke pengene sine."},{"id":"personal-finances-personal-finances#4","l":30,"q":"Hva trenger du for å kunne åpne en bankkonto i Norge?","o":["Et norsk personnummer eller et norsk D-nummer","Et norsk førerkort eller et norsk vitnemål","En norsk arbeidskontrakt eller en norsk leiekontrakt","Et norsk telefonnummer eller en norsk hjemmeadresse"],"a":0,"e":"Teksten sier at du trenger et norsk personnummer eller et norsk D-nummer for å kunne åpne en bankkonto i Norge."},{"id":"personal-finances-personal-finances#5","l":30,"q":"For hvilke barn får foreldrene kontantstøtte?","o":["Barn mellom 13 og 19 måneder som ikke går i barnehage","Alle barn under 3 år","Barn der foreldrene er arbeidsledige","Barn som går heltid i barnehage"],"a":0,"e":"Kontantstøtte er en økonomisk støtte for barn mellom 13 og 19 måneder som ikke går i barnehage."},{"id":"personal-finances-personal-finances#6","l":30,"q":"Hva er avdrag på et banklån?","o":["Det vi betaler ned på selve lånet, altså en delvis nedbetaling av gjeld","Den månedlige rentebetalingen til banken","Hele beløpet du låner av banken","Et gebyr du må betale hvis du betaler for sent"],"a":0,"e":"Avdrag er det vi betaler ned på selve lånet, altså en delvis nedbetaling av gjeld."},{"id":"personal-finances-personal-finances#7","l":30,"q":"Hva er renter på et banklån?","o":["Prisen for å låne penger i banken","Listen over de månedlige betalingene du må gjøre","Det høyeste beløpet du kan låne","Et gebyr du må betale hvis du betaler tilbake lånet tidlig"],"a":0,"e":"Renter er prisen for å låne penger, og de beregnes i prosent av gjelden vi har."},{"id":"personal-finances-personal-finances#8","l":30,"q":"Hva må du ha for å logge deg inn i nettbanken i Norge?","o":["BankID eller kodebrikke","Pass og skolebevis","Tillatelse fra banksjefen","En spesiell lisens fra staten"],"a":0,"e":"For å logge deg inn i nettbanken må du enten ha BankID eller kodebrikke."},{"id":"personal-finances-personal-finances#9","l":30,"q":"Hva er vanlig i de fleste norske familier når det gjelder arbeid?","o":["Begge foreldrene er i lønnet arbeid utenfor hjemmet","Bare faren er i arbeid utenfor hjemmet","Bare moren er i arbeid utenfor hjemmet","Den ene forelderen jobber heltid, og den andre er ikke i arbeid"],"a":0,"e":"I de aller fleste familier er begge foreldrene i lønnet arbeid utenfor hjemmet, og begge voksne er ansvarlige for familiens økonomi."},{"id":"school-and-education-adult-education#0","l":31,"q":"Hva betyr begrepet «livslang læring»?","o":["At voksne må fullføre videregående skole før de begynner å jobbe","At vi lærer hele livet","At staten tilbyr gratis utdanning til alle innbyggere","At man kan jobbe samtidig som man studerer"],"a":1,"e":"Leksjonen sier: «At vi lærer hele livet, kalles for livslang læring.»"},{"id":"school-and-education-adult-education#1","l":31,"q":"Hvem har ansvaret for å tilby forberedende opplæring for voksne (FOV)?","o":["Fylkeskommunen","HK-dir","Kommunen","Private skoler"],"a":2,"e":"Leksjonen sier at kommunen har ansvaret for å tilby forberedende opplæring for voksne."},{"id":"school-and-education-adult-education#2","l":31,"q":"Fra hvilken alder har voksne rett til videregående opplæring hvis de ikke har det fra før?","o":["18 år","20 år","25 år eller eldre","30 år eller eldre"],"a":2,"e":"Leksjonen sier: «Voksne som er 25 år eller eldre, har rett til videregående opplæring hvis de ikke har det fra før.»"},{"id":"school-and-education-adult-education#3","l":31,"q":"Hva må voksne ha gjennomført før de kan begynne på videregående utdanning?","o":["De må ha jobbet i Norge i minst to år","De må ha bestått en norsktest","De må ha fullført grunnskole i Norge eller i et annet land","De må ha bodd i Norge i minst ett år"],"a":2,"e":"Leksjonen sier at man må ha fullført grunnskole i Norge eller i et annet land før man kan begynne på videregående utdanning."},{"id":"school-and-education-adult-education#4","l":31,"q":"Hva koster videregående utdanning for voksne innenfor det offentlige skolesystemet?","o":["Den er gratis for voksne i det offentlige skolesystemet","Den koster det samme som på en privat skole","Voksne må betale en avgift for hvert fag","Den er bare gratis for voksne under 25 år"],"a":0,"e":"Leksjonen sier at videregående utdanning for voksne er gratis innenfor det offentlige skolesystemet, mens private tilbud ikke er gratis."},{"id":"school-and-education-adult-education#5","l":31,"q":"Hvis en voksen har utdanning fra et annet land, hvor kan de søke om å få den godkjent i Norge?","o":["På kommunekontoret","Gjennom HK-dir","På en hvilken som helst offentlig skole i fylket","Gjennom Lånekassen"],"a":1,"e":"Leksjonen sier at man søker om godkjenning av utdanning fra utlandet gjennom HK-dir."},{"id":"school-and-education-adult-education#6","l":31,"q":"Hva kan være resultatet av en realkompetansevurdering?","o":["Bare avkortet opplæring","Man må begynne helt fra begynnelsen på en ny utdanning","Avkortet opplæring, opptak til studier, fritak fra deler av et studium, ny jobb eller høyere lønn","Bare godkjenning av utdanning fra utlandet"],"a":2,"e":"Leksjonen sier at vurderingen kan føre til avkortet opplæring, opptak til studier, fritak fra deler av et studium, ny jobb eller høyere lønn."},{"id":"school-and-education-adult-education#7","l":31,"q":"Ifølge leksjonen, hvorfor må arbeidstakerne holde seg oppdatert og lære nye ferdigheter?","o":["Fordi staten krever at alle arbeidstakere har høyere utdanning","Fordi samfunnet er i stadig endring, og ny teknologi har konsekvenser for arbeidslivet","Fordi voksne må fullføre videregående opplæring innen de er 25 år","Fordi levekostnadene i Norge krever høyere lønn"],"a":1,"e":"Leksjonen sier at samfunnet er i stadig endring, og at ny teknologi har konsekvenser for arbeidslivet, så arbeidstakerne må holde
