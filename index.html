fore 1000 AD","After Sweden and Denmark united with Norway in 1397","Only after Martin Luther started his religious rebellion"],"a":0,"e":"The text states that after Olav Haraldsson was killed in 1030, his son sought to make him a saint, and then more powerful people gradually adopted Christianity."},{"id":"history-the-middle-ages-and-the-unions#1","l":17,"q":"What was the approximate population of Norway around 1300 AD?","o":["150,000","250,000","400,000","500,000"],"a":2,"e":"The lesson states the population grew 'from 150,000 to around 400,000 in the years between 1000 and 1300 AD.'"},{"id":"history-the-middle-ages-and-the-unions#2","l":17,"q":"How many people worldwide are believed to have died from the Black Death?","o":["Between 10 and 30 million","Between 30 and 60 million","Between 75 and 200 million","Between 200 and 400 million"],"a":2,"e":"The text explicitly states 'Between 75 and 200 million people are believed to have died in the pandemic around the world.'"},{"id":"history-the-middle-ages-and-the-unions#3","l":17,"q":"What physical sign appeared on people infected with the Black Death?","o":["Red rashes covering the entire body","Purple bruises and heavy bleeding","Large, blue-black boils on their bodies","Swelling of the hands and feet"],"a":2,"e":"The lesson explains 'those who caught the disease developed large, blue-black boils on their bodies.'"},{"id":"history-the-middle-ages-and-the-unions#4","l":17,"q":"Which of the following was NOT mentioned as one of the first cities founded in Norway during the Middle Ages?","o":["Bergen","Trondheim","Stavanger","Lillehammer"],"a":3,"e":"The text lists Bergen (Bjørgvin), Trondheim (Nidaros), Oslo, Stavanger, and Tønsberg, but does not mention Lillehammer."},{"id":"history-the-middle-ages-and-the-unions#5","l":17,"q":"What happened to farmers during the Middle Ages who could not pay their taxes?","o":["They had to work as servants for the king","They had to join the church","They had to give up their land","They were sent to work in cities"],"a":2,"e":"The lesson states 'Anyone unable to pay these taxes had to give up their land.'"},{"id":"history-the-middle-ages-and-the-unions#6","l":17,"q":"In what year did Norway enter into a union with Denmark and Sweden?","o":["1300","1350","1397","1450"],"a":2,"e":"The text clearly states 'Norway was in union with Denmark and Sweden from 1397.'"},{"id":"history-the-middle-ages-and-the-unions#7","l":17,"q":"How long did the union between Denmark and Norway last?","o":["About 200 years","About 300 years","About 400 years","Until 1945"],"a":2,"e":"The lesson states 'the union between Denmark and Norway lasted until 1814.'"},{"id":"history-the-middle-ages-and-the-unions#8","l":17,"q":"What power did the German monk Martin Luther challenge starting in 1517?","o":["The king's authority over the church","The power of the Catholic Church","The nobility and their control of taxes","The Danish monarchy's rule over Norway"],"a":1,"e":"The text says 'The German monk Martin Luther challenged the power of the Catholic Church.'"},{"id":"history-the-middle-ages-and-the-unions#9","l":17,"q":"In what year did Protestantism stop being the state religion in Norway?","o":["1814","1905","2000","2012"],"a":3,"e":"The lesson states 'Protestantism was the state religion in Norway right up until 2012 when the state church system was discontinued.'"},{"id":"history-world-war-i-and-world-war-ii#0","l":18,"q":"In what year did Norway become an independent country?","o":["1898","1905","1913","1914"],"a":1,"e":"The lesson states 'Norway became an independent country again in 1905.'"},{"id":"history-world-war-i-and-world-war-ii#1","l":18,"q":"In 1898, what right did men over 25 gain in Norway?","o":["The right to work 8 hours a day","The right to vote in general elections","The right to receive sickness benefit","The right to use electricity"],"a":1,"e":"The text says 'Men over the age of 25 had the right to vote in general elections from the year 1898.'"},{"id":"history-world-war-i-and-world-war-ii#2","l":18,"q":"What transportation system was developed in Norwegian cities in the early 1900s?","o":["Underground metro systems","Electric tram networks","High-speed railways","Motor bus services"],"a":1,"e":"The lesson mentions that 'an electric tram network was developed in some of them' (referring to cities)."},{"id":"history-world-war-i-and-world-war-ii#3","l":18,"q":"According to a special act, who could develop hydroelectric power in Norway?","o":["Only the government","Only large companies","Private persons","Foreign investors"],"a":2,"e":"The text states 'A special act ensured that private persons could develop hydroelectric power, but the hydropower itself remained public property.'"},{"id":"history-world-war-i-and-world-war-ii#4","l":18,"q":"Which items were rationed in Norway during World War I?","o":["Coal, steel, and timber","Grain, coffee, and sugar","Flour, butter, and cheese","Oil, gas, and coal"],"a":1,"e":"The lesson explicitly names 'grain, coffee and sugar' as goods that were rationed during World War I."},{"id":"history-world-war-i-and-world-war-ii#5","l":18,"q":"What was the main economic characteristic of the interwar years in Norway?","o":["Rapid economic growth and industrialization","Financial crisis and widespread unemployment","Complete independence from European trade","The development of new military forces"],"a":1,"e":"The text states that the interwar period 'was marked by financial crisis in Norway. Many people were unemployed.'"},{"id":"history-world-war-i-and-world-war-ii#6","l":18,"q":"On what date were Norwegian territories occupied by German forces?","o":["1 September 1939","9 April 1940","8 May 1945","9 December 1939"],"a":1,"e":"The lesson clearly states 'Norway was occupied by German forces on 9 April 1940.'"},{"id":"history-world-war-i-and-world-war-ii#7","l":18,"q":"Who led the pro-German government that ruled Norway during World War II?","o":["King Haakon VII","Edvard Munch","Vidkun Quisling","Einar Gerhardsen"],"a":2,"e":"The text states 'Norway was governed by a pro-German government led by Vidkun Quisling.'"},{"id":"history-world-war-i-and-world-war-ii#8","l":18,"q":"Approximately how many Norwegians fled to Sweden during World War II?","o":["Around 10,000","Around 30,000","Around 50,000","Around 100,000"],"a":2,"e":"The lesson specifies 'Around 50,000 Norwegians fled to Sweden during the war.'"},{"id":"history-world-war-i-and-world-war-ii#9","l":18,"q":"How many Norwegian Jews survived and returned to Norway after being sent to concentration camps?","o":["38","103","773","1,000"],"a":0,"e":"The text states that '773 were sent to concentration camps, and only 38 survived and returned to Norway after the war.'"},{"id":"human-rights-and-democracy-democracy-in-norway#0","l":19,"q":"How many counties are there in Norway?","o":["14","15","16","20"],"a":1,"e":"The lesson states there are 15 counties in Norway (as of 01.01.2025)."},{"id":"human-rights-and-democracy-democracy-in-norway#1","l":19,"q":"Which of the following is a responsibility of the central government?","o":["Refuse collection","County roads","Upper secondary education","Foreign policy"],"a":3,"e":"Foreign policy is listed as one of the central government's areas of responsibility; the others belong to municipalities or counties."},{"id":"human-rights-and-democracy-democracy-in-norway#2","l":19,"q":"Which area is the responsibility of county authorities?","o":["Kindergartens","Care for the elderly","Upper secondary education","Primary schools"],"a":2,"e":"Upper secondary education is listed as one of the county authorities' areas of responsibility; the others are municipal responsibilities."},{"id":"human-rights-and-democracy-democracy-in-norway#3","l":19,"q":"How many members does the Storting have?","o":["150","157","169","176"],"a":2,"e":"The lesson states that the Storting has 169 members elected by the people for a term of four years."},{"id":"human-rights-and-democracy-democracy-in-norway#4","l":19,"q":"For how long are Storting members elected to serve?","o":["2 years","3 years","4 years","5 years"],"a":2,"e":"Storting members are elected for a term of four years according to the lesson."},{"id":"human-rights-and-democracy-democracy-in-norway#5","l":19,"q":"Which of the following is one of the Storting's most important functions?","o":["Execute laws in practice","Adopt the national budget","Manage county roads","Provide kindergarten services"],"a":1,"e":"Adopting the national budget is listed as one of the Storting's most important functions in the lesson."},{"id":"human-rights-and-democracy-democracy-in-norway#6","l":19,"q":"Can members of the public attend the Storting to listen to politicians debate?","o":["No, the Storting is closed to the public","Yes, anyone who wants to can attend","Only political party members can attend","Only during general elections"],"a":1,"e":"The lesson states that everyone who wants to can attend the Storting and listen to the politicians debating different issues."},{"id":"human-rights-and-democracy-democracy-in-norway#7","l":19,"q":"How often does the government meet with the King as the Council of State?","o":["Every Monday","Every Wednesday","Every Friday","Every Sunday"],"a":2,"e":"The lesson states that the government has a meeting with the King every Friday, called the Council of State."},{"id":"human-rights-and-democracy-democracy-in-norway#8","l":19,"q":"Into how many independent branches does the separation of powers divide government in Norway?","o":["2","3","4","5"],"a":1,"e":"The separation of powers divides government into three independent branches: legislative (Storting), executive (government), and judiciary (courts)."},{"id":"human-rights-and-democracy-democracy-in-norway#9","l":19,"q":"What is the relationship between the government and the Storting regarding new laws?","o":["The government adopts laws and the Storting implements them","The government proposes laws and the Storting adopts them","The Storting proposes laws and the government adopts them","Both propose and adopt laws equally"],"a":1,"e":"The lesson states that the government proposes new laws and amendments, but the Storting adopts the laws and legislative amendments."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#0","l":20,"q":"When was the UN Universal Declaration of Human Rights adopted?","o":["1945","1948","1950","1952"],"a":1,"e":"The lesson states 'The UN Universal Declaration of Human Rights was adopted in 1948.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#1","l":20,"q":"What is the voting age in Norway?","o":["16 years","18 years","20 years","21 years"],"a":1,"e":"The lesson clearly states 'The voting age in Norway is 18 years.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#2","l":20,"q":"Which of the following is NOT allowed in Norway under freedom of speech?","o":["Criticizing government policies","Discussing religion","Making racist statements","Sharing political opinions"],"a":2,"e":"The lesson states 'people are not allowed to make racist and other hateful statements, either verbally or in writing.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#3","l":20,"q":"What does due process protection mean regarding imprisonment?","o":["Anyone can be imprisoned if the government decides it","No one can be imprisoned without a trial","Only wealthy people need a trial before imprisonment","Trials are not necessary for serious crimes"],"a":1,"e":"The lesson states 'no one can be sentenced to imprisonment without a trial.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#4","l":20,"q":"From what age can someone join or leave a religious community of their own choice in Norway?","o":["10 years","13 years","15 years","18 years"],"a":2,"e":"The lesson states 'From the age of 15, everyone has the right to join or leave a religious or life stance community of their own initiative.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#5","l":20,"q":"Who is allowed to vote in general elections in Norway?","o":["People who have lived in Norway for at least 6 months","Norwegian citizens who are at least 18 years old","All residents of Norway who are at least 16 years old","People who have lived in Norway for the last 3 years"],"a":1,"e":"The lesson says that you have to be a Norwegian citizen to vote in general elections and that the voting age in Norway is 18 years."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#6","l":20,"q":"Which of the following is described in the lesson as a threat to democracy?","o":["High voter participation","Strong trust in politicians","Fake news and hate speech","Independent judges"],"a":2,"e":"The lesson lists 'Fake news and hate speech that stop open debate in society' as one of the elements that may represent threats to democracy."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#7","l":20,"q":"Which of these is an example of freedom of assembly?","o":["The ability to travel to any country","The right to participate in lawful demonstrations","The right to watch television without restrictions","The right to work without a contract"],"a":1,"e":"The lesson states 'People have the right to express their opinions in lawful demonstrations' as part of freedom of assembly."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#8","l":20,"q":"What principle ensures that everyone has the same rights and opportunities regardless of age, ethnicity, or gender?","o":["Private wealth","Government approval","Equality","Family status"],"a":2,"e":"The lesson states under 'Equality' that 'Everyone shall have the same rights and opportunities regardless of age, ethnicity, functional ability, gender, religion and sexual orientation.'"},{"id":"human-rights-and-democracy-democratic-rights-and-duties#9","l":20,"q":"According to the lesson, what foundation is Norwegian society based on to a great extent?","o":["Strict government control","Individual competition","Mutual trust","Limited citizen rights"],"a":2,"e":"The lesson states 'Norwegian society is to a great extent based on mutual trust,' explaining that authorities trust citizens to provide correct information and comply with laws, and citizens trust they will receive fair treatment."},{"id":"human-rights-and-democracy-elections-and-political-parties#0","l":21,"q":"How often are political elections held in Norway?","o":["Every year","Every second year","Every third year","Every four years"],"a":1,"e":"Political elections are held in Norway every two years, which is the same as every second year."},{"id":"human-rights-and-democracy-elections-and-political-parties#1","l":21,"q":"What does it mean that elections are held by secret ballot in Norway?","o":["You must keep your vote secret by law","You don't have to tell others which party you voted for","It is illegal to vote publicly","Only some people can know your vote"],"a":1,"e":"Secret ballot means you don't need to tell other people which party you vote for."},{"id":"human-rights-and-democracy-elections-and-political-parties#2","l":21,"q":"What is the voting age in Norway?","o":["16 years","17 years","18 years","21 years"],"a":2,"e":"The voting age in Norway is 18 years."},{"id":"human-rights-and-democracy-elections-and-political-parties#3","l":21,"q":"What must you be to vote in general elections in Norway?","o":["A resident of Norway","A Norwegian citizen","Living in Norway for 1 year","An adult over 18"],"a":1,"e":"You have to be a Norwegian citizen to vote in general elections."},{"id":"human-rights-and-democracy-elections-and-political-parties#4","l":21,"q":"How long must you have lived in Norway to vote in county and municipal council elections?","o":["At least 1 year","At least 2 years","At least 3 years","At least 5 years"],"a":2,"e":"You must have lived in Norway for the last three years to vote in county and municipal council elections."},{"id":"human-rights-and-democracy-elections-and-political-parties#5","l":21,"q":"When did Norwegian women gain universal suffrage?","o":["1898","1905","1913","1920"],"a":2,"e":"Women were given universal suffrage in Norway in 1913."},{"id":"human-rights-and-democracy-elections-and-political-parties#6","l":21,"q":"When did Norwegian men gain universal suffrage?","o":["1890","1898","1905","1913"],"a":1,"e":"Norwegian men have had universal suffrage since 1898."},{"id":"human-rights-and-democracy-elections-and-political-parties#7","l":21,"q":"How many political parties are there in Norway?","o":["Around 10","Around 20","Around 30","Around 40"],"a":1,"e":"There are around twenty different political parties in Norway."},{"id":"human-rights-and-democracy-elections-and-political-parties#8","l":21,"q":"What does a political party set out in its manifesto?","o":["The history of the party and the names of its leaders","The issues it wants to prioritise in the election period","The number of members the party has in each municipality","The names and home addresses of all the party's members"],"a":1,"e":"In the manifesto, the party sets out which issues it wants to prioritise in the upcoming election period, i.e. for the next four years."},{"id":"human-rights-and-democracy-elections-and-political-parties#9","l":21,"q":"According to the lesson, on what kind of scale can political parties in Norway be placed?","o":["From 'democratic' to 'authoritarian'","From 'young' to 'old'","From 'socialist' to 'conservative'","From 'urban' to 'rural'"],"a":2,"e":"The big political parties can be roughly placed on a scale from 'socialist' to 'conservative'."},{"id":"human-rights-and-democracy-human-rights#0","l":22,"q":"What is meant by saying human rights are 'universal'?","o":["They are rights only for a few countries","They are rights that all humans have, regardless of background","They are rights that change from year to year","They are rights that are different for men and women"],"a":1,"e":"The lesson defines human rights as universal because they are rights that all people have as human beings, not because of where they live or their background."},{"id":"human-rights-and-democracy-human-rights#1","l":22,"q":"In what year was the Universal Declaration of Human Rights adopted by the UN?","o":["1945","1948","1950","1960"],"a":1,"e":"The lesson states that 'The UN adopted the Universal Declaration of Human Rights in 1948.'"},{"id":"human-rights-and-democracy-human-rights#2","l":22,"q":"How many UN member states have endorsed the Universal Declaration of Human Rights?","o":["100 states","150 states","193 states","250 states"],"a":2,"e":"The lesson specifies that 'All of the 193 member states of the UN have endorsed this declaration.'"},{"id":"human-rights-and-democracy-human-rights#3","l":22,"q":"According to the Universal Declaration of Human Rights, whose human rights are protected?","o":["Only citizens of Western countries","Everyone, regardless of their religion","Only people who work for the UN","Only people over the age of 18"],"a":1,"e":"The lesson states that 'everyone has the same human rights, regardless of their gender, religion, race, political opinions, nationality etc.'"},{"id":"human-rights-and-democracy-human-rights#4","l":22,"q":"Which right is specifically mentioned in the declaration?","o":["The right to own a business","The right to free housing","The right to liberty and security of person","The right to have a car"],"a":2,"e":"The lesson explicitly lists 'everyone has the right to liberty and security of person' as one of the rights in the declaration."},{"id":"human-rights-and-democracy-human-rights#5","l":22,"q":"What does the declaration state about torture?","o":["Torture is allowed in emergencies","Torture is only wrong in some countries","All forms of torture are prohibited","Torture is allowed if the government approves it"],"a":2,"e":"The lesson clearly states that 'all forms of torture are prohibited.'"},{"id":"human-rights-and-democracy-human-rights#6","l":22,"q":"How have the principles of the UN Declaration of Human Rights affected Norway?","o":["They have had no effect on Norwegian laws","Large parts of the declaration have been incorporated into Norwegian laws","They have been completely rejected by Norway","They only affect international relations, not Norwegian laws"],"a":1,"e":"The lesson indicates that 'Large tracts of the UN Universal Declaration of Human Rights have been incorporated into Norwegian laws.'"},{"id":"human-rights-and-democracy-human-rights#7","l":22,"q":"According to the declaration, how should people be allowed to influence their government?","o":["Through protests only","By speaking to government officials privately","By voting in free elections held by secret ballot","By paying taxes to influence policies"],"a":2,"e":"The lesson states that 'everyone has the right to influence the political situation in their home country by voting in free elections held by secret ballot.'"},{"id":"human-rights-and-democracy-human-rights#8","l":22,"q":"Which statement about the declaration is correct?","o":["The declaration says some people have more rights than others","The declaration says rights depend on your religion","The declaration says everyone is born free and equal in human dignity and rights","The declaration says only rich people have human rights"],"a":2,"e":"The lesson directly quotes from the declaration: 'everyone is born free and equal in human dignity and rights.'"},{"id":"human-rights-and-democracy-human-rights#9","l":22,"q":"Which of the following is NOT a principle of the Universal Declaration of Human Rights according to the lesson?","o":["Everyone is born free and equal","All forms of torture are prohibited","Everyone has the right to vote in free elections with secret ballot","Everyone has the right to unlimited wealth"],"a":3,"e":"The lesson does not mention anything about unlimited wealth; the other three are all explicitly stated as principles from the declaration."},{"id":"leisure-activities-dugnad#0","l":23,"q":"What is the main characteristic of dugnad work?","o":["It is paid work that must be done","It is voluntary and unpaid","It is mandatory for all citizens","It is only for professional workers"],"a":1,"e":"The lesson states that dugnad is voluntary unpaid work."},{"id":"leisure-activities-dugnad#1","l":23,"q":"In a kindergarten, what are typical examples of dugnad work?","o":["Teaching children lessons and planning menus","Washing toys and fixing outdoor areas","Managing the kindergarten's budget","Hiring new staff"],"a":1,"e":"The lesson mentions that in kindergartens, parents might wash toys or fix up the outdoor areas."},{"id":"leisure-activities-dugnad#2","l":23,"q":"Which of the following is NOT mentioned as a place where dugnad occurs?","o":["Housing cooperatives","Clubs and associations","Kindergartens","Banks and offices"],"a":3,"e":"The lesson describes dugnad in housing cooperatives, clubs and associations, and kindergartens, but not in banks and offices."},{"id":"leisure-activities-dugnad#3","l":23,"q":"In housing cooperatives, when does dugnad typically happen?","o":["In summer to prepare for holidays","In autumn to prepare for winter","In spring to tidy up after winter","In winter to prepare the buildings"],"a":2,"e":"The lesson states that housing cooperative residents often take part in a dugnad in spring to tidy up after the winter."},{"id":"leisure-activities-dugnad#4","l":23,"q":"How might parents raise money for children's leisure activities through dugnad?","o":["By asking the government for grants","By charging children a membership fee","By organizing jumble sales or cultural events","By selling toys to other families"],"a":2,"e":"The lesson says parents could organize a jumble sale or a cultural event to raise money for the association."},{"id":"leisure-activities-dugnad#5","l":23,"q":"Is dugnad a tradition unique to Norway?","o":["Yes, it was invented in Norway and exists nowhere else","No, most farming communities in the world have a similar tradition","No, but it only exists in the countries of Scandinavia","Yes, it is a new custom that started in Norway in 2004"],"a":1,"e":"The lesson says that dugnad is an old custom in Norway and that there is a similar tradition in most farming communities around the world."},{"id":"leisure-activities-dugnad#6","l":23,"q":"What happened to the word 'dugnad' in 2004?","o":["It was first used in Norwegian language","It was added to all English dictionaries","It was voted Norway's national word","It became an official legal requirement"],"a":2,"e":"The lesson states that in 2004, the word 'dugnad' was voted Norway's national word."},{"id":"leisure-activities-dugnad#7","l":23,"q":"Based on the conversation between Henrik and Arne, what is their view on parents not participating in dugnad?","o":["They think it is completely acceptable and normal","They think it does not matter as long as the work gets done","They think it looks bad and shows a lack of community involvement","They think only parents like Truls's should be allowed exceptions"],"a":2,"e":"Henrik says 'it still doesn't look good' when referring to parents not attending, showing both men are concerned about non-participation."},{"id":"leisure-activities-dugnad#8","l":23,"q":"According to the lesson, what is described as an 'old custom' in Norway?","o":["Paying children to help with household work","Organizing community summer festivals","Dugnad","Teaching children formal traditions"],"a":2,"e":"The lesson explicitly states that 'Dugnad is an old custom in Norway.'"},{"id":"leisure-activities-dugnad#9","l":23,"q":"What alternative arrangement do some clubs and associations offer regarding dugnad participation?","o":["They allow members to work fewer hours than others","They allow members to pay a certain amount to not participate","They hire professional workers to complete all the work","They make participation mandatory for all members"],"a":1,"e":"The lesson mentions that some clubs and associations offer an arrangement where you can pay a certain amount to not take part in a dugnad."},{"id":"leisure-activities-political-engagement#0","l":24,"q":"According to the lesson, what is every person living in a democracy responsible for?","o":["Voting in local elections","Becoming a member of a political party","Working as a professional politician","Ensuring democracy works"],"a":3,"e":"The text states 'Everyone who lives in a democracy is responsible for ensuring democracy works.'"},{"id":"leisure-activities-political-engagement#1","l":24,"q":"By what percentage did election turnout among the youngest voters increase from 2007 to 2011?","o":["Less than 5%","Exactly 10%","More than 10%","More than 20%"],"a":2,"e":"The lesson says 'Election turnout among the youngest voters increased by more than ten per cent from 2007 to 2011.'"},{"id":"leisure-activities-political-engagement#2","l":24,"q":"Which of the following is an example of informal political participation?","o":["Attending a protest march","Taking part in an election campaign","Proposing a matter to a political party","Voting in party elections"],"a":0,"e":"The text lists 'petitions, protest marches and discussions in social media' as examples of informal political participation."},{"id":"leisure-activities-political-engagement#3","l":24,"q":"According to the lesson, membership of organisations gives practice in discussions, board work and votes. What kind of processes are these?","o":["Economic processes","Legal processes","Religious processes","Democratic processes"],"a":3,"e":"The lesson states that membership of different organisations provides knowledge of and practice in different democratic processes, such as discussions, board work and elections and votes."},{"id":"leisure-activities-political-engagement#4","l":24,"q":"How has political engagement changed among young Norwegians?","o":["It has increased compared to before","It has decreased significantly","It has stayed the same","It is less common than sports activities"],"a":0,"e":"The text says 'Young Norwegians are more politically active than they used to be.'"},{"id":"leisure-activities-political-engagement#5","l":24,"q":"According to the lesson, what is important for people in a democracy to do?","o":["Never disagree with the government","Be active and keep up-to-date with what is happening","Stay away from political discussions","Always follow what politicians say"],"a":1,"e":"The lesson states 'It is important that people are active and keep up-to-date with what is happening.'"},{"id":"leisure-activities-political-engagement#6","l":24,"q":"Which action is an example of formal political participation?","o":["Taking part in an election campaign","Writing a critical post on social media","Organizing a protest march","Signing a petition"],"a":0,"e":"The text defines formal participation as 'propose matters for consideration for a political party or take part in an election campaign.'"},{"id":"leisure-activities-political-engagement#7","l":24,"q":"Which of the following has increased among young Norwegians according to the lesson?","o":["Only election turnout","Only membership in political youth organisations","Neither of these","Both election turnout and membership in political youth organisations"],"a":3,"e":"The lesson states both increased: 'Election turnout among the youngest voters increased' and 'Membership of political youth organisations has also increased.'"},{"id":"leisure-activities-political-engagement#8","l":24,"q":"What are examples of democratic processes that people learn through membership of political organisations?","o":["Discussions, board work, elections, and votes","Only voting","Discussions and board work only","How to become a professional politician"],"a":0,"e":"The text says membership provides practice in 'discussions, board work and elections and votes.'"},{"id":"leisure-activities-political-engagement#9","l":24,"q":"According to the lesson, what is important regarding opinions in a democracy?","o":["Never disagree with others","Everyone is entitled to their opinions and should express them","Keep opinions private and silent","Only express government-approved opinions"],"a":1,"e":"The text states 'It is also important that everyone is entitled to their opinions, and that they express them.'"},{"id":"leisure-activities-social-arenas#0","l":25,"q":"Besides family, schools, and workplaces, what other examples of social arenas are mentioned in the lesson?","o":["Hospitals, government offices, and prisons","Courses, choirs, and organizations","Shopping malls, cinemas, and restaurants","Sports stadiums, airports, and hotels"],"a":1,"e":"The lesson mentions 'Many adults take different courses or further education in their spare time. Some people sing in a choir or play an instrument, and others are involved in various organisations.'"},{"id":"leisure-activities-social-arenas#1","l":25,"q":"According to the lesson, how can parents be involved in their children's organised leisure activities?","o":["They pay for all the equipment and fees","They force the children to take part","They take turns driving and picking up children","They must be present at every single practice"],"a":2,"e":"The lesson says that maybe the parents take turns at driving children to and picking them up from various activities."},{"id":"leisure-activities-social-arenas#2","l":25,"q":"What is described as an organization of public utility where people do voluntary work?","o":["The Red Cross","Insurance companies","Shopping centers","Airlines"],"a":0,"e":"The lesson lists 'Example include the Red Cross, sports clubs, cultural events etc.' as organizations of public utility linked to voluntary work."},{"id":"leisure-activities-social-arenas#3","l":25,"q":"Why is participating in organized leisure activities particularly beneficial for people who have recently moved to Norway?","o":["It is cheaper than other activities","It is required by Norwegian law","It is a great way to get to know people","It increases their salary"],"a":2,"e":"The lesson states 'This can be a great way for people who have recently arrived in Norway or have moved to a new area to get to know people.'"},{"id":"leisure-activities-social-arenas#4","l":25,"q":"According to the lesson, what is one way that voluntary organisations help people learn about democracy?","o":["Participants gain experience through meetings, elections, and voting","They teach democracy only in schools","They vote for all government members","They create new national laws"],"a":0,"e":"The lesson says 'The participants gain experience of the rules of democracy such as taking part in meetings, elections and voting.'"},{"id":"leisure-activities-social-arenas#5","l":25,"q":"What misunderstanding happened in the dialogue between the immigrant and the Norwegian?","o":["The immigrant never invited for a special day and time","The Norwegian had forgotten the day and time of the visit","The Norwegian was offended by being invited to visit","The two of them did not speak the same language"],"a":0,"e":"The lesson explains that in Norway an invitation must be for a special day and time, and Norwegians rarely visit friends without arranging it in advance."},{"id":"leisure-activities-social-arenas#6","l":25,"q":"What does the lesson identify as an example of an unwritten rule?","o":["How we greet each other","How to calculate taxes","How to get a driver's license","How to apply for a job"],"a":0,"e":"The lesson states 'One example is how we greet each other' when discussing unwritten rules that differ from culture to culture."},{"id":"leisure-activities-social-arenas#7","l":25,"q":"According to the lesson, what is the typical response when a Norwegian asks 'Hi, how are you?'?","o":["Thanks, fine. You?","I'm not doing well","I'm very busy, leave me alone","Not your business"],"a":0,"e":"The lesson provides the example 'The common response is: \"Thanks, fine. You?\"'"},{"id":"leisure-activities-social-arenas#8","l":25,"q":"According to the lesson, what advantage can a bigger network from volunteering give you?","o":["It can make a difference to work, education and day-to-day life","It guarantees that you get a permanent job in your local community","It means that you will no longer need any education","It automatically gives you a higher salary at work"],"a":0,"e":"The lesson states that you will gain a bigger network, which can make a difference in relation to work, education and day-to-day life."},{"id":"leisure-activities-social-arenas#9","l":25,"q":"What does the lesson say about how voluntary organisations influence society?","o":["They influence political processes locally and nationally","They are run entirely by the state and the government","They only help the wealthy people in society","They are funded only by the taxes that people pay"],"a":0,"e":"The lesson says that many voluntary organisations also influence political processes, both in the local community and at the national level."},{"id":"new-in-norway-a-life-in-norway#0","l":26,"q":"How many children are born in Norway each year?","o":["Around 5,000","Around 25,000","Around 50,000","Around 100,000"],"a":2,"e":"The lesson states that slightly more than fifty thousand children are born in Norway each year."},{"id":"new-in-norway-a-life-in-norway#1","l":26,"q":"What is the average age of a Norwegian woman when she has her first child?","o":["25 years old","30 years old","35 years old","40 years old"],"a":1,"e":"According to the lesson, Norwegian women are 30 years old on average when they have their first child."},{"id":"new-in-norway-a-life-in-norway#2","l":26,"q":"What is the maximum prison sentence for performing the circumcision of girls in Norway?","o":["Imprisonment for up to 2 years","Imprisonment for up to 5 years","Imprisonment for up to 15 years","Imprisonment for up to 25 years"],"a":2,"e":"The lesson states that the sentence for performing or contributing to the circumcision of girls is imprisonment for up to 15 years, and that it can also lead to expulsion from Norway."},{"id":"new-in-norway-a-life-in-norway#3","l":26,"q":"How many weeks of parental benefit do parents who are both in paid employment receive in total?","o":["41 weeks","51 weeks","61 weeks","71 weeks"],"a":2,"e":"The lesson specifies that parents who are both in paid employment are entitled to a total of 61 weeks' parental benefit."},{"id":"new-in-norway-a-life-in-norway#4","l":26,"q":"What is the age of majority in Norway?","o":["16 years old","18 years old","20 years old","21 years old"],"a":1,"e":"The lesson clearly states that the age of majority in Norway is 18 years."},{"id":"new-in-norway-a-life-in-norway#5","l":26,"q":"At what grade does lower secondary school start in Norway?","o":["Grade 6","Grade 7","Grade 8","Grade 9"],"a":2,"e":"The lesson explains that primary school runs from grade 1 to 7 and lower secondary school runs from grade 8 to 10."},{"id":"new-in-norway-a-life-in-norway#6","l":26,"q":"What is the official retirement age for both men and women in Norway?","o":["62 years old","65 years old","67 years old","70 years old"],"a":2,"e":"The lesson states that the age of retirement in Norway is 67 for both men and women."},{"id":"new-in-norway-a-life-in-norway#7","l":26,"q":"What is the average age range for Norwegian people to get married for the first time?","o":["Between 20 and 30 years old","Between 30 and 40 years old","Between 40 and 50 years old","Between 50 and 60 years old"],"a":1,"e":"The lesson indicates that the average age people get married for the first time in Norway is between thirty and forty for both men and women."},{"id":"new-in-norway-a-life-in-norway#8","l":26,"q":"Which statement about housework in Norway is correct?","o":["Men spend significantly more time on housework than women.","Men and women spend exactly the same time on housework.","Women spend significantly more time on housework than men.","Only women do housework, and men never help at home."],"a":2,"e":"The lesson says it is common for women and men to share housework chores, but women spend significantly more time each week on housework than men do."},{"id":"new-in-norway-a-life-in-norway#9","l":26,"q":"How much student loan do many Norwegian students have by the time they complete their studies?","o":["Around NOK 100,000","Around NOK 200,000","More than NOK 300,000","More than NOK 500,000"],"a":2,"e":"The lesson states that many students have a student loan of more than NOK 300,000 by the time they complete their studies."},{"id":"new-in-norway-rules-for-residence#0","l":27,"q":"What does the word 'immigrant' mean in this lesson?","o":["A person born in another country who now lives in Norway","A person born in Norway who has lived in another country","A person who works temporarily in another country","A person who has lived in the same country for more than five years"],"a":0,"e":"The lesson defines an immigrant as 'a person who was born abroad, but lives in Norway.'"},{"id":"new-in-norway-rules-for-residence#1","l":27,"q":"If someone from an EU/EEA country wants to work in Norway, what must they do?","o":["Apply for a residence permit from the immigration office","Register with the police","Pass a Norwegian language test","Get a job contract first"],"a":1,"e":"The lesson states that EU/EEA workers 'can work in Norway without applying for a residence permit, but they must register with the police.'"},{"id":"new-in-norway-rules-for-residence#2","l":27,"q":"According to the lesson, resettlement refugees come to Norway through which organization?","o":["The Norwegian government's immigration office","A private international organization","An agreement with the UNHCR","The Red Cross"],"a":2,"e":"The lesson states that 'Resettlement refugees or quota refugees come to Norway in agreement with the UNHCR (UN).'"},{"id":"new-in-norway-rules-for-residence#3","l":27,"q":"What is one valid ground for being granted asylum in Norway?","o":["Being unemployed","Being persecuted because of sexual orientation","Having a job offer in Norway","Coming from a poor country"],"a":1,"e":"The lesson lists persecution based on 'race, religion, nationality, sexual orientation or political work' as valid grounds for asylum."},{"id":"new-in-norway-rules-for-residence#4","l":27,"q":"How do asylum seekers come to Norway and apply for asylum?","o":["They are invited by the Norwegian government","They come through an employer's sponsorship","They come to Norway themselves and apply for asylum","They come through the UNHCR resettlement program"],"a":2,"e":"The lesson explains that 'Asylum seekers come to Norway themselves and apply for asylum.'"},{"id":"new-in-norway-rules-for-residence#5","l":27,"q":"What can family members of people with a residence permit apply for?","o":["A work visa","Family reunification","The introduction programme","Norwegian citizenship"],"a":1,"e":"The lesson states that 'Family members of persons with a residence permit in Norway can apply for family reunification.'"},{"id":"new-in-norway-rules-for-residence#6","l":27,"q":"What is the official term for a person granted asylum on humanitarian grounds or a resettlement refugee?","o":["An immigrant","An asylum seeker","A refugee","A visitor"],"a":2,"e":"The lesson defines 'Persons who have been granted asylum/residence on grounds of strong humanitarian considerations, and resettlement refugees' as 'refugees.'"},{"id":"new-in-norway-rules-for-residence#7","l":27,"q":"How often does a temporary residence permit generally have to be renewed?","o":["Every week","Every month","Every year","Every decade"],"a":2,"e":"The lesson says that during the first three or five years people have a temporary residence permit, and that it generally has to be renewed every year."},{"id":"new-in-norway-rules-for-residence#8","l":27,"q":"After how many years can a person apply for a permanent residence permit?","o":["1 year","Three to five years","8 years","10 years"],"a":1,"e":"The lesson explains that 'After three or five years, you can apply for a permanent residence permit.'"},{"id":"new-in-norway-rules-for-residence#9","l":27,"q":"After how many years can a person apply for Norwegian citizenship?","o":["After 3 years","After 5 years","After 6, 7, or 8 years","After 10 years"],"a":2,"e":"The lesson states that 'After six, seven or eight years, you can apply for Norwegian citizenship.'"},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#0","l":28,"q":"What is one of the main objects of the introduction programme?","o":["To teach participants about Norwegian food traditions","To give participants basic Norwegian language skills","To train participants to become Norwegian citizens","To teach participants how to drive cars"],"a":1,"e":"The lesson states that one object of the introduction programme is to give participants basic Norwegian language skills."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#1","l":28,"q":"How long can the introduction programme last?","o":["Between 1 month and 1 year","Between 2 months and 2 years","Between 3 months and 3 years","Between 6 months and 5 years"],"a":2,"e":"The lesson states that the programme can last between three months and three years, depending on the person's previous schooling and experience."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#2","l":28,"q":"Which body adopted the Integration Act?","o":["The government","The Storting","The king","The counties"],"a":1,"e":"The lesson states that the Norwegian parliament, the Storting, adopted the Integration Act."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#3","l":28,"q":"Who organises the introduction programme?","o":["Norwegian municipalities","County authorities","The national government only","Private companies"],"a":0,"e":"The lesson states that the Integration Act tasks Norwegian municipalities with offering the introduction programme to refugees."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#4","l":28,"q":"Which of the following is NOT mentioned as part of the introduction programme?","o":["Norwegian language tuition","Help to master life in a new country","Training in Norwegian cuisine","Content relating to work or education"],"a":2,"e":"The lesson lists four components of the programme: Norwegian language tuition, help to master life, parental guidance, and content relating to work or education, but does not mention cuisine training."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#5","l":28,"q":"Do participants in the introduction programme receive financial support?","o":["No, they do not receive any support","Yes, they receive financial support","Only those with previous work experience receive support","Only those who pass language tests receive support"],"a":1,"e":"The lesson states that those who participate in the programme receive financial support."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#6","l":28,"q":"What is the intended outcome after completing the introduction programme?","o":["Participants become Norwegian citizens","Participants become familiar with Norwegian culture","Participants enter the labour market or education","Participants can apply for a driving license"],"a":2,"e":"The lesson states that the intention of the programme is for the participants to enter the labour market or education when they have completed the programme."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#7","l":28,"q":"Why did the Storting adopt the Integration Act?","o":["Because too many people want to move to Norway and live here for good","Because Norwegian employers asked for more workers from other countries","Because it is difficult to find a job and support yourself in a new country","Because refugees must learn about Norwegian food and culture very quickly"],"a":2,"e":"The lesson says the authorities realise it is difficult for people to find a job and support themselves when they first come to a new country, so the Storting adopted the Integration Act."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#8","l":28,"q":"In the introduction programme, what do participants gain knowledge and training in?","o":["Norwegian food and Norwegian customs","Traffic rules and public transport in Norway","Norwegian society and the Norwegian labour market","Norwegian history and the Norwegian royal family"],"a":2,"e":"The lesson states that participants learn the Norwegian language and gain knowledge and training in Norwegian society and the Norwegian labour market."},{"id":"new-in-norway-the-introduction-programme-and-the-integration-act#9","l":28,"q":"To whom is parental guidance offered in the introduction programme?","o":["To all participants without exception","To participants with children of any age","To participants with children under 18","To participants with children over 18"],"a":2,"e":"The lesson states that the introduction programme shall comprise parental guidance for those with children under 18."},{"id":"personal-finances-homes#0","l":29,"q":"Approximately how many homes are there in Norway?","o":["Between 1.5 and 2 million","Between 2.7 and 3 million","Between 3.5 and 4 million","Between 4.5 and 5 million"],"a":1,"e":"The lesson states there are between 2.7 and 3 million homes in Norway."},{"id":"personal-finances-homes#1","l":29,"q":"What type of housing is common in big cities like Oslo?","o":["Mostly detached houses","Mostly blocks of flats","Mostly housing cooperatives","Mostly owner-occupied houses"],"a":1,"e":"The lesson explains that in big cities like Oslo, many housing units are in blocks of flats."},{"id":"personal-finances-homes#2","l":29,"q":"What percentage of households in Norway own their own home?","o":["Around 50%","Around 65%","Around 82%","Around 95%"],"a":2,"e":"The lesson states that around 82 per cent of households own their own home."},{"id":"personal-finances-homes#3","l":29,"q":"Which of these describes a housing cooperative?","o":["You own the entire building yourself","You own a share and have exclusive right to use your home","You pay no monthly payments to anyone","You can do it up and rent it out without asking permission"],"a":1,"e":"A housing cooperative is defined by owning a share with exclusive right to use the home, while complying with rules and statutes."},{"id":"personal-finances-homes#4","l":29,"q":"When buying a home, what percentage of the purchase price must you have as your own funds?","o":["5%","10%","25%","50%"],"a":1,"e":"The lesson states that the main rule is that people must have saved 10 per cent of the purchase price themselves."},{"id":"personal-finances-homes#5","l":29,"q":"How much of the home purchase price can most people borrow from the bank?","o":["50%","75%","80%","90%"],"a":3,"e":"The lesson explains that people can borrow 90 per cent of the purchase price from the bank if they have 10 per cent in own funds."},{"id":"personal-finances-homes#6","l":29,"q":"What must you have to be allowed to borrow money from a bank to buy a home?","o":["A certain amount of savings with no percentage requirement","Previous experience as a homeowner","Regular income or other financial security","Approval from the local government"],"a":2,"e":"The lesson states that people must have regular income or other financial security to be allowed to borrow money from the bank."},{"id":"personal-finances-homes#7","l":29,"q":"What type of homes are most common in small municipalities?","o":["Blocks of flats","Housing cooperatives","Detached houses","Rental apartments"],"a":2,"e":"The lesson explains that in small municipalities, most homes are detached houses."},{"id":"personal-finances-homes#8","l":29,"q":"What can you do with an owner-occupied home without asking permission?","o":["Sell it immediately to any buyer","Convert it to a business","Do it up and rent it out","Subdivide it into smaller units"],"a":2,"e":"The lesson states that with an owner-occupied dwelling, you can do it up and rent it out without having to ask anyone."},{"id":"personal-finances-homes#9","l":29,"q":"What does the monthly rent in a housing cooperative cover?","o":["Only the costs of your own apartment","Your share of the housing cooperative's joint debt, municipal taxes, and home insurance","All maintenance costs for the entire building","Only property taxes and nothing else"],"a":1,"e":"The lesson explains that housing cooperative rent covers your share of the housing cooperative's joint debt, municipal taxes, and home insurance."},{"id":"personal-finances-personal-finances#0","l":30,"q":"What is income?","o":["Money that goes into your bank account","Money that goes out of your bank account","Money you have saved and put aside over time","Money you borrow from a bank"],"a":0,"e":"The lesson defines income as all the money that goes into your bank account (pay, social security, benefits, child benefit, etc.)."},{"id":"personal-finances-personal-finances#1","l":30,"q":"What is the difference between gross pay and net pay?","o":["Gross pay is before tax, net pay is after tax","Gross pay is after tax, net pay is before tax","Gross pay is monthly, net pay is yearly","Gross pay is from employment, net pay is from benefits"],"a":0,"e":"The lesson explicitly states that gross pay is pay before tax and net pay is pay after tax."},{"id":"personal-finances-personal-finances#2","l":30,"q":"What is child benefit in Norway?","o":["Financial support paid for all children under 18 who are resident in Norway","Financial support paid only for very young children under 3 years old","Money paid directly by employers to parents of their employees","Financial support paid only to families with low income"],"a":0,"e":"The lesson defines child benefit as financial support paid for all children under 18 years of age who are resident in Norway to help cover expenses of having a child."},{"id":"personal-finances-personal-finances#3","l":30,"q":"What does a budget show?","o":["Income and expenses for a given period","The amount of money you owe to the bank","How much tax you need to pay to the government","The interest you earn on your savings account"],"a":0,"e":"The lesson states that a budget shows income and expenses for a given period and helps families plan how to spend their money."},{"id":"personal-finances-personal-finances#4","l":30,"q":"What do you need to open a bank account in Norway?","o":["A Norwegian personal identity number or a Norwegian D-number","A Norwegian driving licence or a Norwegian school diploma","A Norwegian work contract or a Norwegian rental agreement","A Norwegian phone number or a Norwegian home address"],"a":0,"e":"The lesson states that you need a Norwegian personal identity number or a Norwegian D-number to open a bank account."},{"id":"personal-finances-personal-finances#5","l":30,"q":"For which age group is the cash-for-care benefit paid?","o":["Children between 13 and 19 months who do not attend kindergarten","All children under 3 years old","Children whose parents are unemployed","Children who attend kindergarten full-time"],"a":0,"e":"The lesson defines the cash-for-care benefit as financial support paid for children between 13 and 19 months who do not attend kindergarten."},{"id":"personal-finances-personal-finances#6","l":30,"q":"What are instalments in a bank loan?","o":["Payments on the loan itself, such as down payments on the loan","The monthly interest payment charged by the bank","The total amount of money you borrow from the bank","A penalty fee for making late payments"],"a":0,"e":"The lesson defines instalments as what you pay on the loan itself, meaning down payments on the loan."},{"id":"personal-finances-personal-finances#7","l":30,"q":"What is interest on a bank loan?","o":["The cost of borrowing money from the bank","The list of monthly payments you must make","The maximum amount of money you can borrow","A fee charged if you pay back the loan early"],"a":0,"e":"The lesson defines interest as the cost of borrowing money, and explains that interest is calculated as a percentage of the loan."},{"id":"personal-finances-personal-finances#8","l":30,"q":"What do you need to log into online banking in Norway?","o":["BankID or a code generator","Your passport and school identification","Permission from your bank manager","A special license from the government"],"a":0,"e":"The lesson states that you need BankID or a code generator to log into your online bank."},{"id":"personal-finances-personal-finances#9","l":30,"q":"In most Norwegian families, what is typical regarding employment?","o":["Both parents are in paid employment outside the home","Only the father works outside the home","Only the mother works outside the home","One parent works full-time and the other does not work"],"a":0,"e":"The lesson states that both parents in most families are in paid employment outside the home, and both adults are responsible for the family's finances."},{"id":"school-and-education-adult-education#0","l":31,"q":"What is the term 'lifelong learning' describing?","o":["The requirement for adults to complete high school before working","The process of learning throughout one's entire life","The government's policy on providing free education for all citizens","The ability to work while studying at the same time"],"a":1,"e":"The lesson states: 'The fact that we learn over the course of our lives is called lifelong learning.'"},{"id":"school-and-education-adult-education#1","l":31,"q":"Which organization is responsible for providing preparatory education (FOV) to adults in Norway?","o":["The county authority","The Norwegian Directorate for Higher Education and Skills","The municipality","Private educational institutions"],"a":2,"e":"The lesson explicitly states: 'Municipalities are responsible for providing this education' (preparatory education for adults)."},{"id":"school-and-education-adult-education#2","l":31,"q":"At what age can adults take upper secondary education for the first time if they have not done so before?","o":["18 years old","20 years old","25 years old or over","30 years old or over"],"a":2,"e":"The lesson states: 'Adults aged 25 or over have the right to upper secondary education if they have not taken such education before.'"},{"id":"school-and-education-adult-education#3","l":31,"q":"What must adults have completed before they can start upper secondary education?","o":["They must have worked in Norway for at least 2 years","They must have passed a Norwegian language test","They must have completed primary and lower secondary education in Norway or another country","They must have lived in Norway for at least one year"],"a":2,"e":"The lesson requires: 'You have to complete primary and lower secondary education in Norway or in another country before you can start upper secondary education.'"},{"id":"school-and-education-adult-education#4","l":31,"q":"What does upper secondary education for adults cost within the public school system?","o":["It is free for adults in the public school system","It costs the same as at a private school","Adults must pay a fee for every subject","It is free only for adults under the age of 25"],"a":0,"e":"The lesson says that upper secondary education for adults is free within the public school system, while private schools are not free."},{"id":"school-and-education-adult-education#5","l":31,"q":"If an adult has qualifications from another country, where can they apply to have them recognized in Norway?","o":["At the local municipality office","Through the Norwegian Directorate for Higher Education and Skills (HK-dir)","At any public school in the county","Through the Norwegian State Educational Loan Fund"],"a":1,"e":"The lesson states: 'This is done through the Norwegian Directorate for Higher Education and Skills (HK-dir).'"},{"id":"school-and-education-adult-education#6","l":31,"q":"What can be a possible result of assessing prior learning and work experience?","o":["Only the shortening of courses of study","The worker must start from the beginning of any new education","Shortening of courses, admission to programs, exemption from parts of programs, new job, or higher pay","Only recognition of foreign qualifications"],"a":2,"e":"The lesson lists these outcomes: 'The assessment can result in shortening of courses of study, admission to study programmes, exemption from parts of a study programme, a new job or higher pay.'"},{"id":"school-and-education-adult-education#7","l":31,"q":"According to the lesson, why do employees need to keep up to date and learn new skills?","o":["Because the government requires all workers to have higher education","Because society is constantly changing and new technology affects the labour market","Because adults must complete upper secondary education by age 25","Because the cost of living in Norway requires higher wages"],"a":1,"e":"The lesson explains: 'Society is constantly changing. New technology has consequences for the labour market. Employees have to keep up to date and learn new skills.'"},{"id":"school-and-education-adult-education#8","l":31,"q":"Are private upper secondary schools available for adults in Norway, and are they free?","o":["No, there are no private schools in Norway","Yes, they are available and they are free","Yes, they are available but they are not free","Yes, but only for students aged 25 or older"],"a":2,"e":"The lesson states: 'Many private schools are also available. They are not free.'"},{"id":"school-and-education-adult-education#9","l":31,"q":"From which organization can adults get a grant and/or borrow money while they go to school?","o":["The Norwegian Directorate for Higher Education and Skills","The Norwegian State Educational Loan Fund","The municipality education office","The county authority's education department"],"a":1,"e":"The lesson explains: 'Many of them can therefore get a grant and/or borrow money from the Norwegian State Educational Loan Fund while they go to school.'"},{"id":"school-and-education-cooperation-between-the-home-and-school#0","l":32,"q":"How often should the pupil, parents, and teacher speak together about the child's academic development?","o":["At least once a year","At least twice a year","At least three times a year","Every month"],"a":1,"e":"The lesson states that the pupil, parents and teacher must speak together about the child's academic development at least twice a year."},{"id":"school-and-education-cooperation-between-the-home-and-school#1","l":32,"q":"Who has the main responsibility for children?","o":["The school","The parents","The teacher","The government"],"a":1,"e":"The lesson clearly states that parents have the main responsibility for their children."},{"id":"school-and-education-cooperation-between-the-home-and-school#2","l":32,"q":"What is the main focus of cooperation between home and school?","o":["Only academic subjects","The child's upbringing and education","Only behavior problems","Entertainment activities"],"a":1,"e":"The lesson explains that it is good for children when their parents cooperate with the kindergarten and school on their upbringing and education."},{"id":"school-and-education-cooperation-between-the-home-and-school#3","l":32,"q":"What problem do teachers report about parent cooperation?","o":["Teachers work too hard","Parents do not attend development talks","Schools have too many students","Children do not like school"],"a":1,"e":"Teachers report that parents don't attend parents' meetings or development talks as a significant problem."},{"id":"school-and-education-cooperation-between-the-home-and-school#4","l":32,"q":"What is one example of an activity that some parents don't allow their children to do?","o":["Reading lessons","School camp and outside teaching activities","Eating lunch at school","Reading books"],"a":1,"e":"The lesson mentions that some parents don't want pupils to take part in teaching activities outside school, such as school camp."},{"id":"school-and-education-cooperation-between-the-home-and-school#5","l":32,"q":"What should parents do with written information from the school?","o":["Ignore it if they are busy","Share it only on social media","Read and take note of it","Keep it only for important problems"],"a":2,"e":"The lesson states that it is important that parents read and take note of all written information from the school."},{"id":"school-and-education-cooperation-between-the-home-and-school#6","l":32,"q":"What can parents do if they have questions about their child's education?","o":["Post complaints online","Contact the teacher or school staff","Complain to other parents","Wait until the next school year"],"a":1,"e":"The lesson says that parents can contact the teacher or other school staff if they have any questions."},{"id":"school-and-education-cooperation-between-the-home-and-school#7","l":32,"q":"According to the lesson, what is true about parents and school working together?","o":["They always agree on everything","The cooperation always works perfectly","They may have different opinions about what is important","Disagreements never happen in Norway"],"a":2,"e":"The lesson explains that this cooperation does not always work as we might wish, and parents and school may have different opinions about what is important."},{"id":"school-and-education-cooperation-between-the-home-and-school#8","l":32,"q":"When do some children have poor Norwegian language skills, according to the lesson?","o":["After two years in school","When they start school","During summer holidays","When they move to a new city"],"a":1,"e":"The lesson reports that children who are born in Norway have poor Norwegian language skills when they start school."},{"id":"school-and-education-cooperation-between-the-home-and-school#9","l":32,"q":"What must the pupil, parents, and teacher do together regarding the child's learning?","o":["The school teaches everything","Parents teach at home only","Together ensure the child learns what they need","The child learns alone"],"a":2,"e":"The lesson states that the pupil, parents and teacher must work together to ensure that the child learns what he/she needs."},{"id":"school-and-education-kindergartens#0","l":33,"q":"What is one benefit children gain at kindergarten?","o":["They gain experience of being with other children","They learn to read and write","They learn to use computers","They learn to cook meals"],"a":0,"e":"The lesson states that children gain experience of being with other children at kindergarten."},{"id":"school-and-education-kindergartens#1","l":33,"q":"What is the basis for planning activities in kindergarten?","o":["The teacher's personal preference","The parents' individual requests","The Kindergarten Act and other rules decided by the authorities","International education standards only"],"a":2,"e":"The lesson states that all activities in a kindergarten are planned on the basis of the Kindergarten Act and other rules."},{"id":"school-and-education-kindergartens#2","l":33,"q":"According to the Kindergarten Act, what shall kindergartens build on?","o":["Strict discipline and full obedience to adults","Preparation for competitive sports and tournaments","Christian and humanist principles and human rights","Private business management and maximum profit"],"a":2,"e":"The Kindergarten Act sets out that kindergartens shall build on fundamental Christian and humanist principles and be based on human rights."},{"id":"school-and-education-kindergartens#3","l":33,"q":"What are the core values that kindergartens are based on?","o":["Security, comfort, and wealth","Charity, forgiveness, equality and solidarity","Competition and academic excellence","Obedience and strict rules"],"a":1,"e":"The lesson lists the values as charity, forgiveness, equality and solidarity."},{"id":"school-and-education-kindergartens#4","l":33,"q":"How are parents involved with the kindergarten?","o":["They have no involvement in the kindergarten","They only pay fees and nothing else","They are invited to parents' meetings and individual meetings","They make all decisions about the curriculum"],"a":2,"e":"The lesson states that parents are invited to parents' meetings and individual meetings where they receive information about the kindergarten's goals and activities."},{"id":"school-and-education-kindergartens#5","l":33,"q":"Who shares the cost of running a kindergarten?","o":["Only the municipality pays","Only the parents pay","The municipality and parents together pay","Only the national government pays"],"a":2,"e":"The lesson states that the municipality pays a substantial part of the cost and parents pay the rest."},{"id":"school-and-education-kindergartens#6","l":33,"q":"Which organization has set the maximum price that parents must pay for kindergarten?","o":["The local municipality council","The county authority","The Storting","The kindergarten director"],"a":2,"e":"The lesson states that the Storting has established a maximum price for how much parents have to pay for a kindergarten spot."},{"id":"school-and-education-kindergartens#7","l":33,"q":"What financial help is available for low-income families who want their children to attend kindergarten?","o":["They do not have to pay at all","They can apply for a reduced user charge or free 'core time'","They receive the same price as other families","They must pay double the normal price"],"a":1,"e":"The lesson states that low-income families can apply for a reduced user charge or free 'core time'."},{"id":"school-and-education-kindergartens#8","l":33,"q":"What is the name of the lower price that families pay when they have more than one child in kindergarten?","o":["Maximum price","Sibling discount","Free core time","Family discount"],"a":1,"e":"The lesson says that if you have more than one child at the same kindergarten, you pay a lower price, and this is called a 'sibling discount'."},{"id":"school-and-education-kindergartens#9","l":33,"q":"What right do parents who do not speak Norwegian have at parents' meetings?","o":["They do not have to attend the meetings","They can bring a family member as an interpreter","They have the right to have an interpreter present","They receive written translations of all meetings"],"a":2,"e":"The lesson states that parents who do not speak Norwegian have the right to have an interpreter present at parents' meetings."},{"id":"school-and-education-norwegian-language-tuition#0","l":34,"q":"What is the goal for Norwegian language in Norway?","o":["To make Norwegian a mandatory language for all residents","For everyone who lives in Norway to master Norwegian","To eliminate regional dialects","To restrict use of other languages"],"a":1,"e":"The lesson states that the goal is for everyone who lives in Norway to master Norwegian."},{"id":"school-and-education-norwegian-language-tuition#1","l":34,"q":"Why is a common language considered important according to the lesson?","o":["It allows the government to monitor citizens","It prevents people from moving between regions","It helps foster community and makes integration easier","It makes television broadcasting more affordable"],"a":2,"e":"The lesson explicitly states that a common language helps foster community and makes integration easier."},{"id":"school-and-education-norwegian-language-tuition#2","l":34,"q":"What is the maximum time allowed for completing all Norwegian language tuition?","o":["One year","Two years","Three years","Four years"],"a":2,"e":"The lesson specifies that all Norwegian language tuition must be concluded within three years."},{"id":"school-and-education-norwegian-language-tuition#3","l":34,"q":"What is the specific time limit for people with upper secondary or higher education?","o":["12 months","18 months","24 months","30 months"],"a":1,"e":"The lesson indicates an 18-month limit specifically for people with upper secondary or higher education."},{"id":"school-and-education-norwegian-language-tuition#4","l":34,"q":"What are the language levels in the European Framework of Reference for Languages?","o":["A, B, C, D","Basic, Intermediate, Advanced, Expert","A1, A2, B1, B2","1, 2, 3, 4"],"a":2,"e":"According to the lesson, the levels are divided into A1, A2, B1, and B2 in accordance with the European Framework of Reference for Languages."},{"id":"school-and-education-norwegian-language-tuition#5","l":34,"q":"What factor generally determines a participant's target language level?","o":["Their age when they arrive in Norway","Their work experience in their home country","Their educational background upon arrival in Norway","Their marital status"],"a":2,"e":"The lesson states that the target level is generally based on the participant's educational background upon arrival in Norway."},{"id":"school-and-education-norwegian-language-tuition#6","l":34,"q":"What decides which options foreign nationals have for Norwegian language tuition, for example free or paid tuition?","o":["Their age when they arrive in Norway","The country they come from","The residence permit they are granted","The municipality where they settle"],"a":2,"e":"The lesson says that, depending on the residence permit they are granted, people who settle in Norway have different options: some are entitled to free tuition, while others have to pay for it themselves."},{"id":"school-and-education-norwegian-language-tuition#7","l":34,"q":"Can a participant's target language level be changed during the learning process?","o":["No, it is fixed from start to finish","Yes, it can be adjusted according to the participant's progress","Only if requested by the participant's employer","Only for people with higher education"],"a":1,"e":"The lesson says that the target can be adjusted in the process in accordance with the participant's progress."},{"id":"school-and-education-norwegian-language-tuition#8","l":34,"q":"How does Norwegian language tuition conclude?","o":["With a graduation ceremony","With a test to document the language level attained","With an interview with an IMDi official","With a job placement"],"a":1,"e":"The lesson states that tuition concludes with a test to document the language level attained by the participant."},{"id":"school-and-education-norwegian-language-tuition#9","l":34,"q":"Which of these is described as a natural setting for learning Norwegian?","o":["A university classroom","A workplace language placement","A shopping mall","A television studio"],"a":1,"e":"The lesson describes a workplace language placement as offering a unique opportunity to learn Norwegian in a natural setting."},{"id":"school-and-education-primary-and-lower-secondary-school#0","l":35,"q":"When do children start school in Norway?","o":["In August of the year they turn six","In September of the year they turn six","In June of the year they turn six","In August of the year they turn seven"],"a":0,"e":"The lesson states that children start school in August of the year in which they turn six."},{"id":"school-and-education-primary-and-lower-secondary-school#1","l":35,"q":"How many years of education are compulsory and free in Norway?","o":["7 years","9 years","10 years","13 years"],"a":2,"e":"The lesson states that ten-year primary and lower secondary education is compulsory and free of charge."},{"id":"school-and-education-primary-and-lower-secondary-school#2","l":35,"q":"What is the grade scale in lower secondary school?","o":["1 to 5","1 to 6","1 to 10","0 to 100"],"a":1,"e":"The lesson states that the grade scale is 1–6, where 6 is the best grade."},{"id":"school-and-education-primary-and-lower-secondary-school#3","l":35,"q":"How are children assessed in primary school?","o":["They receive grades from 1 to 6","They take no assessments at all","They receive oral or written assessments but no grades","They receive written reports Obedience to authority"],"a":2,"e":"The objects clause states that schools are to build on values in Christian and humanist heritage and tradition, such as respect for human dignity and nature."},{"id":"school-and-education-primary-and-lower-secondary-school#9","l":35,"q":"Do pupils wear school uniforms in Norway?","o":["Yes, uniforms are required for all pupils","Yes, but only in primary school","No, pupils do not wear school uniforms","Yes, but uniforms are optional"],"a":2,"e":"The lesson states that pupils do not wear a school uniform in Norway."},{"id":"school-and-education-upper-secondary-school-and-higher-education#0","l":36,"q":"When must pupils apply online for a place at upper secondary school?","o":["Before 1 January","Before 1 March","After graduation day","At the start of school"],"a":1,"e":"The lesson states pupils must apply online for a place at upper secondary school before 1 March."},{"id":"school-and-education-upper-secondary-school-and-higher-education#1","l":36,"q":"What determines which upper secondary school a pupil can go to?","o":["The pupil's age","The grades they received in grade 10","How much money the pupil's family has","The pupil's choice of neighbourhood"],"a":1,"e":"The lesson states the grades pupils received in grade 10 determine which upper secondary school they can go to."},{"id":"school-and-education-upper-secondary-school-and-higher-education#2","l":36,"q":"What does a pupil receive when they complete a vocational programme?","o":["A university degree","A craft certificate","A teacher qualification","A government diploma"],"a":1,"e":"The lesson states pupils receive a craft certificate when they complete a vocational programme."},{"id":"school-and-education-upper-secondary-school-and-higher-education#3","l":36,"q":"What can pupils with a certificate from a general studies programme do?","o":["They must start working immediately","They cannot apply to university","They can apply for admission to a university or university college","They must complete a vocational programme"],"a":2,"e":"The lesson states pupils with a general studies certificate can apply for admission to a university or university college."},{"id":"school-and-education-upper-secondary-school-and-higher-education#4","l":36,"q":"About what percentage of adults in Norway have higher education?","o":["About 13%","About 30%","About 42%","About 75%"],"a":2,"e":"The lesson states about 42% of adults in Norway have higher education."},{"id":"school-and-education-upper-secondary-school-and-higher-education#5","l":36,"q":"How does the level of education of women compare with that of men in Norway?","o":["Women have a much lower level of education than men","Women and men have the same level of education","Women have a slightly higher level of education than men","Men have a slightly higher level of education than women"],"a":2,"e":"The lesson states that women have a slightly higher level of education than men."},{"id":"school-and-education-upper-secondary-school-and-higher-education#6","l":36,"q":"What do students have to pay for at public universities and university colleges?","o":["Tuition fees","Registration fees","Books","Application fees"],"a":2,"e":"The lesson states universities and public university colleges are free, but students have to pay for their books."},{"id":"school-and-education-upper-secondary-school-and-higher-education#7","l":36,"q":"Which of these is an example of a vocational programme mentioned in the lesson?","o":["Computer science","Mathematics teaching","Car mechanic","Engineering"],"a":2,"e":"The lesson lists car mechanic as one of the examples of vocational programmes, along with carpenter, hairdresser, and health worker."},{"id":"school-and-education-upper-secondary-school-and-higher-education#8","l":36,"q":"What is the main purpose of the Norwegian State Educational Loan Fund?","o":["To make universities private","To enable everyone to take higher education regardless of their background","To replace public education entirely","To increase tuition fees for students"],"a":1,"e":"The lesson states the Fund's intention was to enable everyone to take higher education, regardless of their background."},{"id":"school-and-education-upper-secondary-school-and-higher-education#9","l":36,"q":"What is the main difference between a grant and a loan from the Norwegian State Educational Loan Fund?","o":["Grants are larger than loans","Loans must be repaid, but grants do not","Grants are only available to women","Loans are only for students at private schools"],"a":1,"e":"The lesson states grants do not have to be repaid while loans have to be repaid in monthly instalments after the completion of studies."},{"id":"sustainability-nature-and-natural-resources#0","l":37,"q":"When was oil first found in Norway's North Sea?","o":["late 1950s","late 1960s","early 1980s","late 1990s"],"a":1,"e":"The lesson states 'Oil was first found in Norway in the North Sea in the late 1960s.'"},{"id":"sustainability-nature-and-natural-resources#1","l":37,"q":"What has made it possible for Norway to produce large amounts of metals?","o":["large forest reserves","hydropower","fish exports","modern technology only"],"a":1,"e":"The lesson explains that 'The metal industry requires a lot of electricity, and hydropower has made it possible to produce large amounts of metals.'"},{"id":"sustainability-nature-and-natural-resources#2","l":37,"q":"What is one way that timber from Norwegian forests is used?","o":["to make paper and building materials","only for fuel","to build ships exclusively","to make furniture only"],"a":0,"e":"The lesson states 'Timber is used, among other things, to make paper and building materials.'"},{"id":"sustainability-nature-and-natural-resources#3","l":37,"q":"How many metres must you stay away from houses or cabins if you want to sleep outdoors in nature?","o":["100 metres","150 metres","200 metres","250 metres"],"a":1,"e":"The lesson specifies that you must sleep 'at least 1
