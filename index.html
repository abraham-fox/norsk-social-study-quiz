<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --text: #1b1f24;
  --muted: #5b6470;
  --border: #d6dce4;
  --accent: #2457d6;
  --accent-text: #ffffff;
  --accent-soft: #e8eefc;
  --ok: #1a7f37;
  --ok-bg: #e6f4ea;
  --bad: #c62828;
  --bad-bg: #fdecea;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --surface: #181c22;
    --text: #e7eaee;
    --muted: #9aa4b0;
    --border: #2e353f;
    --accent: #6b9bff;
    --accent-text: #0b0f14;
    --accent-soft: #1c2740;
    --ok: #4ccb6b;
    --ok-bg: #132e1c;
    --bad: #ff7070;
    --bad-bg: #3a1717;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
/* Keeps scrolled-to elements clear of the sticky pager. */
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.top h1 { font-size: 1.15rem; margin: 0; line-height: 1.2; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; flex: none; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 14px; min-height: 36px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
.panel > summary { list-style: none; padding: 12px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.panel > summary::-webkit-details-marker { display: none; }
.panel > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform .15s; }
.panel[open] > summary::after { transform: rotate(-135deg); }
.panel .sum-title { font-weight: 600; }
.panel .sum-info { color: var(--muted); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
.field-label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 8px; }
.count-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 40px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count-row input { width: 5.5em; min-height: 40px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.hint { color: var(--muted); font-size: .85rem; }
.theme-head { display: flex; align-items: baseline; justify-content: space-between; }
.theme-head .links { display: flex; gap: 4px; }
.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; font-size: .9rem; }
.themes { display: grid; gap: 2px; }
.themes label { display: flex; align-items: center; gap: 10px; padding: 8px 4px; min-height: 44px; border-radius: 8px; }
.themes input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.themes .n { margin-left: auto; color: var(--muted); font-size: .85rem; }
.panel-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }

.primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; margin-bottom: 12px; }
.primary svg { width: 20px; height: 20px; }
.secondary { min-height: 48px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 600; padding: 0 16px; }
.msg { color: var(--bad); font-size: .9rem; margin: -4px 0 12px; }

.card:focus { outline: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; box-shadow: var(--shadow); }
.meta { color: var(--muted); font-size: .85rem; margin: 0 0 8px; }
.qtext { font-size: 1.15rem; line-height: 1.35; margin: 0 0 16px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 12px; cursor: pointer; min-height: 52px; }
.opt input { margin: 3px 0 0; width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.opt:not(.locked):hover { border-color: var(--accent); }
.opt.locked { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .mark { margin-left: auto; font-weight: 700; padding-left: 8px; }
.opt.correct .mark { color: var(--ok); }
.opt.wrong .mark { color: var(--bad); }
.verdict { font-weight: 700; margin: 16px 0 4px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.expl { margin: 0; color: var(--muted); }
.card-actions { margin-top: 14px; }

.pager {
  position: sticky; bottom: 0; z-index: 1;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  background: var(--bg);
}
.pager button { min-height: 48px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 600; padding: 0 14px; }
.pager button:disabled { opacity: .4; cursor: default; }
.pager #next { justify-self: end; }
.pager #prev { justify-self: start; }
.pos { font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; }

.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
.score b { font-size: 2.4rem; line-height: 1; }
.score span { color: var(--muted); }
.badge { display: inline-block; font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.tile { border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
.tile b { display: block; font-size: 1.4rem; }
.tile span { color: var(--muted); font-size: .8rem; }
.tile.ok b { color: var(--ok); }
.tile.bad b { color: var(--bad); }
h3 { font-size: 1rem; margin: 18px 0 8px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .9rem; }
.bar-row .v { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.result-actions { display: grid; gap: 8px; margin-top: 18px; }
.result-actions .primary { margin: 0; }

footer { color: var(--muted); font-size: .8rem; padding: 8px 0 24px; }
footer a { color: inherit; }
footer p { margin: 0 0 8px; }
footer details summary { cursor: pointer; text-decoration: underline; display: inline-block; padding: 4px 0; }
footer details ul { margin: 6px 0 0; padding-left: 18px; }
footer details li { margin-bottom: 6px; }

@media (min-width: 720px) {
  .wrap { padding-top: 28px; }
  .top h1 { font-size: 1.35rem; }
  .card { padding: 26px 28px; }
  .primary { width: auto; padding: 0 22px; }
  .pager { position: static; }
  html { scroll-padding-bottom: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="nb">NB</button>
    </div>
  </header>

  <details class="panel" id="settings">
    <summary><span class="sum-title" id="settings-title"></span><span class="sum-info" id="settings-info"></span></summary>
    <div class="panel-body">
      <label class="field-label" for="count" id="count-label"></label>
      <div class="count-row">
        <button type="button" class="chip" data-n="10">10</button>
        <button type="button" class="chip" data-n="20">20</button>
        <button type="button" class="chip" data-n="38">38</button>
        <input id="count" type="number" inputmode="numeric" min="1" step="1">
        <span class="hint" id="count-hint"></span>
      </div>
      <div class="theme-head">
        <span class="field-label" id="themes-label"></span>
        <span class="links">
          <button type="button" class="link" id="themes-all"></button>
          <button type="button" class="link" id="themes-none"></button>
        </span>
      </div>
      <div class="themes" id="themes"></div>
      <div class="panel-foot"><button type="button" class="link" id="reset-stats"></button></div>
    </div>
  </details>

  <button type="button" class="primary" id="shuffle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
    <span id="shuffle-label"></span>
  </button>
  <p class="msg" id="msg" hidden></p>

  <main class="card" id="card" aria-live="polite"></main>

  <nav class="pager" aria-label="Questions">
    <button type="button" id="prev"></button>
    <span class="pos" id="pos"></span>
    <button type="button" id="next"></button>
  </nav>

  <footer id="footer"></footer>
</div>

ions","Children should not discuss their views"],"a":0,"e":"The lesson says 'Today, there is an emphasis in Norwegian society on everyone having their own opinions.'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#2","l":0,"q":"Which is an example of a critical question to ask when reading online?","o":["Does the person who wrote it have a particular agenda?","Is the website design attractive?","Was the text written recently?","Does the author have many followers?"],"a":0,"e":"The lesson lists as a critical question: 'Does the person who has written it have a particular agenda?'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#3","l":0,"q":"Why is it important to know how to find information?","o":["Because we live in an information society and no one can have all information in their head","Because the internet is the only reliable source","Because books are becoming outdated","Because teachers cannot help us find information"],"a":0,"e":"The lesson explains that we live in an information society and that no one can have all information in their head, which is why it is important to know where and how to find information."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#4","l":0,"q":"What should you do when using someone else's music in your work?","o":["State who holds the copyright","Ask the music artist for permission in person","Wait several months before using it","Never use other people's music in any work"],"a":0,"e":"The lesson states 'If we use other people's texts, photos, music etc. in our own productions, we must always state who holds the copyright to this material.'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#5","l":0,"q":"What is ethical awareness?","o":["Balancing different considerations to make better decisions","Following all rules without questioning them","Doing whatever makes you happiest","Avoiding making any difficult decisions"],"a":0,"e":"The lesson defines ethical awareness as 'balancing different considerations, so that you can consider your options and make better decisions.'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#6","l":0,"q":"What do children learn to do at school in Norway?","o":["Reason, discuss and be creative","Repeat what the teacher and text book say","Always agree, so there are no arguments","Accept established truths without questions"],"a":0,"e":"The lesson says that at school children learn to reason, discuss and be creative, and that it is no longer enough just to repeat what the teacher or the text book says."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#7","l":0,"q":"Who is able to post information on the internet?","o":["Anyone","Only educated professionals","Only people with official permission","Only government officials"],"a":0,"e":"The lesson clearly states 'Anyone can post information online.'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#8","l":0,"q":"What does teaching ethical awareness help pupils develop?","o":["The ability to make ethical assessments","The skill to remember information faster","Better handwriting","Faster decision-making without thinking"],"a":0,"e":"The lesson says 'The teaching and training must develop the pupils' ability to make ethical assessments.'"},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#9","l":0,"q":"What do critical thinking and ethical awareness help pupils develop?","o":["Good judgment","Faster reading speed","Better test scores","Stronger personal opinions"],"a":0,"e":"The lesson states that critical thinking and ethical awareness 'will therefore help the pupils to develop good judgment.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#0","l":1,"q":"Which of the following is an example of social media mentioned in the lesson?","o":["Instagram","LinkedIn","Telegram","Reddit"],"a":0,"e":"The lesson explicitly lists Facebook, TikTok, and Instagram as examples of social media."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#1","l":1,"q":"What does the lesson say about the digital traces we leave online?","o":["They are automatically deleted after one week","They are stored","They can only be accessed by government agencies","They cannot be used to identify us"],"a":1,"e":"The lesson states 'we leave many digital traces in the course of a day, and all of these traces are stored.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#2","l":1,"q":"Which of the following is mentioned in the lesson as a method to identify yourself online?","o":["Voice recognition","Facial recognition","Eye scanning","Hand geometry"],"a":1,"e":"The lesson states 'We identify ourselves using BankID, passwords, fingerprints or facial recognition.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#3","l":1,"q":"What does data protection mean according to the lesson?","o":["Protecting computers from viruses","The right to privacy and to decide over your own personal data","Government control of internet access","A requirement to share information with authorities"],"a":1,"e":"The lesson defines data protection as 'about the right to privacy and to decide over your own personal data.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#4","l":1,"q":"According to the lesson, what restricts freedom of speech online?","o":["The desire of social media companies to be family-friendly","Data protection rules and certain legal clauses","International agreements about social media","Government policy on website content"],"a":1,"e":"The lesson states 'Freedom of speech is however restricted by data protection rules and certain legal clauses.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#5","l":1,"q":"What is an example of good digital judgment according to the lesson?","o":["Avoiding all personal opinions on social media","Writing things you would say to someone's face","Never disagreeing with others online","Posting anonymously to protect your identity"],"a":1,"e":"The lesson defines good digital judgment as 'wording comments online that you could also say to someone's face.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#6","l":1,"q":"Which of the following is an example of personal data mentioned in the lesson?","o":["Favorite sports team","Shopping preferences","Personal ID number","Social media username"],"a":2,"e":"The lesson lists personal data as including 'Name, address, phone number, personal ID number and ethnicity.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#7","l":1,"q":"According to the lesson, what does the European Convention on Human Rights protect?","o":["The right to express any opinion online without consequences","The government's right to access personal information","The right to a private sphere individuals control themselves","The requirement for people to share data with companies"],"a":2,"e":"The lesson states that the ECHR enshrines the principle that 'Individuals are therefore entitled to a private sphere they control themselves.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#8","l":1,"q":"What does the lesson say about comments made by anonymous posters online?","o":["They are typically more constructive and kind","They are more likely to be offensive and illegal","They cannot be reported to authorities","They follow stricter rules than identified users"],"a":1,"e":"The lesson states 'A great deal of offensive and illegal comments are made in particular when the posters are allowed to be anonymous.'"},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#9","l":1,"q":"According to the lesson, how do people's online behaviors compare to face-to-face interactions?","o":["People are more careful and respectful online","People appear to overstep boundaries more easily online","There is no difference in behavior between online and offline","People are more honest online"],"a":1,"e":"The lesson states 'People appear to overstep the mark more easily online than when they're talking to someone face to face.'"},{"id":"families-bringing-up-children#0","l":2,"q":"Who has chief responsibility for bringing up children?","o":["The kindergarten and school","The parents","The government","Extended family members"],"a":1,"e":"The lesson states that parents have chief responsibility for bringing up their children, although they are influenced by kindergarten, school, and other adults."},{"id":"families-bringing-up-children#1","l":2,"q":"What did children traditionally have to do that is different from today?","o":["Attend school for many hours each day","Work to contribute to their family's income","Play games with other children","Learn to read and write"],"a":1,"e":"The lesson explains that children used to be regarded as small adults and often had to work to contribute to their family's income, something not required today."},{"id":"families-bringing-up-children#2","l":2,"q":"According to the lesson, bringing up children differs:","o":["Only within one country","In different families, societies, and cultures","Only between wealthy and poor families","Mainly based on the child's age"],"a":1,"e":"The lesson clearly states that bringing up children can differ in different families, societies, and cultures."},{"id":"families-bringing-up-children#3","l":2,"q":"How is childhood viewed today, according to the lesson?","o":["As a time of work and financial contribution","As a time of play and learning","As a time to prepare only for factory work","As similar to adulthood"],"a":1,"e":"The lesson states that today, childhood is a time of play and learning, and that modern societies do not make the same work demands on children as before."},{"id":"families-bringing-up-children#4","l":2,"q":"What is one goal of bringing up children mentioned in the lesson?","o":["To make children work as soon as possible","To teach them to participate in society","To keep them isolated from other families","To make them choose one career path early"],"a":1,"e":"The lesson identifies teaching children to participate in society as one of the goals of bringing them up, along with giving them good values and enabling them to live good lives."},{"id":"families-bringing-up-children#5","l":2,"q":"Why do parents prioritize good cooperation with kindergarten and school?","o":["Because the government requires it by law","Because they want to know what their children do when they are not together","Because kindergartens control all parenting decisions","Because schools are less expensive than home care"],"a":1,"e":"The lesson explains that parents want to know what their children do when not together with them, so good cooperation with kindergarten and school is a priority."},{"id":"families-bringing-up-children#6","l":2,"q":"What does the lesson say about children and doing what parents ask?","o":["Children always do exactly what their parents want","Children never listen to their parents","Children don't always do what their parents want them to","Children only obey their parents at home"],"a":2,"e":"The lesson states that children don't always do what their parents want them to, and acknowledges this as part of the challenges parents face."},{"id":"families-bringing-up-children#7","l":2,"q":"Which of these is NOT mentioned as a way parents can get help with parenting difficulties?","o":["Seeking advice from someone who knows about parenting","Talking to other parents","Consulting with school teachers about their methods","Reading books about parenting"],"a":2,"e":"The lesson suggests seeking advice from experts, talking to other parents, reading books, and finding information online—but does not specifically mention consulting with school teachers as a solution."},{"id":"families-bringing-up-children#8","l":2,"q":"According to the lesson, what is something parents consider important to know?","o":["Exactly how much money their children spend","Their children's friends and their friends' parents","Every detail of their children's school grades","Where their children are every minute of the day"],"a":1,"e":"The lesson states that most parents consider it important to know their children's friends and their parents."},{"id":"families-bringing-up-children#9","l":2,"q":"What does the lesson recommend parents do about difficult situations?","o":["Wait until problems happen before thinking about them","Think through problematic situations before they arise","Avoid discussing problems with their children","Expect that parenting will never be difficult"],"a":1,"e":"The lesson explicitly states that thinking through problematic situations before they arise is a good idea for parents to do."},{"id":"families-children-and-young-peoples-rights#0","l":3,"q":"What age group does the Children Act in Norway cover?","o":["Children and young people under age 16","Children and young people under age 15","Children and young people under age 18","Children and young people under age 20"],"a":2,"e":"The lesson states that the Children Act applies to children and young people under 18."},{"id":"families-children-and-young-peoples-rights#1","l":3,"q":"What must happen when a child is born in Norway?","o":["The parents must register with the police","The National Registry must be notified","The school must be informed immediately","A health certificate must be filed with the government"],"a":1,"e":"The lesson states that when a child is born, the National Registry is notified with information about the parents."},{"id":"families-children-and-young-peoples-rights#2","l":3,"q":"What does the Children Act say about using violence in bringing up children?","o":["It is allowed if it is not too harsh","It is prohibited","It is permitted under certain circumstances","It is only allowed for serious misbehavior"],"a":1,"e":"The lesson clearly states that the Children Act prohibits the use of violence in bringing up children."},{"id":"families-children-and-young-peoples-rights#3","l":3,"q":"Who is responsible for ensuring that children attend primary and lower secondary school?","o":["The school teachers","The parents","The children themselves","The local municipality"],"a":1,"e":"The lesson states that parents must ensure that their children attend compulsory primary and lower secondary education."},{"id":"families-children-and-young-peoples-rights#4","l":3,"q":"At what age does a child's opinion carry significant weight in parents' decisions according to the Children Act?","o":["Age 7","Age 10","Age 12","Age 15"],"a":2,"e":"The lesson states that when a child has reached the age of 12, the child's opinion shall carry significant weight."},{"id":"families-children-and-young-peoples-rights#5","l":3,"q":"At what age can children make decisions about their own education?","o":["Age 12","Age 13","Age 14","Age 15"],"a":3,"e":"The lesson states that children who have reached the age of 15 have the right to make decisions in matters relating to education."},{"id":"families-children-and-young-peoples-rights#6","l":3,"q":"What is the age of majority in Norway?","o":["16 years","17 years","18 years","21 years"],"a":2,"e":"The lesson states that the age of majority in Norway is 18 years, when a person can enter into legal agreements and have control of their own money."},{"id":"families-children-and-young-peoples-rights#7","l":3,"q":"According to the Children Act, what must parents provide for their children?","o":["Only food and clothing","Food, clothing, and other necessities for a good life","Food, housing, and education only","Only shelter and medical care"],"a":1,"e":"The lesson states that parents must provide food, clothing, and other things children need to have a good life."},{"id":"families-children-and-young-peoples-rights#8","l":3,"q":"If parents live apart, what access does a child have to their parents?","o":["Access only to the mother","Access only to the father","Access to both parents","Access as determined by the court's decision"],"a":2,"e":"The lesson states that children have the right to have access to both their parents, including if they live apart."},{"id":"families-children-and-young-peoples-rights#9","l":3,"q":"At what age can children express their opinion about personal matters affecting them?","o":["Age 5","Age 7","Age 10","Age 12"],"a":1,"e":"The lesson states that children who have reached the age of seven have the right to express their opinion about personal matters affecting them."},{"id":"families-living-in-two-cultures#0","l":4,"q":"According to the lesson, what do we learn in the culture we are born into?","o":["How to drive a car","How to live together","How to cook food","How to use money"],"a":1,"e":"The lesson says that in the culture we are born into, we learn how to live together, the difference between right and wrong, and how we see our place in the world."},{"id":"families-living-in-two-cultures#1","l":4,"q":"How many main groups can we divide cultures into?","o":["Three main groups","Two main groups","Four main groups","Five main groups"],"a":1,"e":"The lesson explains: 'we can divide the cultures into two main groups.'"},{"id":"families-living-in-two-cultures#2","l":4,"q":"What are the two main groups of cultures called?","o":["Modern and traditional cultures","Individualist and collectivist cultures","Eastern and Western cultures","Rich and poor cultures"],"a":1,"e":"The lesson states: 'We call these two groups individualist and collectivist cultures.'"},{"id":"families-living-in-two-cultures#3","l":4,"q":"What is most important in an individualist culture?","o":["The family as a group","The community","The individual","The nation"],"a":2,"e":"The lesson explains: 'In an individualist culture, the individual is most important.'"},{"id":"families-living-in-two-cultures#4","l":4,"q":"Which values are positive in collectivist cultures?","o":["Independence and equality","Obedience, respect and good relations","Personal freedom and achievement","Competition and individual success"],"a":1,"e":"The lesson states that in a collectivist culture, 'Positive values include obedience, respect and good relations.'"},{"id":"families-living-in-two-cultures#5","l":4,"q":"What may children who grow up with two cultures sometimes have to relate to?","o":["One set of rules for boys and another for girls","One set of rules at home and another outside the home","One set of rules in winter and another in summer","One set of rules on weekdays and another at weekends"],"a":1,"e":"The lesson says that children who grow up with two cultures may sometimes have to relate to one set of rules at home and another outside the home."},{"id":"families-living-in-two-cultures#6","l":4,"q":"Which is a positive value in individualist cultures?","o":["Obedience to parents","Equality","Respect for hierarchy","Dependence on family"],"a":1,"e":"The lesson states that in an individualist culture, 'Positive values include independence, equal status and equality.'"},{"id":"families-living-in-two-cultures#7","l":4,"q":"What is most important in a collectivist culture?","o":["Individual freedom","Personal success","The group as a whole","Economic achievement"],"a":2,"e":"The lesson explains: 'In a collectivist culture, the group as a whole is most important.'"},{"id":"families-living-in-two-cultures#8","l":4,"q":"Children who grow up with two cultures may meet different opinions. According to the lesson, what may the opinions be about?","o":["What is cheap or expensive","What is polite or correct","What is healthy or unhealthy","What is modern or old-fashioned"],"a":1,"e":"The lesson says that for children who grow up with two cultures, there may be different opinions about what is polite or correct."},{"id":"families-living-in-two-cultures#9","l":4,"q":"Where do children learn about right and wrong?","o":["From television and books","Only from their teachers","From their parents and from society around them","Only from their family members"],"a":2,"e":"The lesson states: 'Children learn from their parents and from society around them' about 'the difference between right and wrong.'"},{"id":"families-marriage-and-family#0","l":5,"q":"What percentage of couples living together in Norway are married?","o":["30%","50%","70%","85%"],"a":2,"e":"The lesson states that 70 per cent of couples who live together are married."},{"id":"families-marriage-and-family#1","l":5,"q":"What is the average age at first marriage in Norway?","o":["18–25 years","25–30 years","30–40 years","40–50 years"],"a":2,"e":"The lesson specifies that the average age at first marriage is between 30 and 40 years for both men and women."},{"id":"families-marriage-and-family#2","l":5,"q":"Approximately how many couples get married in Norway each year?","o":["About 10,000","About 15,000","About 20,000","About 25,000"],"a":2,"e":"According to the lesson, every year approx. 20,000 couples marry in Norway."},{"id":"families-marriage-and-family#3","l":5,"q":"In which year were same-sex couples first allowed to marry in Norway?","o":["2005","2009","2012","2015"],"a":1,"e":"The lesson states that two people of the same sex have been entitled to get married in Norway since 2009."},{"id":"families-marriage-and-family#4","l":5,"q":"If married spouses take out a loan together, who is responsible for paying it back?","o":["Only the spouse whose name is on the loan","Only the spouse who earns more money","Both spouses are equally responsible","Only the spouse with a full-time job"],"a":2,"e":"The lesson states that spouses who take out a loan are both liable for the loan."},{"id":"families-marriage-and-family#5","l":5,"q":"How long must a couple be separated before they can request a divorce in Norway?","o":["6 months","1 year","2 years","3 years"],"a":1,"e":"The lesson states that the main rule is that you have to have been separated for one year before you can initiate a divorce."},{"id":"families-marriage-and-family#6","l":5,"q":"What percentage of children in Norway live with both their mother and father?","o":["About 50%","About 60%","About 75%","About 85%"],"a":2,"e":"The lesson states that approx. 75 per cent of all children live with both their mother and father."},{"id":"families-marriage-and-family#7","l":5,"q":"What is the minimum age to get married in Norway?","o":["16 years old","18 years old","20 years old","21 years old"],"a":1,"e":"The lesson specifies that to get married, you have to be over 18 years old and do so voluntarily."},{"id":"families-marriage-and-family#8","l":5,"q":"What percentage of married couples in Norway will probably divorce?","o":["About 20%","About 30%","About 40%","About 50%"],"a":2,"e":"The lesson indicates that approx. 40 per cent of couples who get married will probably subsequently divorce."},{"id":"families-marriage-and-family#9","l":5,"q":"On average, how many children does each woman in Norway have?","o":["About 1 child","About 1.4 children","About 2 children","About 2.5 children"],"a":1,"e":"The lesson states that on average, women in Norway have around 1.4 children each."},{"id":"families-the-child-welfare-service#0","l":6,"q":"When did Norway's first Child Welfare Act (vergerådsloven) enter into force?","o":["1900","1850","1950","2000"],"a":0,"e":"The lesson states that the first Child Welfare Act entered into force in 1900."},{"id":"families-the-child-welfare-service#1","l":6,"q":"Who is primarily responsible for caring for and bringing up a child?","o":["The Child Welfare Service","The schools","The parents","The municipality"],"a":2,"e":"The lesson begins by stating that caring for and bringing up a child is primarily the responsibility of the parents."},{"id":"families-the-child-welfare-service#2","l":6,"q":"What support services does the Child Welfare Service offer to families?","o":["Free housing for all families","Counselling, respite and personal support","Job placement only","Military training only"],"a":1,"e":"The lesson states that the Child Welfare Service offers different support services such as counselling, respite and personal support."},{"id":"families-the-child-welfare-service#3","l":6,"q":"What must people who work with children do if they suspect domestic violence?","o":["Wait for more evidence","Notify the Child Welfare Service","Keep it confidential","Warn the parents first"],"a":1,"e":"The lesson states that everyone who works with children has a duty to notify the Child Welfare Service if they suspect domestic violence."},{"id":"families-the-child-welfare-service#4","l":6,"q":"What was Norway's historic role in child welfare?","o":["It had the most funding","It established a public child welfare service first","It employed the most staff","It created the strictest laws"],"a":1,"e":"The lesson states that Norway was the first country in the world to establish a public child welfare service to help vulnerable children."},{"id":"families-the-child-welfare-service#5","l":6,"q":"How can a child contact the Child Welfare Service during night hours?","o":["Visit the office","Send an email","Call 116 111","Write a letter"],"a":2,"e":"The lesson states that in the evening or at night, children can call the emergency phone service 116 111."},{"id":"families-the-child-welfare-service#6","l":6,"q":"What applies to people who work in the Child Welfare Service?","o":["They are subject to duty of confidentiality","They discuss cases with friends","They can tell the media","They share files publicly"],"a":0,"e":"The lesson states that everyone who works in the Child Welfare Service is subject to a duty of confidentiality."},{"id":"families-the-child-welfare-service#7","l":6,"q":"If a child needs protection from their parents, what can the Child Welfare Service do?","o":["Provide only advice","Do nothing","Find a new family for the child","Always arrest the parents"],"a":2,"e":"The lesson states that if necessary, the Child Welfare Service can find a new family for children who need protection from their parents."},{"id":"families-the-child-welfare-service#8","l":6,"q":"Where are Child Welfare Service offices located in Norway?","o":["Only in the capital","Only in large cities","In every municipality","Only in coastal areas"],"a":2,"e":"The lesson states that every municipality in Norway has a child welfare service office."},{"id":"families-the-child-welfare-service#9","l":6,"q":"What is the main goal of the Child Welfare Service?","o":["To punish bad parents","To ensure children have a safe childhood","To separate families","To monitor all families"],"a":1,"e":"The lesson states that the Child Welfare Service seeks to ensure that children and adolescents have a safe childhood."},{"id":"health-dental-health#0","l":7,"q":"At what age do children in Norway stop having free dental check-ups?","o":["16","18","19","21"],"a":2,"e":"The lesson states that children and young people have regular dental check-ups at the public dental service until they turn 19."},{"id":"health-dental-health#1","l":7,"q":"Which of the following foods is mentioned in the lesson as containing sugar?","o":["Rice","Spinach","Chocolate","Chicken"],"a":2,"e":"The lesson lists chocolate as one of the foods that contains sugar, along with biscuits, fizzy drinks, squash, cakes, and sweets."},{"id":"health-dental-health#2","l":7,"q":"According to the lesson, when should people brush their teeth?","o":["After every meal","Before bedtime only","Morning and evening","Three times daily"],"a":2,"e":"The lesson states that everyone should brush their teeth twice a day, morning and evening."},{"id":"health-dental-health#3","l":7,"q":"How much of the cost do young adults pay for dental treatment in the public dental service?","o":["Nothing","25 per cent","50 per cent","100 per cent"],"a":1,"e":"The lesson states that young adults pay 25 per cent of the cost of dental treatment, while the public authorities pay the remaining 75 per cent."},{"id":"health-dental-health#4","l":7,"q":"Who must make their own appointments with a private dentist in Norway?","o":["Children under 19","The public health service","Adults","Their parents"],"a":2,"e":"The lesson states that adults must make their own appointments with a private dentist."},{"id":"health-dental-health#5","l":7,"q":"If a child in Norway needs dental braces, who pays the patient charge?","o":["The government","The dentist","The parents","The school"],"a":2,"e":"The lesson states that if a child or young person needs dental braces, their parents have to pay a patient charge."},{"id":"health-dental-health#6","l":7,"q":"How often is it common for adults in Norway to visit the dentist for a check-up?","o":["Every month","Every six months","Once a year","Only when they have problems"],"a":2,"e":"The lesson states that for adults, it is common to have a check-up once a year."},{"id":"health-dental-health#7","l":7,"q":"According to the lesson, what might happen if a child's milk teeth are poor?","o":["The child will lose all adult teeth","The child's adult teeth will also be poor","The child will need dental braces","The child will have yellowing teeth"],"a":1,"e":"The lesson states that poor milk teeth may mean that a child's new teeth will also be poor."},{"id":"health-dental-health#8","l":7,"q":"Who is responsible for their child's dental health in Norway?","o":["The school","The dentist","The parents","The government"],"a":2,"e":"The lesson clearly states that parents are responsible for their children's dental health."},{"id":"health-dental-health#9","l":7,"q":"According to the lesson, why is it important to care for children's teeth from an early age?","o":["To make brushing easier when they are older","Because poor milk teeth may result in poor adult teeth","To prevent all dental problems forever","Because the dentist requires it"],"a":1,"e":"The lesson states that poor milk teeth may mean poor new teeth, so it is important to look after children's teeth from an early age."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#0","l":8,"q":"Why are politicians in Norway discussing family planning according to the lesson?","o":["To reduce the total population of Norway","To encourage couples to have more children","To follow the example of countries with very low birth rates","To allow women to have children without any government interference"],"a":1,"e":"The lesson states that politicians are discussing how they can encourage couples to have more children."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#1","l":8,"q":"How do contraceptive pills prevent pregnancy?","o":["By making the uterus smaller","By preventing ovulation","By blocking all sperm from entering","By thickening the cervical fluid"],"a":1,"e":"The lesson explains that contraceptive pills contain hormones that prevent ovulation."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#2","l":8,"q":"What is a contraceptive implant?","o":["A hormone pill taken every day","A small plastic rod inserted under the skin that releases gestagen","A device placed inside the stomach","A surgical procedure on the fallopian tubes"],"a":1,"e":"The lesson describes a contraceptive implant as a small plastic rod inserted under the skin that releases the hormone gestagen."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#3","l":8,"q":"How does a coil prevent pregnancy?","o":["It prevents ovulation like contraceptive pills do","It obstructs the mobility of sperm and prevents fertilised eggs from attaching to the uterine wall","It creates a physical barrier between the sperm and the egg","It makes the vagina too acidic for sperm to survive"],"a":1,"e":"The lesson states that a coil obstructs the mobility of sperm and prevents fertilised eggs from attaching to the uterine wall."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#4","l":8,"q":"What makes a condom different from all other contraceptives?","o":["It is the only one that contains the hormones oestrogen and gestagen","It is the only one that protects against sexually transmitted diseases","It is the only one that must be inserted and removed by a doctor","It is the only one that releases a small amount of hormone every day"],"a":1,"e":"The lesson says that a condom is the only contraceptive that protects against sexually transmitted diseases."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#5","l":8,"q":"According to the lesson, how should a spermicide be used for contraception?","o":["Alone as a complete contraceptive method","Together with a condom to reduce the risk of unwanted pregnancy","With contraceptive pills instead of condoms","With a contraceptive implant for better protection"],"a":1,"e":"The lesson states that using a spermicide is recommended together with a condom to reduce the risk of unwanted pregnancy."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#6","l":8,"q":"Are antenatal check-ups compulsory for pregnant women in Norway?","o":["Yes, all pregnant women must attend all check-ups","No, the check-ups are voluntary","Yes, but only for women having their first child","Yes, but only if complications are suspected"],"a":1,"e":"The lesson clearly states that antenatal check-ups are voluntary."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#7","l":8,"q":"Where do most women in Norway give birth?","o":["At home with a midwife","In a private clinic that costs money","In a hospital","At a health centre"],"a":2,"e":"The lesson states that most women give birth in hospital, which is free of charge."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#8","l":8,"q":"From what age do health centres in Norway start providing health checks to children?","o":["From the age of 5 years","From the age of 3 years","From birth","From school age only"],"a":2,"e":"The lesson explains that health checks take place at health centres from the time children are born until they start school."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#9","l":8,"q":"According to the Abortion Act in Norway, what are women entitled to if they decide to have an abortion?","o":["Only medical treatment without any information","The right to information, guidance and follow-up support","Only the right to have the procedure done","Nothing because the decision is entirely private"],"a":1,"e":"The lesson states that the woman has the right to receive information, guidance and follow-up support."},{"id":"health-health-and-lifestyle#0","l":9,"q":"According to the lesson, what were common causes of death in Norway 100 years ago due to poverty?","o":["Malnutrition and tuberculosis","Cancer and cardiovascular disease","Diabetes and obesity","Depression and anxiety"],"a":0,"e":"The lesson explicitly states that many people used to die from illnesses linked to poverty, specifically mentioning malnutrition and tuberculosis."},{"id":"health-health-and-lifestyle#1","l":9,"q":"What is the standard of living like in present-day Norway?","o":["Low","High","Average","Declining"],"a":1,"e":"The lesson explicitly states that the standard of living is high in present-day Norway."},{"id":"health-health-and-lifestyle#2","l":9,"q":"According to the lesson, what helps you stay healthy for longer?","o":["Eating often and relaxing at home","Eating healthy food and being physically active","Sleeping less but working more","Avoiding all physical exercise"],"a":1,"e":"The lesson says if we eat healthy food and are physically active, we have a better chance of staying healthy for longer."},{"id":"health-health-and-lifestyle#3","l":9,"q":"What are the most common causes of death in Norway today?","o":["Tuberculosis and malnutrition","Asthma and allergies","Cancer and cardiovascular diseases","Obesity and diabetes"],"a":2,"e":"The lesson states that cardiovascular diseases, along with cancer, are the most common cause of death in Norway."},{"id":"health-health-and-lifestyle#4","l":9,"q":"How does the lesson describe the importance of mental health?","o":["Mental health is less important than physical health","Mental health is only important for people with depression","Mental health is as important as physical health","Mental health does not affect how long we live"],"a":2,"e":"The lesson explicitly states that mental health is as important as physical health."},{"id":"health-health-and-lifestyle#5","l":9,"q":"According to the lesson, who is responsible for safeguarding health?","o":["Only the welfare state","Only the individual person","Both the welfare state and the individual","Neither the welfare state nor the individual"],"a":2,"e":"The lesson states that although the welfare state bears the brunt of responsibility, it is also up to the individual how they live their lives and look after their health."},{"id":"health-health-and-lifestyle#6","l":9,"q":"According to the lesson, which health problems do healthcare workers see in more immigrants than Norwegians?","o":["Asthma, allergies and tuberculosis","Cancer, asthma and cardiovascular diseases","Diabetes, obesity and poor dental health","Tuberculosis, cancer and allergies"],"a":2,"e":"The lesson says healthcare workers see that more immigrants than Norwegians have problems such as diabetes, obesity, poor dental health, malnourishment (a lack of iron and vitamin D) and depression."},{"id":"health-health-and-lifestyle#7","l":9,"q":"What does the lesson say children in Norway receive for free?","o":["Free medication for all illnesses","Free vaccination against various diseases","Free sports training","Free dental treatment"],"a":1,"e":"The lesson states that children are offered free vaccination against a number of diseases."},{"id":"health-health-and-lifestyle#8","l":9,"q":"Which health problems does the lesson say are increasing in Norway?","o":["Tuberculosis and malnutrition","Asthma and allergies","Diabetes and obesity","Tuberculosis and allergies"],"a":2,"e":"The lesson says diabetes and obesity are increasing in Norway, while tuberculosis and malnutrition are illnesses that many people used to die from."},{"id":"health-health-and-lifestyle#9","l":9,"q":"According to a Norwegian saying mentioned in the lesson, what helps you live longer?","o":["Getting a lot of sleep","Working hard every day","A good laugh","Avoiding stress and change"],"a":2,"e":"The lesson mentions a Norwegian saying that a good laugh helps you to live longer."},{"id":"health-health-services#0","l":10,"q":"What does a public health service mean in Norway?","o":["The state takes responsibility for treatment regardless of personal finances","The state only helps those who cannot afford treatment themselves","Everyone must pay full price for their own treatment","Private doctors provide all healthcare in Norway"],"a":0,"e":"The lesson explicitly states that in a public health service, 'the state takes responsibility for people getting the treatment they need, irrespective of their personal finances.'"},{"id":"health-health-services#1","l":10,"q":"How many times per year can you swap your regular GP?","o":["Once per year","Twice per year","Three times per year","Four times per year"],"a":1,"e":"The lesson states you can swap your GP 'but no more than twice a year.'"},{"id":"health-health-services#2","l":10,"q":"What should you do if you need to see a specialist doctor?","o":["Call the emergency number to book an appointment","Visit a specialist directly without a referral","Get a referral from your regular GP","Ask a pharmacist to give you a specialist appointment"],"a":2,"e":"The lesson says 'Your GP can then refer you to a specialist if necessary.'"},{"id":"health-health-services#3","l":10,"q":"What is outpatient treatment at a hospital?","o":["Treatment where you stay in hospital overnight","Treatment at a hospital without being admitted","Treatment that is free for all patients","Treatment that only specialist doctors can provide"],"a":1,"e":"The lesson defines outpatient treatment as treatment 'at a hospital without being admitted.'"},{"id":"health-health-services#4","l":10,"q":"How much does it cost to be admitted to a hospital in Norway?","o":["Between 150 and 300 NOK","Patients pay for treatment and food only","Free of charge","500 NOK per day"],"a":2,"e":"The lesson states 'Hospital stays are free of charge. The public authorities will cover all costs of treatment, food and accommodation.'"},{"id":"health-health-services#5","l":10,"q":"What emergency number should you call if someone has a serious injury and needs immediate assistance?","o":["116 117","113","112","118"],"a":1,"e":"The lesson specifies that for a serious injury requiring immediate assistance, 'you must call the emergency number 113.'"},{"id":"health-health-services#6","l":10,"q":"Where can you buy mild painkillers in Norway?","o":["Only at pharmacies, with a doctor's prescription","Only at hospitals, after you have seen a doctor","Only at your regular GP's surgery, by appointment","At pharmacies, grocery shops or petrol stations"],"a":3,"e":"The lesson says that some types of medication, for example mild painkillers, can also be bought from grocery shops/supermarkets or petrol stations, not only from pharmacies."},{"id":"health-health-services#7","l":10,"q":"Which children can decide whether their parents shall have access to their health information?","o":["Children over the age of 12","Children over the age of 14","Children over the age of 16","Children over the age of 18"],"a":2,"e":"The lesson states that children over the age of 16 can decide whether their parents shall have access to their health information."},{"id":"health-health-services#8","l":10,"q":"Do children under 16 need to pay patient charges?","o":["Yes, they pay half price","Yes, they pay the full price like adults","No, they do not pay patient charges","They only pay if they visit a specialist"],"a":2,"e":"The lesson explicitly states 'Children under the age of 16 do not pay patient charges.'"},{"id":"health-health-services#9","l":10,"q":"What is an exemption card in the Norwegian health system?","o":["A card that allows you to skip waiting lists","A card that means you don't pay patient charges for the rest of the year","A card that gives free access to private health services","A card that allows you to see any specialist without a referral"],"a":1,"e":"The lesson explains that after paying a certain amount in patient charges, you receive an exemption card meaning 'you do not have to pay patient charges for the rest of the calendar year.'"},{"id":"health-identity#0","l":11,"q":"According to the lesson, identity is formed by our characteristics and personality traits. What else also plays a role?","o":["our height, our weight and the colour of our eyes","where we live, who we spend time with and our interests","our blood type, our genes and the year we were born","our star sign, the season and the day we were born"],"a":1,"e":"The lesson says that social factors like where we live, who we spend time with and our interests also play a role in forming our identity."},{"id":"health-identity#1","l":11,"q":"Who we fall in love with and are sexually attracted to help define our...","o":["gender expression","social status","sexual identity","personality traits"],"a":2,"e":"The lesson states directly: 'Who we fall in love with and are sexually attracted to help define our sexual identity.'"},{"id":"health-identity#2","l":11,"q":"Traditionally, gender has been determined at birth based on...","o":["personal preference","psychological testing","physiology","cultural beliefs"],"a":2,"e":"The lesson clearly states 'Physiology has traditionally determined our gender at birth as either boy or girl.'"},{"id":"health-identity#3","l":11,"q":"Which of the following has traditionally reinforced how we perceive gender as either boy or girl?","o":["scientific research","clear gender role patterns","educational curriculum","family relationships"],"a":1,"e":"The lesson says 'This has been reinforced by clear gender role patterns,' referring to the traditional determination of gender at birth."},{"id":"health-identity#4","l":11,"q":"The term 'gender expression' refers to...","o":["how people describe their feelings about gender","who someone is attracted to","how people dress or otherwise emphasize their gender","the gender someone was born with"],"a":2,"e":"The lesson defines gender expression as 'the term we use for how people dress or otherwise emphasise their gender.'"},{"id":"health-identity#5","l":11,"q":"According to the lesson, today there is more openness around...","o":["strictly defining everyone's gender the same way","everyone having the same gender identity","these classifications not being appropriate for everyone","removing all concepts of gender"],"a":2,"e":"The lesson states 'Today, there is more openness around these classifications not being appropriate for everyone.'"},{"id":"health-identity#6","l":11,"q":"The lesson states that some people wish to define themselves as something other than their birth gender, or...","o":["as having no gender","as the opposite gender permanently","somewhere between the two traditional genders","as multiple genders at once"],"a":2,"e":"The lesson explains that 'some people wish to define themselves as something other than the gender they were born with, or somewhere between the two traditional genders.'"},{"id":"health-identity#7","l":11,"q":"Which statement about sexual orientation is supported by the lesson?","o":["Everyone defines themselves as either heterosexual or homosexual","Some people do not want to define their sexual orientation as something fixed","Sexual orientation is the same thing as gender identity","Everyone has the same sexual orientation"],"a":1,"e":"The lesson says 'Some people define themselves as heterosexual or homosexual, while others do not want to define their sexual orientation as something fixed.'"},{"id":"health-identity#8","l":11,"q":"According to the lesson, which of the following is an example of a social factor that influences identity?","o":["physical height","eye color","our interests","genetic makeup"],"a":2,"e":"The lesson lists 'our interests' as one of the social factors that play a role in identity formation, along with where we live and who we spend time with."},{"id":"health-identity#9","l":11,"q":"Based on the lesson, which statement correctly describes identity?","o":["Identity is determined solely by sexual orientation","Identity is formed only by characteristics and personality traits, with no social influence","Identity is formed by characteristics, personality traits, and is influenced by social factors like who we spend time with","Identity is the same for every person"],"a":2,"e":"The lesson explains that identity is formed by both characteristics and personality traits AND influenced by social factors including where we live, who we spend time with, and our interests."},{"id":"health-mental-health#0","l":12,"q":"Why does the doctor ask John about feeling sad and lonely when John complains about stomach pain?","o":["To distract John from thinking about his stomach","Because mental and physical health are connected","Because stomach pain is never a real physical problem","Because John previously mentioned he was depressed"],"a":1,"e":"The lesson shows the doctor checking John's emotional state after physical tests found nothing wrong, suggesting that mental health might be affecting his physical symptoms."},{"id":"health-mental-health#1","l":12,"q":"According to the lesson, what can cause mental health problems?","o":["Only having a hereditary predisposition","Difficult life situations, war experiences and stress","Only physical illnesses such as stomach pain","Only eating the wrong food and not exercising"],"a":1,"e":"The lesson says mental health problems can be due to difficult life situations, crises, accidents or war experiences, and that stress can act as a trigger."},{"id":"health-mental-health#2","l":12,"q":"What does the lesson explain about a psychologist's duty of confidentiality?","o":["They must tell your family everything you discuss","They must report all problems to your doctor","They cannot share with anyone what you have told them","They keep records that other doctors can read"],"a":2,"e":"The doctor tells John: 'Remember that psychologists have a duty of confidentiality and can't tell anyone anything you've said.'"},{"id":"health-mental-health#3","l":12,"q":"According to the lesson, who can often help us find solutions to our problems when we need professional help?","o":["A neighbour or a colleague","A lawyer or a bank adviser","A psychologist or another expert","A teacher or a school nurse"],"a":2,"e":"The lesson says that sometimes we need professional help, and that a psychologist or another expert can often help us to find solutions to our problems."},{"id":"health-mental-health#4","l":12,"q":"What can a regular GP do to help someone with mental health concerns?","o":["Refer them to a psychologist","Tell them to solve their problems alone","Suggest they stop talking about it","Refuse to treat mental health issues"],"a":0,"e":"The lesson explains: 'Regular GPs can refer patients to a psychologist if they need it.'"},{"id":"health-mental-health#5","l":12,"q":"How does the lesson describe most Norwegians' view of mental health today?","o":["They think mental illness is shameful","They think mental health problems are not real","They have an open and understanding attitude toward mental illness","They believe mental health problems are rare"],"a":2,"e":"The lesson states: 'Today, a majority of the Norwegian population has an open and understanding attitude to mental illness.'"},{"id":"health-mental-health#6","l":12,"q":"According to the lesson, how should people with mental illness be treated in Norway?","o":["They should receive less care than people with physical illness","They should not receive help from the government","They should be treated the same as people with physical illness","They should only be helped by family members"],"a":2,"e":"The lesson explains: 'Most people believe that the mentally ill should be given treatment and help by the health service in the same way as people with physical problems.'"},{"id":"health-mental-health#7","l":12,"q":"What is the lesson's message about whether mental illness can improve?","o":["Mental illness always gets worse over time","Mental illness can never be improved","Most people in Norway believe mental illness can be cured","Only people with hereditary factors can recover"],"a":2,"e":"The lesson states: 'We also believe that it is possible to be cured of mental illnesses.'"},{"id":"health-mental-health#8","l":12,"q":"When John came back to the doctor a few weeks later, which problems did he talk about?","o":["Back pain, headaches, fever and coughing","Toothache, dizziness, hunger and weight loss","Tiredness, anger, poor sleep and nightmares","Sore throat, earache, skin rash and hair loss"],"a":2,"e":"On his second visit, John says he is always tired, sometimes gets angry for no reason, is not sleeping well and has nightmares about things he experienced in his home country."},{"id":"health-mental-health#9","l":12,"q":"How did John first react when the doctor suggested a psychologist?","o":["He said at once that it was a good idea","He said there was nothing wrong with his head","He asked to see a different kind of doctor","He said he would rather talk to his family"],"a":1,"e":"When the doctor suggests a psychologist, John first answers 'A psychologist? There's nothing wrong with my head,' and only later agrees to give it a go."},{"id":"health-moving-to-a-new-country#0","l":13,"q":"What is the name of the mental process that describes how people adjust when they move to a new country?","o":["The cultural adaptation cycle","The mental migration process","The emotional integration stage","The settlement adjustment period"],"a":1,"e":"The lesson explicitly names this the 'three-phase mental migration process' in the section describing how people experience moving to a new country."},{"id":"health-moving-to-a-new-country#1","l":13,"q":"How is it common to feel at first, in Phase 1 of the mental migration process?","o":["Tired and fed up","Happy and optimistic","Insecure and worried","Angry and disappointed"],"a":1,"e":"The lesson says that in Phase 1 it is common to initially feel happy and optimistic, while feeling insecure, tired and fed up belongs to Phase 2."},{"id":"health-moving-to-a-new-country#2","l":13,"q":"According to the lesson, what does Amaniel say he has lost by moving to Norway?","o":["Only his job and money","Only his family and friends","His family, friends, traditions, and language","His house and possessions"],"a":2,"e":"Amaniel explicitly states: 'We've lost so much: family, friends, traditions and our language' when discussing the difficulties of moving."},{"id":"health-moving-to-a-new-country#3","l":13,"q":"In Phase 2, what makes people feel insecure about their new country?","o":["The weather and climate conditions","High costs of living and expensive housing","Everything they are not familiar with in the new country","Bad school systems for their children"],"a":2,"e":"The lesson states that in Phase 2, 'Everything they are not familiar with in the new country can make them feel insecure.'"},{"id":"health-moving-to-a-new-country#4","l":13,"q":"How long does the three-phase mental migration process typically last?","o":["Always exactly one year for every person","It differs from one person to the next","Approximately two months for all people","Always between two and five years"],"a":1,"e":"The lesson clearly states at the beginning: 'How long the different phases last differs from person to person.'"},{"id":"health-moving-to-a-new-country#5","l":13,"q":"What do people combine in Phase 3 to find their place in the new society?","o":["Their home country traditions with popular culture","The values from the new country with values from their home country","Only the new language with old customs","New friends with old friends"],"a":1,"e":"The lesson explains: 'When this is combined with the values and thinking they have brought with them from their home country, they find their place in the new society.'"},{"id":"health-moving-to-a-new-country#6","l":13,"q":"How does Sebene feel about moving to Norway?","o":["She is tired and homesick","She is confused and frustrated","She is happy and feels the future is secure","She is angry and wants to leave"],"a":2,"e":"Sebene says at the beginning: 'I'm so happy that we've finally arrived in Norway. It's so nice here, and I feel that the future is secure now.'"},{"id":"health-moving-to-a-new-country#7","l":13,"q":"In Phase 1, what do people tend to focus on more than what they have lost?","o":["Difficulties with the new language","The new opportunities they have been given","Missing their old country","Problems finding employment"],"a":1,"e":"The lesson states in Phase 1: 'People tend to think more about the new opportunities they have been given, and less about what they have left behind and lost.'"},{"id":"health-moving-to-a-new-country#8","l":13,"q":"What are Amaniel's main complaints about living in the new country?","o":["The food is bad and the weather is cold","He doesn't have a job, doesn't understand the language, and needs help with everything","He misses sports and entertainment","He has no family nearby and the schools are poor"],"a":1,"e":"Amaniel says: 'I don't have a job, I don't understand the language and I need help with everything,' expressing these as his main difficulties."},{"id":"health-moving-to-a-new-country#9","l":13,"q":"By Phase 3, how has people's view of the future changed compared to Phase 2?","o":["It looks darker and more hopeless","It remains the same as before moving","It looks brighter because life becomes easier","It disappears completely from their thoughts"],"a":2,"e":"The lesson states in Phase 3: 'After a while, life becomes easier again for most people... The future looks brighter.'"},{"id":"history-norway-from-1814-to-1905#0","l":14,"q":"Why did Denmark have to give Norway to Sweden in 1814?","o":["France lost the Napoleonic Wars, and Denmark was on France's side","Sweden's military defeated Denmark in a direct conflict","England demanded that Norway be given to Sweden","The Norwegian people voted to join Sweden"],"a":0,"e":"The lesson states that Denmark-Norway was on France's side during the Napoleonic Wars, and when France lost, the Danish king had to give up Norway to Sweden, which had supported England."},{"id":"history-norway-from-1814-to-1905#1","l":14,"q":"How many powerful men met at Eidsvoll in 1814?","o":["50","112","200","312"],"a":1,"e":"The lesson explicitly states that 112 powerful men met at Eidsvoll to draft a constitution for an independent Norway."},{"id":"history-norway-from-1814-to-1905#2","l":14,"q":"When was the Storting (Norwegian parliament) founded?","o":["1805","1810","1814","1820"],"a":2,"e":"The lesson states that the Storting, the parliament, was founded in 1814."},{"id":"history-norway-from-1814-to-1905#3","l":14,"q":"What was National Romanticism?","o":["A military movement to unite Scandinavian countries","A religious movement that emphasized faith in nature","An art and culture movement that highlighted distinctive national characteristics","A political party that ruled Norway from 1850 to 1900"],"a":2,"e":"The lesson describes National Romanticism as an art and culture movement developed in Europe in the mid-19th century that became important for highlighting distinctive national characteristics."},{"id":"history-norway-from-1814-to-1905#4","l":14,"q":"Who created the written form of Norwegian known as Nynorsk?","o":["Karl Johan, the Swedish-Norwegian king","Ivar Aasen, a linguist","Prince Carl, the first independent Norwegian king","The 112 men who met at Eidsvoll"],"a":1,"e":"The lesson states that linguist Ivar Aasen travelled throughout Norway to collect examples from different dialects and used these to create Nynorsk."},{"id":"history-norway-from-1814-to-1905#5","l":14,"q":"What percentage of the Norwegian population lived in towns and cities by the end of the 19th century?","o":["15%","23%","35%","70%"],"a":2,"e":"The lesson states that prior to 1850, approximately 15 per cent lived in towns and cities, but by the end of the 19th century, this figure had increased to 35 per cent."},{"id":"history-norway-from-1814-to-1905#6","l":14,"q":"Why did many people move from rural areas to towns and cities in the 19th century?","o":["They wanted to escape the hard life of farming","Factories started up and offered employment","The government forced them to relocate","Rural areas had become too cold for living"],"a":1,"e":"The lesson explains that factories started up in towns and cities, and many people moved from the countryside to find work in these new industries."},{"id":"history-norway-from-1814-to-1905#7","l":14,"q":"Approximately how many Norwegians emigrated to America between 1850 and 1920?","o":["200,000","500,000","800,000","1,000,000"],"a":2,"e":"The lesson states that around 800,000 Norwegians emigrated to America between 1850 and 1920."},{"id":"history-norway-from-1814-to-1905#8","l":14,"q":"On which date did the Storting declare that the union with Sweden was dissolved?","o":["7 May 1905","7 June 1905","17 June 1905","17 July 1905"],"a":1,"e":"The lesson states that the Storting declared on 7 June 1905 that the Swedish king was no longer king of Norway and the union was thereby dissolved."},{"id":"history-norway-from-1814-to-1905#9","l":14,"q":"Who became the first king of Norway after the dissolution of the union with Sweden?","o":["Karl Johan, a Swedish prince","A Danish prince named Carl who took the name Haakon","A Norwegian nobleman elected by the people","Ivar Aasen, chosen for his cultural contributions"],"a":1,"e":"The lesson states that the Danish Prince Carl was elected as the new king of Norway, took the name Haakon, and was king from 1905 until his death in 1957."},{"id":"history-present-day-norway#0","l":15,"q":"What are the most important values in Norwegian society today according to the lesson?","o":["Equality and the freedom to decide over their own lives","Hard work and religious faith","Wealth and military strength","Individual success and competition"],"a":0,"e":"The lesson states that equality and the freedom to decide over their own lives are the most important values in Norwegian society today."},{"id":"history-present-day-norway#1","l":15,"q":"When did the Norwegian labour movement become more organised?","o":["From the 1850s onwards","From the 1880s onwards","From the 1950s onwards","From the 1970s onwards"],"a":1,"e":"The lesson explains that the labour movement became more organised with the growing number of jobs in industry from the 1880s onwards."},{"id":"history-present-day-norway#2","l":15,"q":"Which of the following was achieved as a result of the labour movement?","o":["The right for workers to own factories","Free housing for all workers","Shorter working hours","The right to receive a salary for life"],"a":2,"e":"The lesson states that the labour movement's efforts resulted in shorter working hours, improved workplace safety, health insurance, and financial support for unemployed people."},{"id":"history-present-day-norway#3","l":15,"q":"In what year did women in Norway gain the right to vote?","o":["1890","1913","1950","1976"],"a":1,"e":"The lesson specifically states that women in Norway gained the right to vote as early as in 1913."},{"id":"history-present-day-norway#4","l":15,"q":"What did the Abortion Act of 1976 give women the right to do?","o":["Own property independently from their husbands","Work in any job without permission","Choose to have an abortion","Vote in all elections"],"a":2,"e":"The lesson states that the Abortion Act of 1976 gave women the right to choose abortion, among other things."},{"id":"history-present-day-norway#5","l":15,"q":"According to the 2025 abortion law in Norway, until which week of pregnancy can a woman have an abortion?","o":["Before the 11th week","Before the 15th week","Before the 19th week","Before the 24th week"],"a":2,"e":"The lesson states that in 2025, a new abortion law gives women the right to have an abortion before the 19th week of pregnancy."},{"id":"history-present-day-norway#6","l":15,"q":"When was oil first discovered in the North Sea?","o":["1960","1967","1975","1980"],"a":1,"e":"The lesson clearly states that the first oil was found in the North Sea in 1967."},{"id":"history-present-day-norway#7","l":15,"q":"Who owns the oil resources in Norway according to the lesson?","o":["Private oil companies","The public or state","Foreign investors","The oil workers' unions"],"a":1,"e":"The lesson explains that the oil resources remained public property, and private companies could only buy rights for exploration and production for limited times."},{"id":"history-present-day-norway#8","l":15,"q":"Approximately what proportion of Norwegian employees are members of a trade union today?","o":["Around 25 per cent","Around 50 per cent","Around 75 per cent","Around 90 per cent"],"a":1,"e":"The lesson states that today, around half of all employees (which is 50 per cent) are members of a trade union."},{"id":"history-present-day-norway#9","l":15,"q":"What percentage of Norway's population lives in towns and cities today according to the lesson?","o":["Around 35 per cent","Around 50 per cent","Around 80 per cent","Around 95 per cent"],"a":2,"e":"The lesson provides statistics showing that today around 80 per cent of Norway's population lives in towns and cities."},{"id":"history-the-first-norwegians#0","l":16,"q":"When did the first people come to Norway?","o":["around 20,000 years ago","around 12,000 years ago","around 5,000 years ago","around 2,000 years ago"],"a":1,"e":"The lesson states that the first people came to Norway around 12,000 years ago."},{"id":"history-the-first-norwegians#1","l":16,"q":"How did the first people come to Norway?","o":["Across the ice","By boat from mainland Europe","Following herds of migrating animals","Through a land corridor from the east"],"a":0,"e":"The lesson explains that ice covered the area between mainland Europe and the Norwegian coast, and people and animals came to Norway across the ice."},{"id":"history-the-first-norwegians#2","l":16,"q":"What period lasted from 1,800 BC to 500 BC?","o":["The Stone Age","The Bronze Age","The Iron Age","The Viking Age"],"a":1,"e":"The Bronze Age dates are specifically given in the lesson as 1,800 BC–500 BC."},{"id":"history-the-first-norwegians#3","l":16,"q":"During the Bronze Age, what did women learn to do?","o":["Mine iron ore from marshland","Spin yarn and weave cloth from sheep's wool","Make bronze weapons","Travel as Viking traders"],"a":1,"e":"The lesson states that women learned to spin yarn and weave cloth from sheep's wool during the Bronze Age."},{"id":"history-the-first-norwegians#4","l":16,"q":"During which period was the climate in Norway milder than it is today?","o":["The Stone Age","The Bronze Age","The Iron Age","The Viking Age"],"a":1,"e":"The lesson specifically notes that the climate in Norway during the Bronze Age was milder than it is today."},{"id":"history-the-first-norwegians#5","l":16,"q":"How did people in the Iron Age make their tools?","o":["From stone and bone found in forests","From bronze obtained through trade with other countries","From melted iron ore found in marshland","From materials brought by Vikings from other lands"],"a":2,"e":"The lesson explains that people in Norway learned how to make iron from melted iron ore they found in marshland and used it to make tools."},{"id":"history-the-first-norwegians#6","l":16,"q":"In what year did Harald Fairhair become king of all Norway?","o":["800 AD","872 AD","1030 AD","1050 AD"],"a":1,"e":"The lesson states that in 872, the Viking Harald Fairhair became king of the whole of Norway."},{"id":"history-the-first-norwegians#7","l":16,"q":"What was the Vikings' religion linked to?","o":["Christian teachings brought home from Europe","Sea spirits that controlled wind and weather","Norse Gods who could help secure good crops","Iron tools they used in their daily work"],"a":2,"e":"The lesson says the Vikings' religion was linked to tales of the Norse Gods and how they could help secure good crops, fertility and warfare."},{"id":"history-the-first-norwegians#8","l":16,"q":"In what year did the Battle of Stiklestad take place?","o":["1000 AD","1010 AD","1030 AD","1050 AD"],"a":2,"e":"The lesson states that the year 1030 was an important year in Norway's history, as this was when the Battle of Stiklestad took place."},{"id":"history-the-first-norwegians#9","l":16,"q":"Who was Olav Haraldsson in the Battle of Stiklestad?","o":["A powerful chieftain defending the old Norse religion","A Viking trader who came from mainland Europe","A Christian who fought against those who believed in the old Viking religion","A bronze and iron worker who supplied weapons for both sides"],"a":2,"e":"The lesson describes Olav Haraldsson as a Christian who fought against powerful chieftains who believed in the old Viking religion at the Battle of Stiklestad."},{"id":"history-the-middle-ages-and-the-unions#0","l":17,"q":"When did Christianity become more widespread among powerful farmers and chieftains in Norway?","o":["After Olav Haraldsson was killed in 1030 and his son sought to make him a saint","During the Viking Age be
