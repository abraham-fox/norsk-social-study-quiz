Leksjonen sier at metaller er en stor eksportvare, spesielt aluminium."},{"id":"sustainability-nature-and-natural-resources#7","l":37,"q":"Hvilke kilder til elektrisk energi nevnes i leksjonen om Norge?","o":["kull og naturgass","vannkraft og vindkraft","atomkraft og solenergi","vindkraft og solenergi"],"a":1,"e":"Leksjonen nevner at vann i elver og fosser brukes til å lage elektrisk energi, og at man også produserer elektrisk kraft ved hjelp av vindmøller."},{"id":"sustainability-nature-and-natural-resources#8","l":37,"q":"Hva trekker turister til Norge ifølge leksjonen?","o":["skikjøring og fjellturer","fjordene og midnattssola","museer og kulturminner","bare vintersport"],"a":1,"e":"Leksjonen sier at turister kommer fra hele verden for å se fjordene og midnattssola."},{"id":"sustainability-nature-and-natural-resources#9","l":37,"q":"Hvorfor regnes naturen i seg selv som en ressurs i Norge?","o":["fordi trær vokser der","fordi turister kommer fra hele verden for å se den","fordi det finnes olje der","fordi den trenger lovmessig vern"],"a":1,"e":"Leksjonen sier at naturen i seg selv også er en ressurs, fordi turister kommer fra hele verden for å se fjordene og midnattssola."},{"id":"sustainability-nature-conservation-and-environmental-protection#0","l":38,"q":"Hva er hovedmålet med natur- og miljøvern?","o":["Å tjene penger på å selge naturressurser","Å sikre at mennesker, dyr og planter får et godt livsmiljø, også for ettertiden","Å stoppe all menneskelig aktivitet i naturen","Å øke produksjonen av gjenvunne materialer"],"a":1,"e":"Leksjonen sier at natur- og miljøvern skal sikre at mennesker, dyr og planter skal ha et godt livsmiljø, også for ettertiden."},{"id":"sustainability-nature-conservation-and-environmental-protection#1","l":38,"q":"Hva er forskjellen på gjenbruk og gjenvinning?","o":["Gjenbruk betyr at ting plukkes fra hverandre til råvarer, og gjenvinning betyr at andre mennesker bruker tingen","Gjenbruk betyr at andre mennesker bruker tingen, og gjenvinning betyr at tingen plukkes fra hverandre eller smeltes om og blir til noe nytt","De er helt det samme","Gjenbruk gjelder bare klær, og gjenvinning gjelder bare plast"],"a":1,"e":"Ifølge leksjonen betyr gjenbruk at ting vi ikke trenger lenger, kan brukes på nytt av andre, mens gjenvinning betyr at tingene plukkes fra hverandre til råvarer og settes sammen igjen på en ny måte."},{"id":"sustainability-nature-conservation-and-environmental-protection#2","l":38,"q":"Hvor mye søppel kaster hver innbygger i Norge i året?","o":["Flere titalls kilo","Flere hundre kilo","Flere tusen kilo","Mer enn én million kilo"],"a":1,"e":"Leksjonen sier at hver innbygger i Norge kaster flere hundre kilo søppel i året."},{"id":"sustainability-nature-conservation-and-environmental-protection#3","l":38,"q":"Hva betyr kildesortering?","o":["At vi kaster all søppel i én container hjemme","At vi bare tar søppel med til gjenvinningsstasjonen én gang i året","At innbyggerne sorterer sin egen søppel","At vi brenner søppel for å få det til å ta mindre plass"],"a":2,"e":"Leksjonen forklarer at innbyggerne i mange kommuner sorterer sin egen søppel, og at dette kalles kildesortering."},{"id":"sustainability-nature-conservation-and-environmental-protection#4","l":38,"q":"Hva er matsvinn ifølge leksjonen?","o":["Mat som er utgått på dato og ikke lenger er trygg å spise","Mat som er tilberedt, men ikke spist opp","Spiselig mat som kastes eller brukes til noe annet enn menneskemat","Mat som blir liggende igjen på tallerkenene på restauranter"],"a":2,"e":"Leksjonen sier at matsvinn er når spiselig mat kastes eller brukes til noe annet enn menneskemat."},{"id":"sustainability-nature-conservation-and-environmental-protection#5","l":38,"q":"Hvor stor del av all maten som blir produsert i verden, kastes ifølge leksjonen?","o":["Omtrent en tidel","Omtrent en fjerdedel","Omtrent en tredjedel","Omtrent halvparten"],"a":2,"e":"Leksjonen sier at en tredjedel av all maten som blir produsert på verdensbasis, kastes."},{"id":"sustainability-nature-conservation-and-environmental-protection#6","l":38,"q":"Hva sier leksjonen om maten som kastes globalt hvert år?","o":["Den blir for det meste sendt til fattige land som nødhjelp","Den blir for det meste brukt til drivstoff for biler og busser","Den ville være nok til å fø alle sultne mennesker i verden","Den blir for det meste kildesortert og gjort om til ny mat"],"a":2,"e":"Leksjonen sier at maten som kastes globalt hvert år, ville være nok til å fø alle sultne mennesker i verden."},{"id":"sustainability-nature-conservation-and-environmental-protection#7","l":38,"q":"Hva er de største kildene til utslipp av klimagasser i Norge?","o":["Landbruk og jordbruk","Oppvarming og matlaging i husholdninger","Olje- og gassutvinning, industri og bergverk og veitrafikk","Flytrafikk og internasjonal skipsfart"],"a":2,"e":"Leksjonen sier at de største utslippene kommer fra olje- og gassutvinning, industri og bergverk og veitrafikk."},{"id":"sustainability-nature-conservation-and-environmental-protection#8","l":38,"q":"Hva betyr det at en bil er en nullutslippsbil?","o":["Bilen forurenser mindre enn eldre biler","Bilen avgir ikke klimagasser","Bilen bruker bare strøm fra fornybare kilder","Bilen er dyrere å kjøpe enn bensinbiler"],"a":1,"e":"Leksjonen sier at en nullutslippsbil ikke avgir klimagasser."},{"id":"sustainability-nature-conservation-and-environmental-protection#9","l":38,"q":"Hva er målet i Norge for økningen i persontransporten i de store byene?","o":["All ny transport skal skje med private elbiler","All økning skal skje med kollektivtransport, sykkel eller ved at menneskene går","Alle skal bruke elbil i stedet for kollektivtransport","Biltrafikken skal øke på samme måte som innbyggertallet"],"a":1,"e":"Leksjonen sier at det er et mål at all økning i persontransporten i de store byene skal gjøres med kollektivtransport, sykkel eller ved at menneskene går."},{"id":"sustainability-sustainable-development#0","l":39,"q":"Hva er hovedmålet med FNs bærekraftsmål?","o":["Å øke handelen mellom land","Å utrydde fattigdom, bekjempe ulikheter og stoppe klimaendringene innen 2030","Å forbedre transportsystemene i hele verden","Å skape flere arbeidsplasser for alle"],"a":1,"e":"Ifølge leksjonen har planen som mål at vi sammen skal utrydde fattigdom, bekjempe forskjellige typer ulikheter og stoppe klimaendringene innen 2030."},{"id":"sustainability-sustainable-development#1","l":39,"q":"Hva er hovedforskjellen mellom vær og klima?","o":["Været er gjennomsnittet over lang tid, mens klimaet er det vi opplever hver dag","Været er det vi opplever hver dag, mens klimaet er gjennomsnittet over lang tid","Været er det vi opplever i ett land, mens klimaet er det vi opplever i hele verden","Været er det vi opplever om sommeren, mens klimaet er det vi opplever om vinteren"],"a":1,"e":"Leksjonen sier at været er det vi opplever hver dag, mens klimaet er gjennomsnittet av været målt over lang tid."},{"id":"sustainability-sustainable-development#2","l":39,"q":"Hva mener de fleste klimaforskere er årsaken til de raske klimaendringene, ifølge leksjonen?","o":["Endringer i energien fra solen","Naturlige havstrømmer","Menneskenes utslipp av karbongasser","Jordens naturlige sykluser"],"a":2,"e":"Leksjonen sier at de fleste klimaforskere mener at menneskenes utslipp av karbongasser er årsaken til de store og raske endringene vi ser i dag."},{"id":"sustainability-sustainable-development#3","l":39,"q":"Hvilken av disse klimaendringene er IKKE nevnt i leksjonen?","o":["Temperaturen på kloden stiger","Isen smelter","Nedbøren blir mindre variert","Havet blir surere"],"a":2,"e":"Leksjonen nevner at det blir variert nedbør, ikke mindre variert nedbør, så dette alternativet er feil."},{"id":"sustainability-sustainable-development#4","l":39,"q":"Hvilke av disse er eksempler på fornybare ressurser, ifølge leksjonen?","o":["Olje, kull og gass","Trær, vind og solstråler","Bare metaller og mineraler","Bare olje og vann"],"a":1,"e":"Leksjonen nevner dyr, trær og planter, nedbør, vind og vann og solstråler som eksempler på fornybare ressurser."},{"id":"sustainability-sustainable-development#5","l":39,"q":"Hvilken av disse er en ikke-fornybar ressurs?","o":["Vind","Vann","Kull","Trær"],"a":2,"e":"Leksjonen nevner kull som et eksempel på en ikke-fornybar ressurs."},{"id":"sustainability-sustainable-development#6","l":39,"q":"Hva er en viktig fordel med å spise lokalprodusert mat?","o":["Den er alltid billigere enn importert mat","Den krever aldri sprøytemidler","Den gir mindre behov for transport og sparer klimagassutslipp","Den smaker alltid bedre enn importert mat"],"a":2,"e":"Leksjonen sier at når maten produseres lokalt, blir det mindre behov for transport, og vi sparer mye klimagassutslipp."},{"id":"sustainability-sustainable-development#7","l":39,"q":"Hva er det lettere å ha kontroll med når maten er lokalt produsert, ifølge leksjonen?","o":["Prisen, emballasjen og holdbarheten","Smaken, fargen og størrelsen på maten","Sprøytemidler, bruk av antibiotika og dyrenes levekår","Eksportregler, tollavgifter og importskatter"],"a":2,"e":"Leksjonen sier at det er lettere å ha kontroll med produksjonen av lokalt produsert mat, for eksempel sprøytemidler, bruk av antibiotika og dyrenes levekår."},{"id":"sustainability-sustainable-development#8","l":39,"q":"Hva betyr begrepet «fornybar ressurs», ifølge leksjonen?","o":["En ressurs som må gjenvinnes jevnlig","En naturressurs som fornyer seg selv og ikke brukes opp ved riktig utnytting","En ressurs som bare kan brukes én gang","En ressurs som bare finnes i rike land"],"a":1,"e":"Leksjonen forklarer at fornybare ressurser er naturressurser som fornyer seg selv og ikke brukes opp ved riktig utnytting."},{"id":"sustainability-sustainable-development#9","l":39,"q":"Innen hvilket år er målet at FNs bærekraftsmål skal være nådd?","o":["2020","2025","2030","2035"],"a":2,"e":"Leksjonen sier at målet er å utrydde fattigdom, bekjempe ulikheter og stoppe klimaendringene innen 2030."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#0","l":40,"q":"Hva er vold ifølge leksjonen?","o":["En lovlig straff som blir gitt av domstolene","Overgrep mot andre","En konflikt mellom mennesker som ikke gjør skade","En type kriminell etterforskning"],"a":1,"e":"Leksjonen sier at vold er overgrep mot andre."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#1","l":40,"q":"Hvilke typer vold finnes det ifølge leksjonen?","o":["Bare fysisk og psykisk vold","Fysisk, psykisk, seksuell og materiell vold","Bare fysisk vold","Bare seksuell og materiell vold"],"a":1,"e":"Leksjonen sier at volden kan være fysisk, psykisk, seksuell eller materiell."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#2","l":40,"q":"Hva er vold i nære relasjoner?","o":["Vold som foregår på offentlige steder","Vold mellom familiemedlemmer eller andre som står hverandre nær","Vold bare mellom ektefeller","Vold som gir små skader"],"a":1,"e":"Leksjonen definerer vold i nære relasjoner som vold mellom familiemedlemmer eller andre som står hverandre nær, eller vold mellom barn og voksne der den voksne har et omsorgsansvar for barnet."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#3","l":40,"q":"Hva står det om vold i Norges lover?","o":["Norges lover forbyr all bruk av vold.","Norges lover tillater vold i visse tilfeller.","Vold er bare ulovlig hvis den fører til alvorlig skade.","Vold i nære relasjoner er tillatt etter norsk lov."],"a":0,"e":"Leksjonen sier at Norges lover forbyr all bruk av vold."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#4","l":40,"q":"Er vold i nære relasjoner en privatsak i Norge?","o":["Ja, det er en privatsak i familien.","Nei, det er ikke en privatsak.","Det er en privatsak, med mindre noen blir alvorlig skadet.","Det er bare en sak for samfunnet hvis barn er involvert."],"a":1,"e":"Leksjonen sier at vold i nære relasjoner ikke er en privatsak."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#5","l":40,"q":"Hvilken følge kan det ha for barn å være vitne til vold, ifølge leksjonen?","o":["Det har ingen negative følger.","Det hjelper barn å bli sterkere følelsesmessig.","Det kan ha negative følger for barn.","Det påvirker bare barn hvis de selv blir utsatt for volden."],"a":2,"e":"Leksjonen sier at det kan ha negative følger for et barn å være vitne til vold."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#6","l":40,"q":"Hvilken gruppe nevnes i leksjonen som ekstra utsatt for vold i nære relasjoner?","o":["Bare eldre mennesker","Bare skilte personer","LHBTIQ+-personer","Bare rike familier"],"a":2,"e":"Leksjonen sier at lesbiske, homofile, bifile, transpersoner, interkjønn-personer og andre LHBTIQ+-personer kan være ekstra utsatt for vold i nære relasjoner."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#7","l":40,"q":"Hva sier leksjonen om tvangsekteskap og kjønnslemlestelse?","o":["De er tradisjoner som bør respekteres.","De er vold og kan ikke aksepteres.","De er lovlige i Norge under visse vilkår.","De er bare skadelige hvis de skjer uten samtykke."],"a":1,"e":"Leksjonen sier at tvangsekteskap og kjønnslemlestelse også er vold og ikke kan aksepteres."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#8","l":40,"q":"Hvilket ansvar har samfunnet overfor mennesker som blir utsatt for vold?","o":["Å overlate vold i hjemmet til familien selv","Å beskytte og ta vare på alle som blir utsatt for vold","Å bare hjelpe dem som flytter ut av hjemmet sitt","Å straffe alle familiemedlemmer i et hjem med vold"],"a":1,"e":"Leksjonen sier at samfunnet har ansvar for å beskytte og ta vare på alle mennesker som blir utsatt for vold."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#9","l":40,"q":"Hva kan negativ sosial kontroll innebære, ifølge leksjonen?","o":["Bare økonomisk press","Bare sosial kritikk","Vold","Bare psykisk manipulasjon uten vold"],"a":2,"e":"Leksjonen sier at negativ sosial kontroll også kan innebære vold."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#0","l":41,"q":"Hva er kjønnslemlestelse?","o":["Inngrep som skader eller fjerner de ytre kjønnsdelene uten at det er medisinsk nødvendig","Inngrep som skader eller fjerner de ytre kjønnsdelene når det er medisinsk nødvendig","Et lite kirurgisk inngrep for å behandle visse sykdommer","Et frivillig inngrep som noen kvinner velger av kulturelle grunner"],"a":0,"e":"Leksjonen forklarer at kjønnslemlestelse er inngrep som skader eller fjerner de ytre kjønnsdelene uten at det er medisinsk nødvendig."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#1","l":41,"q":"Hvor mange års fengsel kan man få for grov kjønnslemlestelse i Norge?","o":["seks år","ti år","femten år","tjue år"],"a":2,"e":"Leksjonen sier at den som utfører grov kjønnslemlestelse, kan straffes med fengsel i inntil 15 år."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#2","l":41,"q":"Hvis en kvinne sier ja til kjønnslemlestelse, er det likevel forbudt etter norsk lov?","o":["Nei, når hun sier ja, er det lovlig","Nei, det er tillatt hvis kvinnen er voksen","Ja, det er likevel forbudt, selv om hun sier ja","Nei, det er bare forbudt hvis kvinnen er imot det"],"a":2,"e":"Leksjonen sier at det er forbudt selv om jenta eller kvinnen sier ja til kjønnslemlestelsen."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#3","l":41,"q":"Hvor lang straff kan man få hvis man bryter avvergelsesplikten?","o":["seks måneder","ett år","tre år","fem år"],"a":1,"e":"Leksjonen sier at brudd på avvergelsesplikten kan straffes med bøter eller fengsel i inntil ett år."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#4","l":41,"q":"Er det forbudt i Norge å ta en jente ut av landet for å få utført kjønnslemlestelse?","o":["Nei, det som skjer utenfor Norge, omfattes ikke av norsk lov","Nei, det er tillatt hvis foreldrene sier ja","Ja, det er forbudt å ta en jente ut av Norge for å få skadet kjønnsorganet hennes i utlandet","Nei, det er bare forbudt hvis det skjer i Norge"],"a":2,"e":"Leksjonen sier at det er forbudt å ta en jente ut av Norge og få skadet kjønnsorganet hennes i utlandet."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#5","l":41,"q":"Hvorfor er kjønnslemlestelse forbudt i Norge, ifølge leksjonen?","o":["Fordi det ikke finnes leger som kan utføre det","Fordi det er for dyrt for staten å tillate det","Fordi det bryter med likestilling mellom kjønn og retten til å bestemme over sin egen kropp","Fordi det bare praktiseres i noen få land"],"a":2,"e":"Leksjonen forklarer at likestilling mellom kjønn er en viktig verdi i Norge, og at alle skal få bestemme over sin egen kropp, noe kjønnslemlestelse bryter med."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#6","l":41,"q":"Hvor kan en som står i fare for å bli utsatt for kjønnslemlestelse, få hjelp ifølge leksjonen?","o":["skattekontoret","helsestasjonen","postkontoret","biblioteket"],"a":1,"e":"Leksjonen nevner helsestasjonen, sammen med fastlegen og politiet, som et sted der en som står i fare for å bli utsatt for kjønnslemlestelse, kan få hjelp."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#7","l":41,"q":"Er det lovlig i Norge å fornye eller gjenskape en kjønnslemlestelse som er utført tidligere?","o":["Ja, hvis kvinnen sier ja","Ja, hvis en lege utfører det","Nei, det er forbudt å fornye eller gjenskape en tidligere kjønnslemlestelse","Ja, det er tillatt av hensyn til helse og hygiene"],"a":2,"e":"Leksjonen sier at det er forbudt å fornye eller gjenskape en tidligere kjønnslemlestelse."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#8","l":41,"q":"Hvordan kan kjønnslemlestelse skade jenter, ifølge leksjonen?","o":["Det har ingen varige følger","Det gir bare smerter mens inngrepet pågår","Det kan føre til store plager for jenta resten av livet","Det rammer bare jenter i tenårene"],"a":2,"e":"Leksjonen sier at kjønnslemlestelse er skadelig og kan føre til store plager for jenta resten av livet."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#9","l":41,"q":"Er det lovlig i Norge å hjelpe en annen person med å utføre kjønnslemlestelse?","o":["Ja, hvis du er et familiemedlem som hjelper til med en kulturell tradisjon","Ja, hvis jenta eller kvinnen sier ja","Nei, det er forbudt å gi noen hjelp og mulighet til å skade en jentes eller kvinnes kjønnsorganer","Ja, hvis helsepersonell utfører inngrepet"],"a":2,"e":"Leksjonen sier at det er forbudt å gi noen hjelp og mulighet til å skade en jentes eller kvinnes kjønnsorganer."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#0","l":42,"q":"Hva er aldersgrensen for å gifte seg i Norge?","o":["16 år","17 år","18 år","19 år"],"a":2,"e":"Ifølge ekteskapsloven kan alle som er over 18 år, og som oppfyller de andre vilkårene, inngå ekteskap i Norge."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#1","l":42,"q":"Hvem kan inngå ekteskap i Norge?","o":["Bare personer av motsatt kjønn","Bare personer av samme kjønn","Personer av motsatt eller samme kjønn","Bare ugifte personer som er 25 år eller eldre"],"a":2,"e":"Ifølge teksten kan to personer av motsatt eller samme kjønn inngå ekteskap."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#2","l":42,"q":"Hva er et kjærlighetsekteskap?","o":["Foreldrene finner en ektefelle til barna sine","Et ekteskap mellom rike personer","De to som skal gifte seg, finner hverandre selv og bestemmer seg for å gifte seg","Et ekteskap som staten har godkjent"],"a":2,"e":"Et kjærlighetsekteskap er et ekteskap der de to som skal gifte seg, finner hverandre selv og bestemmer seg for å gifte seg."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#3","l":42,"q":"Hva er den viktigste forskjellen mellom et arrangert ekteskap og et tvangsekteskap?","o":["I arrangerte ekteskap er ikke foreldrene med, men i tvangsekteskap er de med","I arrangerte ekteskap godtar barna valget til foreldrene, men i tvangsekteskap blir de presset eller tvunget","Arrangerte ekteskap er tradisjonelle, mens tvangsekteskap er moderne","Begge deler er like ulovlig i Norge"],"a":1,"e":"I et arrangert ekteskap spiller foreldrene en viktig rolle og barna aksepterer valget deres, mens i et tvangsekteskap utsetter foreldrene barna for press til å gifte seg."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#4","l":42,"q":"Hvilken straff kan man få for å tvinge noen til å gifte seg i Norge?","o":["En bot på 50 000 kroner","Fengsel i inntil 3 år","Fengsel i inntil 6 år","Samfunnsstraff i 2 år"],"a":2,"e":"Ifølge straffeloven og teksten kan den som tvinger eller presser noen til å gifte seg, straffes med fengsel i inntil seks år."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#5","l":42,"q":"Hva kan man gjøre i en norsk domstol hvis man er blitt tvunget til å gifte seg?","o":["Man kan bare få skilsmisse etter en ventetid","Man kan få ekteskapet annullert","Man må bli i ekteskapet","Man kan bare flytte fra hverandre uformelt"],"a":1,"e":"Den som er blitt tvunget eller presset til å gifte seg, kan gå til en norsk domstol og få annullert ekteskapet."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#6","l":42,"q":"Hvor mange år etter at man giftet seg, kan man få et tvangsekteskap annullert i en norsk domstol?","o":["1 år","3 år","5 år","10 år"],"a":2,"e":"Teksten sier at man må få annullert et tvangsekteskap senest fem år etter at man giftet seg."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#7","l":42,"q":"Hvilken straff får den som medvirker til at en annen person blir tvunget til å gifte seg?","o":["Personen får ingen rettslige konsekvenser","Personen må betale en større bot enn den som er hovedmann","Personen får bare en advarsel","Personen får samme straff som den som tvinger noen til å gifte seg"],"a":3,"e":"Ifølge straffeloven straffes medvirkning på samme måte som selve tvangen, altså med fengsel i inntil seks år."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#8","l":42,"q":"Har kvinner og menn samme rett til å velge ektefelle i Norge?","o":["Nei, menn har flere rettigheter","Nei, kvinner har flere rettigheter","Ja, de har samme rett","Det avhenger av alder og bosted"],"a":2,"e":"Ifølge ekteskapsloven har kvinner og menn samme rett til fritt å velge ektefelle selv."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#9","l":42,"q":"Hva må være oppfylt for at et ekteskap skal være gyldig i Norge?","o":["Storfamilien må godkjenne det","Det må være mellom to personer av motsatt kjønn","Det må inngås frivillig","Det må registreres innen 1 måned etter seremonien"],"a":2,"e":"Alle ekteskap skal inngås frivillig, og et tvangsekteskap er ugyldig etter norsk rett."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#0","l":43,"q":"Hva er sosial kontroll?","o":["Rammene rundt oppførsel og levesett som settes rundt hvert enkelt individ","En økonomisk støtteordning fra staten for familier med strenge regler","Regler som bare gjelder for innvandrere som lærer norsk","Lover som hindrer unge i å jobbe"],"a":0,"e":"Leksjonen forklarer at sosial kontroll er begrepet som brukes om rammene rundt oppførsel og levesett som settes rundt hvert enkelt individ."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#1","l":43,"q":"Hvem kan ifølge leksjonen sette rammer for oppførselen til et individ?","o":["Foreldre og samfunnet gjennom regler og lover","Bare staten gjennom lover","Bare foreldre og andre i familien","Bare skolen og lærerne"],"a":0,"e":"Leksjonen sier at foreldre setter rammer rundt barnas liv gjennom barneoppdragelsen, og at samfunnet setter rammer gjennom skrevne og uskrevne regler og lover."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#2","l":43,"q":"Når oppleves sosial kontroll negativt?","o":["Når foreldre setter noen regler i det hele tatt","Når noen synes at reglene er for strenge og urimelige","Når samfunnet har både skrevne og uskrevne regler","Når barn blir tenåringer"],"a":1,"e":"Leksjonen sier at når reglene oppfattes som urimelige, oppleves den sosiale kontrollen negativt."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#3","l":43,"q":"Hva er en konsekvens av negativ sosial kontroll som nevnes i leksjonen?","o":["Den hjelper barn med å bli mer selvstendige","Den kan frata individet retten til å leve et selvstendig liv","Den gjør at foreldre ikke stoler på barna sine","Den gjør reglene lettere å forstå"],"a":1,"e":"Leksjonen sier at negativ sosial kontroll kan frata individet den personlige friheten og retten til å leve et selvstendig liv."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#4","l":43,"q":"Hvorfor måtte Merhet slutte å spille håndball?","o":["Skolen hennes hadde ikke noe håndballag","Hun ville konsentrere seg om skolearbeidet","Faren hennes liker ikke at hun bruker shorts når hun spiller","Hun hadde for mange andre aktiviteter"],"a":2,"e":"Leksjonen sier at Merhet har måttet slutte å spille håndball fordi faren hennes ikke liker at hun bruker shorts når hun spiller."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#5","l":43,"q":"Hvor gammel var Merhets bror da Merhet var 14 år?","o":["12 år","14 år","16 år","18 år"],"a":2,"e":"Leksjonen sier at broren er to år eldre enn Merhet, så han er 16 år når hun er 14."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#6","l":43,"q":"Hva gjorde moren til Merhet hver kveld?","o":["Hun hjalp Merhet med leksene hun hadde fått på skolen","Hun sjekket telefonen til Merhet for å se hvem hun snakket med","Hun dro ut for å treffe venninnene sine i byen","Hun sjekket skolebøkene til Merhet og karakterene hennes"],"a":1,"e":"Leksjonen sier at moren hver kveld sjekker telefonen til Merhet for å se hvem hun har snakket med og sendt melding til."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#7","l":43,"q":"Hva merket Merhet med foreldrene sine da hun kom i puberteten?","o":["De ga henne mer frihet","De ble mye strengere","De sluttet å bry seg om aktivitetene hennes","De flyttet til en annen by"],"a":1,"e":"Leksjonen sier at Merhet har kommet i puberteten og merker at foreldrene hennes har blitt mye strengere."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#8","l":43,"q":"To år senere: Hva var annerledes i Merhets liv sammenlignet med de norske skolevenninnene hennes?","o":["De hadde strengere foreldre enn henne","Hun hadde den samme friheten som dem","Det var stor forskjell på hverdagen deres","De fikk heller ikke overnatte hos hverandre"],"a":2,"e":"Leksjonen sier at Merhet merker stor forskjell på sin hverdag og de norske skolevenninnenes hverdag."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#9","l":43,"q":"Hva slags hjelp finnes ifølge leksjonen på Merhets skole?","o":["En sosialarbeider som er spesialist på familieproblemer","En minoritetsrådgiver","En psykolog som jobber med innvandrerfamilier","En støttegruppe for unge med strenge foreldre"],"a":1,"e":"Leksjonen sier at Merhet har hørt at det finnes en minoritetsrådgiver på skolen."},{"id":"this-is-norway-equality#0","l":44,"q":"Hva er en av de aller viktigste verdiene i det norske samfunnet?","o":["Individuell suksess","Likeverd mellom mennesker","Lojalitet til familien","Hardt arbeid"],"a":1,"e":"Teksten sier at en av de aller viktigste verdiene i det norske samfunnet er likeverd mellom mennesker."},{"id":"this-is-norway-equality#1","l":44,"q":"Når begynte det å rettes mer oppmerksomhet mot kvinners rettigheter i samfunnet?","o":["i 1940-årene","i 1970-årene","i 1990-årene","i 2000-årene"],"a":1,"e":"Teksten sier at det i 1970-årene ble rettet mer og mer oppmerksomhet mot kvinners rettigheter og muligheter innenfor utdanning og i arbeidslivet."},{"id":"this-is-norway-equality#2","l":44,"q":"Hva sier teksten om kvinner i arbeidslivet i Norge i dag?","o":["Mange færre kvinner enn menn er i jobb","Nesten like mange kvinner som menn står i jobb","Dobbelt så mange menn som kvinner er i jobb","Like mange kvinner og menn er i jobb, og det finnes ingen forskjeller mellom kjønnene"],"a":1,"e":"Teksten sier at kvinners yrkesdeltakelse har økt kraftig siden 1970-årene, og at nesten like mange kvinner som menn står i jobb i dag."},{"id":"this-is-norway-equality#3","l":44,"q":"Hvilket av disse er et eksempel på likestilling i praksis i Norge?","o":["Ulik lønn avhengig av kjønn","Lik lønn for likt arbeid","Flere lederstillinger til menn","Tradisjonell rollefordeling i familiene"],"a":1,"e":"Teksten nevner prinsippet om lik lønn for likt arbeid som et eksempel på at samfunnet jobber for å gi alle like muligheter."},{"id":"this-is-norway-equality#4","l":44,"q":"Hva viser undersøkelser om husarbeid i norske familier?","o":["Menn gjør mer husarbeid enn kvinner","Kvinner og menn gjør nøyaktig like mye","Kvinner bruker mer tid på husarbeid enn menn","Yngre familier gjør ikke husarbeid"],"a":2,"e":"Teksten sier at kvinner ifølge undersøkelser fortsatt bruker mer tid på husarbeid enn menn."},{"id":"this-is-norway-equality#5","l":44,"q":"Hva kalles § 185 i straffeloven av 2005 gjerne?","o":["Frihetsparagrafen","Likestillingsparagrafen","Rasismeparagrafen","Familieparagrafen"],"a":2,"e":"Teksten sier at § 185 i straffeloven av 2005 gjerne kalles rasismeparagrafen."},{"id":"this-is-norway-equality#6","l":44,"q":"§ 185 forbyr diskriminerende eller hatefulle ytringer som er rettet mot hva?","o":["Menneskers inntekt, utdanning, hobbyer eller politiske meninger","Menneskers yrke, hjemsted, dialekt eller familiesituasjon","Menneskers etnisitet, hudfarge, religion eller funksjonshemming","Menneskers formue, sosiale klasse, arbeidsplass eller sivilstand"],"a":2,"e":"Teksten sier at § 185 forbyr diskriminerende eller hatefulle ytringer som er rettet mot menneskers etnisitet, hudfarge, livssyn, religion, seksuelle legning, kjønnsidentitet/kjønnsuttrykk eller funksjonshemming."},{"id":"this-is-norway-equality#7","l":44,"q":"Hva er hensikten med § 185 i straffeloven?","o":["Å gi staten mer makt","Å begrense all ytringsfrihet likt","Å beskytte minoriteter","Å styre arbeidslivet"],"a":2,"e":"Teksten sier at hensikten med rasismeparagrafen er å beskytte minoriteter."},{"id":"this-is-norway-equality#8","l":44,"q":"Hvilket utsagn om høyere utdanning i Norge er riktig, ifølge teksten?","o":["Langt flere menn enn kvinner har høyere utdanning.","Omtrent like mange kvinner og menn har høyere utdanning.","Langt flere kvinner enn menn har høyere utdanning.","Kvinner og menn med høyere utdanning velger de samme fagene."],"a":1,"e":"Teksten sier at omtrent like mange kvinner og menn har høyere utdanning i dag, men at de fleste fremdeles velger tradisjonelt."},{"id":"this-is-norway-equality#9","l":44,"q":"Hva betyr likeverd, ifølge teksten?","o":["Alle mennesker skal tjene like mye penger.","Alle mennesker har de samme evnene og ferdighetene.","Alle mennesker har like stor verdi, uansett bakgrunn.","Alle mennesker må ha samme jobb og utdanning."],"a":2,"e":"Teksten sier at likeverd betyr at alle mennesker har like stor verdi, uansett kjønn, alder, funksjonsnivå, kulturell bakgrunn, etnisk opprinnelse eller seksuell legning."},{"id":"this-is-norway-facts-about-norway#0","l":45,"q":"Hva er Svalbard?","o":["En fjellkjede på Vestlandet","En øygruppe som hører til Norge","En by i Nord-Norge","En stor fjord på Østlandet"],"a":1,"e":"Leksjonen sier at Svalbard er ei øygruppe som hører til Norge."},{"id":"this-is-norway-facts-about-norway#1","l":45,"q":"Hvor mange kommuner er Norge delt inn i?","o":["150","250","357","450"],"a":2,"e":"Leksjonen sier at Norge er delt inn i 357 kommuner."},{"id":"this-is-norway-facts-about-norway#2","l":45,"q":"Hvor mange fylker er Norge delt inn i?","o":["10","12","15","20"],"a":2,"e":"Leksjonen sier at Norge er delt inn i 15 fylker."},{"id":"this-is-norway-facts-about-norway#3","l":45,"q":"Hvor lang er Norges kystlinje hvis vi strekker den ut?","o":["15 000 kilometer","25 148 kilometer","35 000 kilometer","40 000 kilometer"],"a":1,"e":"Leksjonen sier at Norges kystlinje er 25 148 kilometer lang hvis vi strekker den ut."},{"id":"this-is-norway-facts-about-norway#4","l":45,"q":"Hvor mange øyer ligger det langs kysten av Norge?","o":["Omtrent fem tusen","Omtrent femten tusen","Omtrent tjuefem tusen","Omtrent femti tusen"],"a":3,"e":"Leksjonen sier at det ligger ca. femti tusen øyer langs kysten."},{"id":"this-is-norway-facts-about-norway#5","l":45,"q":"Hva kan man si om sommeren i Nord-Norge?","o":["Den er lang og veldig kald, uten sol","Den er kort, men lys og fin på grunn av midnattssola","Den er lang, varm og veldig solrik","Den er regnfull og mørk i flere måneder"],"a":1,"e":"Leksjonen sier at somrene i Nord-Norge er korte, men at de er lyse og fine på grunn av midnattssola."},{"id":"this-is-norway-facts-about-norway#6","l":45,"q":"Hva er riktig om Vestlandet sammenlignet med Østlandet?","o":["Det regner mer, og våren kommer tidlig","Det regner mindre, og våren kommer sent","Været er likt","Det snør aldri om vinteren"],"a":0,"e":"Leksjonen sier at våren kommer tidlig på Vestlandet, og at det regner mer på Vestlandet enn på Østlandet."},{"id":"this-is-norway-facts-about-norway#7","l":45,"q":"Hva er den høyeste temperaturen som er målt i Norge?","o":["28 grader celsius","32,5 grader celsius","35,6 grader celsius","40 grader celsius"],"a":2,"e":"Leksjonen sier at den høyeste temperaturen som er målt i Norge, er pluss 35,6 grader celsius, målt på Nesbyen 20. juni 1970."},{"id":"this-is-norway-facts-about-norway#8","l":45,"q":"Hvor mange ganger så stort som Norge er India?","o":["Omtrent fem ganger så stort","Omtrent åtte ganger så stort","Nesten ti ganger så stort","Omtrent femten ganger så stort"],"a":2,"e":"Leksjonen sier at India er nesten ti ganger så stort som Norge."},{"id":"this-is-norway-facts-about-norway#9","l":45,"q":"Hvor stor del av befolkningen i Norge bor på Østlandet?","o":["En tredjedel","Halvparten","To tredjedeler","Tre fjerdedeler"],"a":1,"e":"Leksjonen sier at halvparten av befolkningen bor på Østlandet."},{"id":"this-is-norway-minority-and-majority-in-norway#0","l":46,"q":"Hvor mange europeere flyttet til Amerika i perioden 1820–1930?","o":["Ca. fem millioner","Ca. ti millioner","Mer enn tretti millioner","Ca. femti millioner"],"a":2,"e":"I leksjonen står det at mer enn tretti millioner europeere flyttet til Amerika i perioden 1820–1930."},{"id":"this-is-norway-minority-and-majority-in-norway#1","l":46,"q":"Omtrent hvor mange mennesker flyttet fra Norge til Amerika i perioden 1820–1930?","o":["Ca. tre hundre tusen","Ca. åtte hundre tusen","Ca. to millioner","Ca. fem millioner"],"a":1,"e":"I leksjonen står det at ca. åtte hundre tusen mennesker flyttet fra Norge i denne perioden."},{"id":"this-is-norway-minority-and-majority-in-norway#2","l":46,"q":"Omtrent hvor mange innbyggere i Norge er født i utlandet eller har foreldre som er født i utlandet?","o":["Mer enn en halv million","Mer enn én million","Mer enn to millioner","Mer enn tre millioner"],"a":1,"e":"I leksjonen står det at mer enn én million mennesker i Norge er født i utlandet eller har foreldre som er født i utlandet."},{"id":"this-is-norway-minority-and-majority-in-norway#3","l":46,"q":"Hvilke land kommer de største innvandrergruppene i Norge fra?","o":["Tyskland, Frankrike, Spania og Italia","Polen, Litauen, Ukraina, Sverige og Syria","Danmark, Sverige, Finland og Island","India, Pakistan, Bangladesh og Filippinene"],"a":1,"e":"Leksjonen sier at de største innvandrergruppene kommer fra Polen, Litauen, Ukraina, Sverige og Syria."},{"id":"this-is-norway-minority-and-majority-in-norway#4","l":46,"q":"Hvor bor det flest innvandrere i Norge?","o":["I små bygder","I jordbruksområder","I byene","I kystbyer"],"a":2,"e":"Leksjonen sier at det bor innvandrere i alle kommuner, men at det bor flere innvandrere i byene enn på landsbygda."},{"id":"this-is-norway-minority-and-majority-in-norway#5","l":46,"q":"Hva er en nasjonal minoritet i Norge?","o":["Nyere innvandrere som kom til Norge de siste ti årene","Folkegrupper med flere hundre års tilknytning til Norge","Mennesker som snakker et fremmed språk hjemme","Flyktninger fra land i krig"],"a":1,"e":"Leksjonen sier at folkegrupper med flere hundre års tilknytning til landet kalles nasjonale minoriteter."},{"id":"this-is-norway-minority-and-majority-in-norway#6","l":46,"q":"Hvilken gruppe er en nasjonal minoritet i Norge ifølge leksjonen?","o":["Polakker","Litauere","Samer","Syrere"],"a":2,"e":"Leksjonen nevner samer som en av de nasjonale minoritetene, sammen med jøder, kvener/norskfinner, skogfinner, romer og romanifolk/tatere."},{"id":"this-is-norway-minority-and-majority-in-norway#7","l":46,"q":"I hvilket år ratifiserte Norge en avtale om nasjonale minoriteters rettigheter?","o":["1950","1975","1999","2010"],"a":2,"e":"I leksjonen står det at Norge ratifiserte en avtale om nasjonale minoriteters rettigheter i 1999."},{"id":"this-is-norway-minority-and-majority-in-norway#8","l":46,"q":"Hva forplikter staten seg til i avtalen om nasjonale minoriteters rettigheter?","o":["Å sørge for at nasjonale minoriteter tar til seg norsk kultur","Å legge til rette for at nasjonale minoriteter kan bevare kulturen sin","Å begrense hvor mange nasjonale minoriteter som kan bo i Norge","Å kreve at alle nasjonale minoriteter får norsk statsborgerskap"],"a":1,"e":"I leksjonen står det at staten forplikter seg til å legge til rette for at personer som tilhører nasjonale minoriteter, kan bevare og utvikle sin kultur, slik som religion, språk, tradisjoner og kulturarv."},{"id":"this-is-norway-minority-and-majority-in-norway#9","l":46,"q":"Hva er viktig for at innvandrere skal få brukt ressursene sine og bidra til fellesskapet i Norge?","o":["God fysisk helse","Gode norskkunnskaper","Et stort familienettverk","Tidligere yrkeserfaring"],"a":1,"e":"Leksjonen sier at en av nøklene til integrering er at alle som bor i landet, har gode norskkunnskaper."},{"id":"this-is-norway-red-letter-days-and-public-holidays#0","l":47,"q":"Når er 1. nyttårsdag?","o":["31. desember","1. januar","6. januar","1. februar"],"a":1,"e":"Leksjonen sier at den første dagen i året er 1. januar, og at denne dagen kalles 1. nyttårsdag."},{"id":"this-is-norway-red-letter-days-and-public-holidays#1","l":47,"q":"Er samefolkets dag en fridag i Norge?","o":["Ja, det er en fridag","Nei, det er bare en offisiell flaggdag","Ja, men bare i Nord-Norge","Bare for samer"],"a":1,"e":"Leksjonen sier at samefolkets dag 6. februar er en offisiell flaggdag i Norge, men ikke en fridag."},{"id":"this-is-norway-red-letter-days-and-public-holidays#2","l":47,"q":"Når begynte man å markere den internasjonale kvinnedagen hvert år i Norge?","o":["1915","1970","1972","1976"],"a":2,"e":"Leksjonen sier at den internasjonale kvinnedagen har blitt markert i Norge hvert år siden 1972."},{"id":"this-is-norway-red-letter-days-and-public-holidays#3","l":47,"q":"Hvor mange dager etter påske er Kristi himmelfartsdag?","o":["30 dager","40 dager","50 dager","60 dager"],"a":1,"e":"Leksjonen sier at Kristi himmelfartsdag er en torsdag 40 dager etter påske."},{"id":"this-is-norway-red-letter-days-and-public-holidays#4","l":47,"q":"Hvilken merkedag feirer vi at Norge fikk sin egen grunnlov?","o":["Arbeidernes dag","Nasjonaldagen","Kvinnedagen","Kristi himmelfartsdag"],"a":1,"e":"Leksjonen sier at vi på nasjonaldagen 17. mai feirer at landet fikk sin egen grunnlov i 1814."},{"id":"this-is-norway-red-letter-days-and-public-holidays#5","l":47,"q":"Hva er nasjonaldagen først og fremst?","o":["Politiske taler og tog","Arbeidernes dag og arbeidstakeres rettigheter","Barnas dag","Religiøse seremonier"],"a":2,"e":"Leksjonen sier at 17. mai først og fremst er barnas dag."},{"id":"this-is-norway-red-letter-days-and-public-holidays#6","l":47,"q":"Hvilken dato er arbeidernes dag?","o":["1. mars","1. april","1. mai","1. juni"],"a":2,"e":"Leksjonen sier at 1. mai er den internasjonale arbeiderdagen."},{"id":"this-is-norway-red-letter-days-and-public-holidays#7","l":47,"q":"Hva kaller vi 24. desember?","o":["Nyttårsaften","2. juledag","Julaften","1. juledag"],"a":2,"e":"Leksjonen sier at vi kaller 24. desember julaften."},{"id":"this-is-norway-red-letter-days-and-public-holidays#8","l":47,"q":"Er nyttårsaften en fridag i Norge?","o":["Ja, det er alltid en fridag","Nei, det er ikke en fridag","Det er en halv fridag","Det er bare en fridag i noen landsdeler"],"a":1,"e":"Leksjonen sier at nyttårsaften ikke er en fridag."},{"id":"this-is-norway-red-letter-days-and-public-holidays#9","l":47,"q":"I hvilke måneder kan påsken være?","o":["Februar eller mars","Mars eller april","April eller mai","Mai eller juni"],"a":1,"e":"Leksjonen sier at påsken er i mars eller april, og at tidspunktet varierer fra år til år."},{"id":"this-is-norway-religion-and-life-stance#0","l":48,"q":"Hva betyr det at Norge er et sekulært samfunn?","o":["At samfunnet ikke er preget av religion, verken blant privatpersoner eller når lovene utformes","At religion er helt forbudt på alle offentlige steder","At bare én offisiell religion er tillatt i Norge","At innbyggerne kan bli straffet for å praktisere sin egen religion"],"a":0,"e":"I leksjonen står det at et sekulært samfunn ikke er preget av religion, både blant privatpersoner og når landets lover skal utformes."},{"id":"this-is-norway-religion-and-life-stance#1","l":48,"q":"Når ble det lov for nordmenn å melde seg ut av statskirken?","o":["1750","1845","1912","2012"],"a":1,"e":"Leksjonen sier at det var forbudt for nordmenn å melde seg ut av statskirken før 1845."},{"id":"this-is-norway-religion-and-life-stance#2","l":48,"q":"Hva var statsreligion i Norge fram til 2012?","o":["Katolisismen","Protestantismen","Ortodoks kristendom","Islam"],"a":1,"e":"Leksjonen sier at protestantismen var statsreligion i Norge fram til 2012, og at Den norske kirke var en statskirke."},{"id":"this-is-norway-religion-and-life-stance#3","l":48,"q":"Hva slags forhold har mange nordmenn til religion i dag?","o":["Et strengt forhold, der de følger religiøse regler hver dag","Et avslappet forhold, selv om mange tyr til kirken ved viktige hendelser","Et fraværende forhold, der de unngår alt som er knyttet til religion","Et skjult forhold, der de bare praktiserer religion i det skjulte"],"a":1,"e":"Leksjonen sier at mange nordmenn i dag har et mye mer avslappet forhold til religion, selv om mange tyr til kirken i forbindelse med viktige hendelser i livet, som dåp, konfirmasjon, bryllup og begravelse."},{"id":"this-is-norway-religion-and-life-stance#4","l":48,"q":"Hva er en del av den fulle religionsfriheten i Norge?","o":["Man kan praktisere religionen sin uten å være redd for å bli forfulgt eller straffet","Staten bestemmer hvilken religion alle skal tilhøre","Religiøse mennesker må bruke spesielle religiøse klær","Alle innbyggere må være medlem av et trossamfunn"],"a":0,"e":"Leksjonen forklarer at full religionsfrihet betyr at man kan praktisere religionen sin uten å være redd for å bli forfulgt eller straffet."},{"id":"this-is-norway-religion-and-life-stance#5","l":48,"q":"Når ble det lov for ikke-kristne trossamfunn å organisere seg i Norge?","o":["Rundt 1700","Rundt 1850","1925","1975"],"a":1,"e":"Leksjonen sier at det først var rundt 1850 at det ble lov for ikke-kristne trossamfunn å organisere seg i Norge."},{"id":"this-is-norway-religion-and-life-stance#6","l":48,"q":"Hva sier leksjonen om de i Norge som ikke er medlemmer av Den norske kirke?","o":["De kan bli straffet for ikke å være medlem av kirken","De må alle tilhøre et annet kristent trossamfunn","De tilhører andre trossamfunn eller ikke noe trossamfunn","De har ikke lov til å praktisere en annen religion"],"a":2,"e":"Leksjonen sier at de resterende tretti prosent fordeler seg på andre trossamfunn eller ikke hører til noe trossamfunn i det hele tatt."},{"id":"this-is-norway-religion-and-life-stance#7","l":48,"q":"Hvordan får godkjente tros- og livssynssamfunn økonomisk støtte i Norge?","o":["Bare gjennom private gaver fra medlemmene","De får ingen støtte fra staten","De får like mye støtte for hvert medlem som Den norske kirke får, fra staten og kommunen","Trossamfunn får mer støtte enn livssynssamfunn"],"a":2,"e":"Leksjonen sier at godkjente tros- og livssynssamfunn får like mye støtte for hvert av sine medlemmer som det Den norske kirke får, fra staten og kommunen."},{"id":"this-is-norway-religion-and-life-stance#8","l":48,"q":"Hvordan er situasjonen for statskirken i Norge i dag?","o":["Den norske kirke er fortsatt landets offisielle statskirke","Norge har ikke lenger en statskirke eller en offisiell religion","Norge har en katolsk statskirke i stedet for en protestantisk","Hver kommune velger sin egen statskirke og religion"],"a":1,"e":"Leksjonen sier at Norge ikke lenger har en statskirke eller en offisiell religion."},{"id":"this-is-norway-religion-and-life-stance#9","l":48,"q":"Ifølge eksempelet med Kåre i leksjonen: Hvorfor deltar mange nordmenn i kirkelige handlinger i dag, selv om de ikke er religiøse?","o":["De er pålagt ved lov å gå i kirken","De setter pris på stemningen, tradisjonen og høytiden, selv om de ikke er religiøse","De er redde for å bli straffet av myndighetene hvis de ikke går","Religiøs deltakelse har økt kraftig de siste årene"],"a":1,"e":"I eksempelet sier Kåre at han ikke er religiøs, men at det er noe med stemningen, tradisjonen og høytiden likevel."},{"id":"this-is-norway-the-sami-people#0","l":49,"q":"Hvilke fire land bor samene i?","o":["Norge, Sverige, Danmark og Finland","Norge, Sverige, Finland og Russland","Finland, Sverige, Russland og Polen","Norge, Island, Grønland og Canada"],"a":1,"e":"Samene <script>

    footer: 'Questions are AI-generated from the public curriculum at <a href="https://samfunnskunnskap.no/en/" rel="noopener">samfunnskunnskap.no</a> and may contain mistakes. Not affiliated with samfunnskunnskap.no or HK-dir. Free and provided as is, with no guarantees.',
    termsTitle: "About and terms",
    terms: [
      "This is a free practice tool for private use. It is provided “as is”, without warranty of any kind. There is no guarantee that the questions and answers are correct, complete or up to date, or that using it will help you pass the test.",
      "The questions and explanations were generated by AI from the public lessons on samfunnskunnskap.no and may contain mistakes. Always check the official lessons.",
      "The lesson content belongs to its publisher. This site claims no rights to it and is not affiliated with or endorsed by samfunnskunnskap.no, HK-dir or any Norwegian authority.",

    summary: (n, k, m) => `${n} spørsmål · ${k}/${m} temaer`,

    max: n => `maks ${n}`,

      "Ingen personopplysninger samles inn: ingen kontoer, ingen informasjonskapsler, ingen sporing. Innstillingene og fremgangen din lagres bare i denne nettleseren. GitHub, som drifter siden, kan føre vanlige serverlogger.",

// id -> question, per language; ids are shared, so a deck works in both.
const QUESTIONS = {};
for (const lang of Object.keys(BANK.questions)) {
  QUESTIONS[lang] = new Map(BANK.questions[lang].map(q => [q.id, q]));
}
const ALL_IDS = BANK.questions.en.map(q => q.id);
const groupOf = id => BANK.lessons[QUESTIONS.en.get(id).l].g;

// ---- storage -------------------------------------------------------------

function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { /* storage blocked or corrupt */ }
  const browserLang = (navigator.language || "").toLowerCase();
  const state = {
    settings: { n: 10, lang: /^(nb|no|nn)\b/.test(browserLang) ? "nb" : "en", off: [] },
    deck: null,
    stats: { tests: 0, q: {} },
  };
  if (saved && typeof saved === "object") {
    Object.assign(state.settings, saved.settings);
    if (saved.stats && saved.stats.q) state.stats = saved.stats;
    // Ids are positional: a deck from another bank build may point at other questions.
    if (saved.deck && saved.deck.bank === BANK.version) state.deck = saved.deck;
  }
  if (!STRINGS[state.settings.lang]) state.settings.lang = "en";
  return state;
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* not persisted */ }
}

const state = loadState();
const t = key => STRINGS[state.settings.lang][key];

// ---- helpers -------------------------------------------------------------

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c != null && c !== false) node.append(c);
  }
  return node;
}

function shuffled(items) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  const off = new Set(state.settings.off);
  return ALL_IDS.filter(id => !off.has(BANK.groups[groupOf(id)].id));
}

function clampCount() {
  const max = pool().length;
  const n = Math.floor(Number(state.settings.n));
  return Math.max(1, Math.min(Number.isFinite(n) ? n : 10, max || 1));
}

// ---- deck ----------------------------------------------------------------

function newDeck(ids, quiet) {
  state.deck = {
    bank: BANK.version,
    ids,
    perm: ids.map(() => shuffled([0, 1, 2, 3])),
    ans: ids.map(() => null),
    first: ids.map(() => null),
    pos: 0,
    finished: false,
  };
  save();
  render();
  if (quiet) return;
  document.getElementById("card").focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

function startNewTest() {
  const ids = pool();
  const msg = document.getElementById("msg");
  if (!ids.length) {
    msg.textContent = t("noThemes");
    msg.hidden = false;
    return;
  }
  msg.hidden = true;
  const d = state.deck;
  if (d && !d.finished && d.ans.some(a => a !== null) && !confirm(t("confirmNew"))) return;
  newDeck(shuffled(ids).slice(0, clampCount()));
}

function answer(i, choice) {
  const d = state.deck;
  if (d.ans[i] !== null) return;
  const q = QUESTIONS.en.get(d.ids[i]);
  d.ans[i] = choice;
  if (d.first[i] === null) {
    // Only the first attempt counts, so "Try again" cannot inflate the score.
    d.first[i] = choice === q.a;
    const s = state.stats.q[q.id] || (state.stats.q[q.id] = { seen: 0, correct: 0 });
    s.seen++;
    if (d.first[i]) s.correct++;
  }
  save();
  render();
  const card = document.getElementById("card");
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.lastElementChild.scrollIntoView({ block: "nearest", behavior: smooth ? "smooth" : "auto" });
  const focusTarget = document.getElementById(choice === q.a ? "next" : "try-again");
  if (focusTarget) focusTarget.focus({ preventScroll: true });
}

function tryAgain(i) {
  state.deck.ans[i] = null;
  save();
  render();
  const first = document.querySelector("#card input[type=radio]");
  if (first) first.focus({ preventScroll: true });
}

function go(delta) {
  const d = state.deck;
  const pos = Math.max(0, Math.min(d.ids.length, d.pos + delta));
  if (pos === d.pos) return;
  d.pos = pos;
  if (pos === d.ids.length && !d.finished) {
    d.finished = true;
    state.stats.tests++;
  }
  save();
  render();
  const top = document.getElementById("card").getBoundingClientRect().top;
  if (top < 0) window.scrollBy({ top: top - 12 });
}

// ---- rendering -----------------------------------------------------------

function renderCard(i) {
  const d = state.deck;
  const lang = state.settings.lang;
  const q = QUESTIONS[lang].get(d.ids[i]);
  const lesson = BANK.lessons[q.l];
  const chosen = d.ans[i];
  const answered = chosen !== null;

  const options = d.perm[i].map((orig, k) => {
    let cls = "opt";
    let mark = null;
    if (answered) {
      cls += " locked";
      if (orig === q.a) { cls += " correct"; mark = "✓"; }
      else if (orig === chosen) { cls += " wrong"; mark = "✗"; }
    }
    return el("label", { class: cls },
      el("input", {
        type: "radio", name: "opt", value: orig,
        checked: answered && orig === chosen, disabled: answered,
        "aria-keyshortcuts": String(k + 1),
        onchange: () => answer(i, orig),
      }),
      el("span", {}, q.o[orig]),
      mark && el("span", { class: "mark", "aria-hidden": "true" }, mark),
    );
  });

  const nodes = [
    el("p", { class: "meta" }, `${BANK.groups[lesson.g].t[lang]} · ${lesson.t[lang]}`),
    el("h2", { class: "qtext", id: "qtext" }, q.q),
    el("fieldset", { role: "radiogroup", "aria-labelledby": "qtext" }, options),
  ];
  if (answered) {
    const ok = chosen === q.a;
    nodes.push(
      el("p", { class: "verdict " + (ok ? "ok" : "bad") }, ok ? t("correct") : t("wrong")),
      el("p", { class: "expl" }, q.e),
    );
    if (!ok) {
      nodes.push(el("div", { class: "card-actions" },
        el("button", { type: "button", class: "secondary", id: "try-again", onclick: () => tryAgain(i) }, "↺ " + t("tryAgain"))));
    }
  }
  return nodes;
}

function renderResults() {
  const d = state.deck;
  const lang = state.settings.lang;
  const n = d.ids.length;
  const ok = d.first.filter(f => f === true).length;
  const bad = d.first.filter(f => f === false).length;
  const skipped = n - ok - bad;
  const pct = Math.round((100 * ok) / n);
  const passed = ok / n >= PASS_RATIO;

  const perGroup = new Map();
  d.ids.forEach((id, i) => {
    const g = groupOf(id);
    const row = perGroup.get(g) || { ok: 0, n: 0 };
    row.n++;
    if (d.first[i] === true) row.ok++;
    perGroup.set(g, row);
  });
  const bars = [...perGroup.entries()]
    .sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n || a[0] - b[0])
    .map(([g, row]) => el("div", { class: "bar-row" },
      el("span", {}, BANK.groups[g].t[lang]),
      el("span", { class: "v" }, `${row.ok} / ${row.n}`),
      el("div", { class: "bar" }, el("i", { style: `width:${(100 * row.ok) / row.n}%` })),
    ));

  const seen = Object.values(state.stats.q);
  const seenCount = seen.reduce((s, x) => s + (x.seen > 0 ? 1 : 0), 0);
  const attempts = seen.reduce((s, x) => s + x.seen, 0);
  const correct = seen.reduce((s, x) => s + x.correct, 0);
  const lifePct = attempts ? Math.round((100 * correct) / attempts) : null;

  const wrongIds = d.ids.filter((_, i) => d.first[i] === false);
  return [
    el("h2", { class: "qtext" }, t("results")),
    el("div", { class: "score" },
      el("b", {}, `${ok} / ${n}`),
      el("span", {}, `${pct}${lang === "nb" ? " %" : "%"} ${t("firstTry")}`),
    ),
    el("span", { class: "badge " + (passed ? "ok" : "bad") }, passed ? t("onTrack") : t("notYet")),
    el("p", { class: "hint" }, t("passNote")),
    el("div", { class: "tiles" },
      el("div", { class: "tile ok" }, el("b", {}, String(ok)), el("span", {}, t("correct"))),
      el("div", { class: "tile bad" }, el("b", {}, String(bad)), el("span", {}, t("wrong"))),
      el("div", { class: "tile" }, el("b", {}, String(skipped)), el("span", {}, t("skipped"))),
    ),
    el("h3", {}, t("byTheme")),
    el("div", { class: "bars" }, bars),
    el("h3", {}, t("allTests")),
    el("p", { class: "hint" }, t("lifetime")(state.stats.tests, seenCount, ALL_IDS.length, lifePct)),
    el("div", { class: "result-actions" },
      wrongIds.length > 0 && el("button", { type: "button", class: "secondary", onclick: () => newDeck(shuffled(wrongIds)) },
        t("practiseWrong")(wrongIds.length)),
      el("button", { type: "button", class: "primary", onclick: () => newDeck(shuffled(pool()).slice(0, clampCount())) }, t("newTest")),
    ),
  ];
}

function renderSettings() {
  const s = state.settings;
  const max = pool().length;
  const off = new Set(s.off);
  document.getElementById("settings-title").textContent = t("settings");
  document.getElementById("settings-info").textContent =
    t("summary")(max ? clampCount() : 0, BANK.groups.length - off.size, BANK.groups.length);
  document.getElementById("count-label").textContent = t("count");
  document.getElementById("count-hint").textContent = t("max")(max);
  const input = document.getElementById("count");
  input.max = Math.max(max, 1);
  if (document.activeElement !== input) input.value = s.n;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(Number(c.dataset.n) === Number(s.n))));
  document.getElementById("themes-label").textContent = t("themes");
  document.getElementById("themes-all").textContent = t("all");
  document.getElementById("themes-none").textContent = t("none");
  document.getElementById("reset-stats").textContent = t("resetStats");

  const counts = new Map();
  for (const id of ALL_IDS) counts.set(groupOf(id), (counts.get(groupOf(id)) || 0) + 1);
  const box = document.getElementById("themes");
  box.replaceChildren(...BANK.groups.map((g, gi) => el("label", {},
    el("input", {
      type: "checkbox", checked: !off.has(g.id),
      onchange: e => {
        const set = new Set(state.settings.off);
        if (e.target.checked) set.delete(g.id); else set.add(g.id);
        state.settings.off = [...set];
        save();
        renderSettings();
      },
    }),
    el("span", {}, g.t[s.lang]),
    el("span", { class: "n" }, String(counts.get(gi) || 0)),
  )));
}

function render() {
  const lang = state.settings.lang;
  document.documentElement.lang = lang;
  document.title = t("title");
  document.getElementById("title").textContent = t("title");
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("shuffle-label").textContent = t("newTest");
  const footer = document.getElementById("footer");
  if (footer.dataset.lang !== lang) {
    // Rendered once per language so an open "terms" section stays open.
    footer.dataset.lang = lang;
    footer.innerHTML = `<p>${t("footer")}</p><details><summary>${t("termsTitle")}</summary><ul>${t("terms").map(x => `<li>${x}</li>`).join("")}</ul></details>`;
  }
  renderSettings();

  const d = state.deck;
  const atResults = d.pos >= d.ids.length;
  document.getElementById("card").replaceChildren(...(atResults ? renderResults() : renderCard(d.pos)));
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  prev.textContent = t("prev");
  next.textContent = t("next");
  prev.disabled = d.pos === 0;
  next.disabled = atResults;
  document.getElementById("pos").textContent = atResults ? t("results") : `${d.pos + 1} / ${d.ids.length}`;
}

// ---- events --------------------------------------------------------------

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  state.settings.lang = b.dataset.lang;
  save();
  render();
}));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  state.settings.n = Number(c.dataset.n);
  save();
  renderSettings();
}));
document.getElementById("count").addEventListener("input", e => {
  const n = Math.floor(Number(e.target.value));
  if (n >= 1) {
    state.settings.n = n;
    save();
    renderSettings();
  }
});
document.getElementById("count").addEventListener("change", e => {
  state.settings.n = clampCount();
  e.target.value = state.settings.n;
  save();
  renderSettings();
});
document.getElementById("themes-all").addEventListener("click", () => {
  state.settings.off = [];
  save();
  renderSettings();
});
document.getElementById("themes-none").addEventListener("click", () => {
  state.settings.off = BANK.groups.map(g => g.id);
  save();
  renderSettings();
});
document.getElementById("reset-stats").addEventListener("click", () => {
  if (!confirm(t("confirmReset"))) return;
  state.stats = { tests: 0, q: {} };
  save();
  render();
});
document.getElementById("shuffle").addEventListener("click", startNewTest);
document.getElementById("prev").addEventListener("click", () => go(-1));
document.getElementById("next").addEventListener("click", () => go(1));
document.getElementById("card").tabIndex = -1;

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.matches("input[type=number], input[type=checkbox], summary")) return;
  const d = state.deck;
  if (e.target.matches("input[type=radio]")) {
    // Native arrow keys would check the next radio and answer the question; move focus only.
    const radios = [...document.querySelectorAll("#card input[type=radio]")];
    const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (step) {
      radios[(radios.indexOf(e.target) + step + radios.length) % radios.length].focus();
      e.preventDefault();
      return;
    }
    if (e.key === "Enter") { e.target.click(); return; }
  }
  if (e.key === "ArrowRight") { go(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); }
  else if (/^[1-4]$/.test(e.key) && d.pos < d.ids.length) {
    answer(d.pos, d.perm[d.pos][Number(e.key) - 1]);
  }
});

if (!state.deck) newDeck(shuffled(pool().length ? pool() : ALL_IDS).slice(0, clampCount()), true);
else render();
</script>
</body>
</html>
