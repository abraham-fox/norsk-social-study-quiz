way?","o":["Wait for jobs to be advertised in newspapers and online","Focus only on large companies with official job postings","Take on practical training or odd jobs to build experience and expand your network","Contact family members to help find employment opportunities"],"a":2,"e":"The lesson recommends that it may be a good idea to do practical training, take courses, or do various odd jobs to develop your network and obtain references when finding a first job in Norway."}],"nb":[{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#0","l":0,"q":"Hva er kildekritikk?","o":["Å vurdere det man leser","Å nekte å tro på noe som står på internett","Å skrive kritiske anmeldelser av bøker","Å kopiere informasjon fra flere kilder"],"a":0,"e":"Leksjonen sier at kildekritikk betyr å vurdere det man leser."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#1","l":0,"q":"Hva legger det norske samfunnet vekt på når det gjelder meninger?","o":["At alle skal ha sine egne meninger","At bare lærere skal si hva de mener","At folk skal unngå å ha ulike meninger","At barn ikke skal diskutere synspunktene sine"],"a":0,"e":"Leksjonen sier at det norske samfunnet legger vekt på at alle skal ha sine egne meninger."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#2","l":0,"q":"Hva er et eksempel på et kritisk spørsmål man bør stille når man leser noe på internett?","o":["Har den som skriver, en spesiell agenda?","Er nettsiden pen å se på?","Er teksten skrevet nylig?","Har forfatteren mange følgere?"],"a":0,"e":"Leksjonen nevner blant annet spørsmålet «Har den som skriver, en spesiell agenda?» som et kritisk spørsmål."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#3","l":0,"q":"Hvorfor er det viktig å vite hvordan man finner informasjon?","o":["Fordi vi lever i et informasjonssamfunn, og ingen mennesker kan ha all informasjonen i hodet","Fordi internett er den eneste pålitelige kilden","Fordi bøker blir utdaterte","Fordi lærere ikke kan hjelpe oss med å finne informasjon"],"a":0,"e":"Leksjonen forklarer at vi lever i et informasjonssamfunn der ingen kan ha all informasjonen i hodet, og at det derfor er viktig å vite hvor og hvordan vi kan finne den."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#4","l":0,"q":"Hva må du gjøre når du bruker andres musikk i dine egne produksjoner?","o":["Oppgi hvem som har opphavsretten","Spørre artisten om lov personlig","Vente i flere måneder før du bruker den","Aldri bruke andres musikk i noen produksjon"],"a":0,"e":"Leksjonen sier at hvis vi bruker andres tekster, bilder, musikk osv. i våre egne produksjoner, må vi alltid oppgi hvem som har opphavsretten til materialet."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#5","l":0,"q":"Hva er etisk bevissthet?","o":["Å balansere forskjellige hensyn slik at man bedre kan ta avgjørelser","Å følge alle regler uten å stille spørsmål ved dem","Å gjøre det som gjør deg mest fornøyd","Å unngå å ta vanskelige avgjørelser"],"a":0,"e":"Leksjonen sier at etisk bevissthet handler om å balansere forskjellige hensyn, slik at du bedre kan ta avgjørelser og vurdere valgene du tar."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#6","l":0,"q":"Hva lærer barna å gjøre på skolen i Norge?","o":["Argumentere, drøfte og være kreative","Gjenfortelle det læreren og læreboka sier","Alltid være enige, så det ikke blir krangling","Godta det etablerte uten å stille spørsmål"],"a":0,"e":"Leksjonen sier at barna på skolen lærer å argumentere, drøfte og være kreative, og at det ikke er nok å gjenfortelle det læreren har sagt eller det som står i læreboka."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#7","l":0,"q":"Hvem kan legge ut informasjon på internett?","o":["Hvem som helst","Bare utdannede fagfolk","Bare personer med offisiell tillatelse","Bare ansatte i myndighetene"],"a":0,"e":"Leksjonen sier at hvem som helst kan legge ut informasjon på internett."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#8","l":0,"q":"Hva skal opplæringen i etisk bevissthet utvikle hos elevene?","o":["Evnen til å foreta etiske vurderinger","Evnen til å huske informasjon raskere","Penere håndskrift","Raskere avgjørelser uten å tenke seg om"],"a":0,"e":"Leksjonen sier at opplæringen skal utvikle elevenes evne til å foreta etiske vurderinger."},{"id":"critical-thinking-and-digital-judgement-critical-thinking-and-ethical-awareness#9","l":0,"q":"Hva bidrar kritisk tenkning og etisk bevissthet til at elevene utvikler?","o":["God dømmekraft","Raskere lesehastighet","Bedre resultater på prøver","Sterkere personlige meninger"],"a":0,"e":"Leksjonen sier at kritisk tenkning og etisk bevissthet bidrar til at elevene utvikler god dømmekraft."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#0","l":1,"q":"Hvilket av disse er et eksempel på sosiale medier som nevnes i leksjonen?","o":["Instagram","LinkedIn","Telegram","Reddit"],"a":0,"e":"Leksjonen nevner TikTok, Facebook og Instagram som eksempler på sosiale medier."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#1","l":1,"q":"Hva sier leksjonen om de digitale sporene vi legger igjen på internett?","o":["De blir automatisk slettet etter én uke.","De blir lagret.","Bare offentlige etater har tilgang til dem.","De kan ikke brukes til å identifisere oss."],"a":1,"e":"Leksjonen sier at vi gjennom dagen legger igjen mange digitale spor, og at alle disse sporene blir lagret."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#2","l":1,"q":"Hvilken av disse nevnes i leksjonen som en måte å identifisere seg på internett?","o":["Stemmegjenkjenning","Ansiktsgjenkjenning","Øyeskanning","Håndgeometri"],"a":1,"e":"Leksjonen sier at vi identifiserer oss med BankID, passord, fingeravtrykk eller ansiktsgjenkjenning."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#3","l":1,"q":"Hva handler personvern om, ifølge leksjonen?","o":["Å beskytte datamaskiner mot virus","Retten til et privatliv og til å bestemme over egne personopplysninger","At staten kontrollerer tilgangen til internett","Krav om å dele opplysninger med myndighetene"],"a":1,"e":"Leksjonen sier at personvern handler om retten til et privatliv og til å bestemme over egne personopplysninger."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#4","l":1,"q":"Hva begrenser ytringsfriheten på internett, ifølge leksjonen?","o":["At selskapene bak sosiale medier vil være familievennlige","Personvernet og enkelte lovparagrafer","Internasjonale avtaler om sosiale medier","Statens regler for innholdet på nettsider"],"a":1,"e":"Leksjonen sier at ytringsfriheten begrenses av personvernet og enkelte lovparagrafer."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#5","l":1,"q":"Hva er et eksempel på god digital dømmekraft, ifølge leksjonen?","o":["At man unngår å skrive personlige meninger på sosiale medier","At man bare skriver ting man kunne sagt til noen ansikt til ansikt","At man aldri er uenig med andre på internett","At man skriver anonymt for å beskytte identiteten sin"],"a":1,"e":"Leksjonen sier at det er et kjennetegn på god digital dømmekraft å bare skrive kommentarer man like gjerne kunne sagt til noen ansikt til ansikt."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#6","l":1,"q":"Hvilket av disse er et eksempel på personopplysninger som nevnes i leksjonen?","o":["Favorittlaget i sport","Hva man liker å handle","Personnummer","Brukernavn på sosiale medier"],"a":2,"e":"Leksjonen sier at personopplysninger for eksempel er navn, adresse, telefonnummer, personnummer og etnisk opprinnelse."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#7","l":1,"q":"Hva beskytter den europeiske menneskerettighetskonvensjonen (EMK), ifølge leksjonen?","o":["Retten til å si hva som helst på internett uten følger","Statens rett til å få tilgang til personopplysninger","Retten til en privat sfære som man selv kontrollerer","Kravet om at folk må dele opplysninger med bedrifter"],"a":2,"e":"Leksjonen sier at prinsippet om at du har rett på en privat sfære som du selv kontrollerer, blant annet er forankret i EMK."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#8","l":1,"q":"Hva sier leksjonen om kommentarer fra anonyme brukere på internett?","o":["De er som regel mer konstruktive og vennlige.","De er oftere støtende og ulovlige.","De kan ikke meldes til myndighetene.","De følger strengere regler enn brukere som er kjent."],"a":1,"e":"Leksjonen sier at det særlig når man kan være anonym, skrives mye som både er støtende og ulovlig."},{"id":"critical-thinking-and-digital-judgement-social-media-and-digital-judgement#9","l":1,"q":"Hvordan er folks oppførsel på internett sammenlignet med når de møter andre ansikt til ansikt, ifølge leksjonen?","o":["Folk er mer forsiktige og respektfulle på internett.","Det ser ut til å være lettere å gå over streken på internett.","Det er ingen forskjell på oppførsel på internett og ellers.","Folk er mer ærlige på internett."],"a":1,"e":"Leksjonen sier at det kan se ut til å være lettere å gå over streken når man skriver på internett og ikke snakker direkte til noen."},{"id":"families-bringing-up-children#0","l":2,"q":"Hvem har hovedansvaret for å oppdra barna?","o":["Barnehagen og skolen","Foreldrene","Staten","Slektninger i storfamilien"],"a":1,"e":"Foreldrene har hovedansvaret for å oppdra barna sine, selv om barna også påvirkes av andre voksne i barnehage, skole og fritidsaktiviteter."},{"id":"families-bringing-up-children#1","l":2,"q":"Hva måtte barn ofte gjøre før, som de ikke må nå?","o":["Gå på skole mange timer hver dag","Jobbe for å bidra til familiens inntekter","Leke med andre barn","Lære å lese og skrive"],"a":1,"e":"Tidligere ble barn sett på som «små voksne», og de måtte ofte jobbe for å bidra til familiens inntekter."},{"id":"families-bringing-up-children#2","l":2,"q":"Ifølge leksjonen er barneoppdragelsen forskjellig:","o":["Bare innenfor ett land","I ulike familier, samfunn og kulturer","Bare mellom rike og fattige familier","Hovedsakelig etter barnets alder"],"a":1,"e":"Barneoppdragelsen kan være forskjellig i ulike familier, samfunn og kulturer."},{"id":"families-bringing-up-children#3","l":2,"q":"Hvordan ser man på barndommen i dag, ifølge leksjonen?","o":["Som en tid for arbeid og bidrag til økonomien","Som en tid for lek og læring","Som en tid for å forberede seg bare på fabrikkarbeid","Som lik voksenlivet"],"a":1,"e":"I dag er barndommen en tid for lek og læring, og det blir ikke stilt krav til barn på samme måte som før."},{"id":"families-bringing-up-children#4","l":2,"q":"Hva er ett av målene med barneoppdragelsen som nevnes i leksjonen?","o":["At barna skal begynne å jobbe så tidlig som mulig","At barna skal lære å være deltakere i samfunnet","At barna skal holdes borte fra andre familier","At barna skal velge yrke tidlig"],"a":1,"e":"Et av målene med barneoppdragelsen er at barna skal lære å være deltakere i samfunnet, få gode grunnleggende verdier og kunne leve et godt liv."},{"id":"families-bringing-up-children#5","l":2,"q":"Hvorfor legger foreldre stor vekt på et godt samarbeid med barnehagen og skolen?","o":["Fordi staten krever det i loven","Fordi de vil vite mye om barnas liv i den tida de ikke er sammen","Fordi barnehagene bestemmer alt i barneoppdragelsen","Fordi skolen er billigere enn omsorg hjemme"],"a":1,"e":"Foreldre ønsker å vite mye om barnas liv i den tida de ikke er sammen, og legger derfor stor vekt på et godt samarbeid med barnehagen og skolen."},{"id":"families-bringing-up-children#6","l":2,"q":"Hva sier leksjonen om at barn gjør det foreldrene ønsker?","o":["Barn gjør alltid nøyaktig det foreldrene vil","Barn hører aldri på foreldrene sine","Barn gjør ikke alltid som foreldrene ønsker","Barn adlyder bare foreldrene sine hjemme"],"a":2,"e":"Barn gjør ikke alltid som foreldrene ønsker, og derfor kan foreldrene noen ganger bli slitne, sinte og oppgitte."},{"id":"families-bringing-up-children#7","l":2,"q":"Hvilket av disse nevnes IKKE som en måte foreldre kan få hjelp på når barneoppdragelsen er vanskelig?","o":["Søke råd hos noen som kan mye om barneoppdragelse","Snakke med andre foreldre","Rådføre seg med lærere om metodene deres","Lese bøker om barneoppdragelse"],"a":2,"e":"Leksjonen nevner å søke råd hos noen som kan mye om saken, diskutere med andre foreldre, lese bøker og finne informasjon på internett, men ikke å rådføre seg med lærere."},{"id":"families-bringing-up-children#8","l":2,"q":"Ifølge leksjonen, hva synes de fleste foreldre er viktig å vite?","o":["Nøyaktig hvor mye penger barna bruker","Hvem vennene til barna og foreldrene deres er","Alle detaljer om barnas karakterer på skolen","Hvor barna er hvert minutt av døgnet"],"a":1,"e":"De fleste foreldre synes det er viktig å kjenne vennene til barna og deres foreldre."},{"id":"families-bringing-up-children#9","l":2,"q":"Hva er det godt for foreldre å gjøre når det gjelder vanskelige situasjoner?","o":["Vente til problemene oppstår før de tenker på dem","Tenke gjennom hvordan de kan opptre i problematiske situasjoner før de oppstår","Unngå å snakke med barna om problemer","Forvente at barneoppdragelse aldri blir vanskelig"],"a":1,"e":"Det er godt å ha tenkt gjennom hvordan man som foreldre kan opptre i problematiske situasjoner før de oppstår."},{"id":"families-children-and-young-peoples-rights#0","l":3,"q":"Hvem handler barneloven om?","o":["Barn og unge under 16 år","Barn og unge under 15 år","Barn og unge under 18 år","Barn og unge under 20 år"],"a":2,"e":"Barneloven gjelder for barn og unge under 18 år."},{"id":"families-children-and-young-peoples-rights#1","l":3,"q":"Hva skjer når et barn blir født i Norge?","o":["Foreldrene må melde seg til politiet","Det sendes en melding til Folkeregisteret","Skolen må få beskjed med en gang","Det må leveres en helseattest til myndighetene"],"a":1,"e":"Når et barn blir født, sendes det en melding til Folkeregisteret om hvem som er mor og far til barnet."},{"id":"families-children-and-young-peoples-rights#2","l":3,"q":"Hva står det i barneloven om vold i oppdragelsen?","o":["Det er lovlig hvis volden ikke er for hard","Det er forbudt","Det er lovlig under noen omstendigheter","Det er bare lovlig hvis barnet har oppført seg veldig dårlig"],"a":1,"e":"Barneloven forbyr bruk av vold i oppdragelsen."},{"id":"families-children-and-young-peoples-rights#3","l":3,"q":"Hvem har ansvar for å passe på at barna deltar i grunnskolen?","o":["Lærerne","Foreldrene","Barna selv","Kommunen"],"a":1,"e":"Foreldrene skal passe på at barna deltar i den obligatoriske grunnskoleopplæringen."},{"id":"families-children-and-young-peoples-rights#4","l":3,"q":"Når barnet har fylt hvilken alder, skal det ifølge barneloven legges stor vekt på hva barnet mener?","o":["7 år","10 år","12 år","15 år"],"a":2,"e":"Loven sier at når barnet har fylt 12 år, skal det legges stor vekt på hva det mener."},{"id":"families-children-and-young-peoples-rights#5","l":3,"q":"Når kan barn selv avgjøre spørsmål om sin egen utdanning?","o":["Når de har fylt 12 år","Når de har fylt 13 år","Når de har fylt 14 år","Når de har fylt 15 år"],"a":3,"e":"Et barn som har fylt 15 år, har selv rett til å avgjøre spørsmål om utdanning."},{"id":"families-children-and-young-peoples-rights#6","l":3,"q":"Hva er myndighetsalderen i Norge?","o":["16 år","17 år","18 år","21 år"],"a":2,"e":"Myndighetsalderen i Norge er 18 år, og da er man gammel nok til å inngå juridiske avtaler og ha kontroll over egne penger."},{"id":"families-children-and-young-peoples-rights#7","l":3,"q":"Hva må foreldrene ifølge barneloven sørge for at barna får?","o":["Bare mat og klær","Mat, klær og andre ting som er nødvendig for å ha et godt liv","Bare mat, bolig og utdanning","Bare tak over hodet og helsehjelp"],"a":1,"e":"Foreldrene må sørge for at barna får mat og klær og andre ting som er nødvendig for å ha et godt liv."},{"id":"families-children-and-young-peoples-rights#8","l":3,"q":"Hvis foreldrene bor hver for seg, hvem har barnet rett til å ha samvær med?","o":["Bare mor","Bare far","Begge foreldrene","Den av foreldrene som retten bestemmer"],"a":2,"e":"Barn har rett til å ha samvær med begge foreldrene, også om foreldrene bor hver for seg."},{"id":"families-children-and-young-peoples-rights#9","l":3,"q":"Når har barn rett til å si sin mening om personlige forhold som gjelder dem selv?","o":["Når de er 5 år","Når de er 7 år","Når de er 10 år","Når de er 12 år"],"a":1,"e":"Et barn som er sju år, har rett til å si sin mening før foreldrene tar avgjørelser om personlige forhold som gjelder barnet."},{"id":"families-living-in-two-cultures#0","l":4,"q":"Hva lærer vi i kulturen vi er født inn i, ifølge teksten?","o":["Hvordan vi skal kjøre bil","Hvordan vi skal leve sammen","Hvordan vi skal lage mat","Hvordan vi skal bruke penger"],"a":1,"e":"Teksten sier at vi i kulturen vi er født inn i, lærer hvordan vi skal leve sammen, hva som er riktig og galt, og hvordan vi ser på vår plass i verden."},{"id":"families-living-in-two-cultures#1","l":4,"q":"Hvor mange hovedgrupper kan vi dele kulturene inn i?","o":["Tre hovedgrupper","To hovedgrupper","Fire hovedgrupper","Fem hovedgrupper"],"a":1,"e":"Teksten sier at vi kan dele kulturene inn i to hovedgrupper."},{"id":"families-living-in-two-cultures#2","l":4,"q":"Hva kaller vi de to hovedgruppene av kulturer?","o":["Moderne kulturer og tradisjonelle kulturer","Jeg-kulturer og vi-kulturer","Østlige kulturer og vestlige kulturer","Rike kulturer og fattige kulturer"],"a":1,"e":"Teksten sier at vi kaller de to gruppene for jeg-kulturer og vi-kulturer."},{"id":"families-living-in-two-cultures#3","l":4,"q":"Hva er viktigst i en jeg-kultur?","o":["Familien som gruppe","Fellesskapet","Enkeltmennesket","Nasjonen"],"a":2,"e":"I en jeg-kultur er enkeltmennesket viktigst."},{"id":"families-living-in-two-cultures#4","l":4,"q":"Hvilke verdier er positive i vi-kulturer?","o":["Selvstendighet og likestilling","Lydighet, respekt og gode relasjoner","Personlig frihet og prestasjoner","Konkurranse og individuell suksess"],"a":1,"e":"I en vi-kultur er eksempler på positive verdier lydighet, respekt og gode relasjoner."},{"id":"families-living-in-two-cultures#5","l":4,"q":"Hva kan barn som vokser opp med to kulturer, av og til måtte forholde seg til?","o":["Ett sett regler for gutter og et annet sett for jenter","Ett sett regler hjemme og et annet sett ute","Ett sett regler om vinteren og et annet sett om sommeren","Ett sett regler på hverdager og et annet sett i helgene"],"a":1,"e":"Teksten sier at barn som vokser opp med to kulturer, av og til kan måtte forholde seg til ett sett regler hjemme og et annet sett ute."},{"id":"families-living-in-two-cultures#6","l":4,"q":"Hva er en positiv verdi i jeg-kulturer?","o":["Lydighet mot foreldrene","Likestilling","Respekt for hierarki","Avhengighet av familien"],"a":1,"e":"I en jeg-kultur er eksempler på positive verdier selvstendighet, likeverd og likestilling."},{"id":"families-living-in-two-cultures#7","l":4,"q":"Hva er viktigst i en vi-kultur?","o":["Individuell frihet","Personlig suksess","Gruppa","Økonomiske prestasjoner"],"a":2,"e":"I en vi-kultur er det gruppa som er viktigst."},{"id":"families-living-in-two-cultures#8","l":4,"q":"Barn som vokser opp med to kulturer, kan møte ulike meninger. Hva kan meningene handle om, ifølge teksten?","o":["Hva som er billig eller dyrt","Hva som er høflig eller riktig","Hva som er sunt eller usunt","Hva som er moderne eller gammeldags"],"a":1,"e":"Teksten sier at det for barn som vokser opp med to kulturer, kan være ulike meninger om hva som er høflig eller riktig."},{"id":"families-living-in-two-cultures#9","l":4,"q":"Hvem lærer barn om hva som er riktig og galt av?","o":["Fra fjernsyn og bøker","Bare fra lærerne sine","Fra foreldrene og fra samfunnet rundt seg","Bare fra familiemedlemmer"],"a":2,"e":"Barn lærer både av foreldrene og av samfunnet rundt seg, blant annet hva som er riktig og galt."},{"id":"families-marriage-and-family#0","l":5,"q":"Hvor mange prosent av parene som bor sammen i Norge, er gift?","o":["30 prosent","50 prosent","70 prosent","85 prosent"],"a":2,"e":"Ifølge leksjonen er sytti prosent av parene som bor sammen, gift."},{"id":"families-marriage-and-family#1","l":5,"q":"Hva er gjennomsnittsalderen for å gifte seg for første gang i Norge?","o":["18–25 år","25–30 år","30–40 år","40–50 år"],"a":2,"e":"Leksjonen sier at gjennomsnittsalderen for å gifte seg for første gang er mellom tretti og førti år, både for menn og kvinner."},{"id":"families-marriage-and-family#2","l":5,"q":"Omtrent hvor mange par gifter seg i Norge hvert år?","o":["Ca. 10 000","Ca. 15 000","Ca. 20 000","Ca. 25 000"],"a":2,"e":"Ifølge leksjonen gifter ca. tjue tusen par seg i Norge hvert år."},{"id":"families-marriage-and-family#3","l":5,"q":"Fra hvilket år har to av samme kjønn hatt rett til å gifte seg i Norge?","o":["2005","2009","2012","2015"],"a":1,"e":"Leksjonen sier at to av samme kjønn har hatt rett til å gifte seg i Norge siden 2009."},{"id":"families-marriage-and-family#4","l":5,"q":"Hvis et ektepar tar opp lån, hvem er ansvarlig for å betale det tilbake?","o":["Bare ektefellen som har lånet i sitt navn","Bare ektefellen som tjener mest","Begge ektefellene er ansvarlige","Bare ektefellen som har full jobb"],"a":2,"e":"Leksjonen sier at ektepar som tar opp lån, begge står ansvarlige for lånet."},{"id":"families-marriage-and-family#5","l":5,"q":"Hvor lenge må man være separert før man kan be om skilsmisse i Norge?","o":["6 måneder","1 år","2 år","3 år"],"a":1,"e":"Hovedregelen i leksjonen er at man må være separert i ett år før man kan be om skilsmisse."},{"id":"families-marriage-and-family#6","l":5,"q":"Hvor mange prosent av barna i Norge bor sammen med både mor og far?","o":["Ca. 50 prosent","Ca. 60 prosent","Ca. 75 prosent","Ca. 85 prosent"],"a":2,"e":"Ifølge leksjonen bor ca. syttifem prosent av alle barn sammen med både mor og far."},{"id":"families-marriage-and-family#7","l":5,"q":"Hva er minstealderen for å gifte seg i Norge?","o":["16 år","18 år","20 år","21 år"],"a":1,"e":"Leksjonen sier at en som gifter seg, må være over 18 år og gifte seg frivillig."},{"id":"families-marriage-and-family#8","l":5,"q":"Hvor mange prosent av dem som gifter seg i Norge, vil sannsynligvis skille seg senere?","o":["Ca. 20 prosent","Ca. 30 prosent","Ca. 40 prosent","Ca. 50 prosent"],"a":2,"e":"Leksjonen sier at ca. førti prosent av dem som gifter seg, sannsynligvis vil skille seg senere."},{"id":"families-marriage-and-family#9","l":5,"q":"Hvor mange barn får hver kvinne i Norge i gjennomsnitt?","o":["Ca. 1 barn","Ca. 1,4 barn","Ca. 2 barn","Ca. 2,5 barn"],"a":1,"e":"Leksjonen sier at kvinner i Norge får gjennomsnittlig omtrent 1,4 barn hver."},{"id":"families-the-child-welfare-service#0","l":6,"q":"Når trådte Norges første barnevernslov, vergerådsloven, i kraft?","o":["år 1900","år 1850","år 1950","år 2000"],"a":0,"e":"Den første loven, vergerådsloven, trådte i kraft i år 1900."},{"id":"families-the-child-welfare-service#1","l":6,"q":"Hvem har først og fremst ansvaret for omsorg for og oppdragelse av barn?","o":["Barnevernet","Skolene","Foreldrene","Kommunen"],"a":2,"e":"Leksjonen sier at omsorg for og oppdragelse av barn først og fremst er foreldrenes ansvar."},{"id":"families-the-child-welfare-service#2","l":6,"q":"Hvilke hjelpetiltak har barnevernet for familier?","o":["Gratis bolig til alle familier","Veiledning, avlastning og støttekontakt","Bare hjelp til å finne jobb","Bare militær opplæring"],"a":1,"e":"Barnevernet har ulike hjelpetiltak, for eksempel veiledning, avlastning og støttekontakt."},{"id":"families-the-child-welfare-service#3","l":6,"q":"Hva har de som jobber med barn, plikt til å gjøre hvis de har mistanke om vold i familien?","o":["Vente på flere bevis","Melde fra til barnevernet","Holde det hemmelig","Si fra til foreldrene først"],"a":1,"e":"Alle som jobber med barn, har plikt til å melde fra til barnevernet hvis de har mistanke om vold i familien."},{"id":"families-the-child-welfare-service#4","l":6,"q":"Hvilken rolle har Norge hatt i barnevernets historie?","o":["Norge hadde mest penger til barnevernet","Norge var det første landet som opprettet et offentlig barnevern","Norge hadde flest ansatte i barnevernet","Norge laget de strengeste lovene"],"a":1,"e":"Norge ble det første landet i verden som opprettet et offentlig barnevern for å hjelpe barn i sårbare livssituasjoner."},{"id":"families-the-child-welfare-service#5","l":6,"q":"Hvordan kan et barn kontakte barnevernet om natten?","o":["Besøke kontoret","Sende en e-post","Ringe 116 111","Skrive et brev"],"a":2,"e":"På kveld og natt kan barn eller andre som er bekymret for et barn, ringe alarmtelefonen for barn og unge på 116 111."},{"id":"families-the-child-welfare-service#6","l":6,"q":"Hva gjelder for dem som jobber i barnevernet?","o":["De har taushetsplikt","De snakker om sakene med venner","De kan fortelle om sakene til media","De deler dokumenter offentlig"],"a":0,"e":"Alle som jobber i barnevernet, har taushetsplikt."},{"id":"families-the-child-welfare-service#7","l":6,"q":"Hva kan barnevernet gjøre hvis et barn trenger beskyttelse mot foreldrene sine?","o":["Bare gi råd","Ikke gjøre noe","Finne en ny familie til barnet","Alltid arrestere foreldrene"],"a":2,"e":"Hvis det er nødvendig, kan barnevernet finne en ny familie til barn som trenger beskyttelse mot foreldrene sine."},{"id":"families-the-child-welfare-service#8","l":6,"q":"Hvor finnes det barnevernskontorer i Norge?","o":["Bare i hovedstaden","Bare i store byer","I alle kommuner","Bare i kystområder"],"a":2,"e":"Det er barnevernskontorer i alle norske kommuner."},{"id":"families-the-child-welfare-service#9","l":6,"q":"Hva er målet med barnevernet?","o":["Å straffe dårlige foreldre","Å sørge for at barn og unge får en trygg oppvekst","Å splitte familier","Å overvåke alle familier"],"a":1,"e":"Barnevernet skal sørge for at barn og unge får en trygg oppvekst."},{"id":"health-dental-health#0","l":7,"q":"Når slutter barn i Norge å bli kalt inn til gratis tannkontroll?","o":["16 år","18 år","19 år","21 år"],"a":2,"e":"Leksjonen sier at barn og unge blir kalt inn til jevnlige tannkontroller i den offentlige tannhelsetjenesten fram til de er 19 år gamle."},{"id":"health-dental-health#1","l":7,"q":"Hvilken av disse matvarene nevnes i leksjonen som inneholder sukker?","o":["Ris","Spinat","Sjokolade","Kylling"],"a":2,"e":"Leksjonen nevner sjokolade som en av tingene som inneholder sukker, sammen med kjeks, brus, saft, kaker og sukkertøy."},{"id":"health-dental-health#2","l":7,"q":"Når bør man pusse tennene, ifølge leksjonen?","o":["Etter hvert måltid","Bare før leggetid","Morgen og kveld","Tre ganger om dagen"],"a":2,"e":"Leksjonen sier at alle bør pusse tennene to ganger om dagen, morgen og kveld."},{"id":"health-dental-health#3","l":7,"q":"Hvor mye betaler unge voksne av kostnadene til tannlegebehandling i den offentlige tannhelsetjenesten?","o":["Ingenting","25 prosent","50 prosent","100 prosent"],"a":1,"e":"Leksjonen sier at unge voksne betaler 25 prosent av kostnadene, mens det offentlige betaler 75 prosent."},{"id":"health-dental-health#4","l":7,"q":"Hvem må selv oppsøke en privat tannlege i Norge?","o":["Barn under 19 år","Den offentlige tannhelsetjenesten","Voksne","Foreldrene deres"],"a":2,"e":"Leksjonen sier at voksne selv må oppsøke en privat tannlege."},{"id":"health-dental-health#5","l":7,"q":"Hvis et barn i Norge trenger tannregulering, hvem betaler egenandelen?","o":["Staten","Tannlegen","Foreldrene","Skolen"],"a":2,"e":"Leksjonen sier at foreldrene må betale en egenandel hvis et barn eller en ungdom trenger tannregulering."},{"id":"health-dental-health#6","l":7,"q":"Hvor ofte er det vanlig at voksne i Norge går til tannlegen på kontroll?","o":["Hver måned","Hver sjette måned","Én gang i året","Bare når de har problemer"],"a":2,"e":"Leksjonen sier at det er vanlig å gå til kontroll hos tannlegen én gang i året."},{"id":"health-dental-health#7","l":7,"q":"Hva kan skje hvis et barn har dårlige melketenner, ifølge leksjonen?","o":["Barnet mister alle de voksne tennene","De nye tennene til barnet blir også dårlige","Barnet må ha tannregulering","Barnet får gule tenner"],"a":1,"e":"Leksjonen sier at dårlige melketenner kan føre til at de nye tennene også blir dårlige."},{"id":"health-dental-health#8","l":7,"q":"Hvem har ansvaret for tannhelsen til barna i Norge?","o":["Skolen","Tannlegen","Foreldrene","Staten"],"a":2,"e":"Leksjonen sier tydelig at foreldrene har ansvaret for barnas tannhelse."},{"id":"health-dental-health#9","l":7,"q":"Hvorfor er det viktig å stelle tennene til barna fra de er små, ifølge leksjonen?","o":["For at det skal bli lettere å pusse tennene når de blir eldre","Fordi dårlige melketenner kan føre til at de nye tennene også blir dårlige","For å unngå alle tannproblemer for alltid","Fordi tannlegen krever det"],"a":1,"e":"Leksjonen sier at dårlige melketenner kan føre til at de nye tennene også blir dårlige, og at det derfor er viktig å stelle tennene fra barna er små."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#0","l":8,"q":"Hvorfor diskuterer politikere i Norge familieplanlegging, ifølge leksjonen?","o":["For å redusere folketallet i Norge","For å oppfordre par til å få flere barn","For å følge eksempelet til land med svært lavt fødselstall","For å la kvinner få barn uten at myndighetene blander seg inn"],"a":1,"e":"Leksjonen sier at politikerne i Norge diskuterer hvordan de kan oppfordre par til å få flere barn."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#1","l":8,"q":"Hvordan hindrer p-piller graviditet?","o":["Ved å gjøre livmoren mindre","Ved å hindre eggløsning","Ved å stoppe alle sædceller fra å komme inn","Ved å gjøre slimet i livmorhalsen tykkere"],"a":1,"e":"Leksjonen forklarer at p-piller inneholder hormoner som hindrer eggløsning."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#2","l":8,"q":"Hva er en p-stav?","o":["En hormonpille som tas hver dag","En liten plaststav som legges inn under huden og skiller ut gestagen","Et hjelpemiddel som settes inn i magen","En operasjon på eggledere"],"a":1,"e":"Leksjonen beskriver p-staven som en liten plaststav under huden som skiller ut hormonet gestagen."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#3","l":8,"q":"Hvordan hindrer en spiral graviditet?","o":["Den hindrer eggløsning, slik p-piller gjør","Den hindrer sædcellenes bevegelighet og gjør at et befruktet egg ikke fester seg til livmorveggen","Den lager en fysisk barriere mellom sædcellene og egget","Den gjør skjeden så sur at sædcellene ikke overlever"],"a":1,"e":"Leksjonen sier at spiralen hindrer sædcellenes bevegelighet og gjør at et eventuelt befruktet egg ikke fester seg til livmorveggen."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#4","l":8,"q":"Hva skiller kondom fra alle andre prevensjonsmidler?","o":["Det er det eneste som inneholder hormonene østrogen og gestagen","Det er det eneste som beskytter mot seksuelt overførbare sykdommer","Det er det eneste som må settes inn og fjernes av en lege","Det er det eneste som skiller ut en liten mengde hormon hver dag"],"a":1,"e":"Leksjonen sier at kondom er det eneste prevensjonsmiddelet som beskytter mot smitte av seksuelt overførbare sykdommer."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#5","l":8,"q":"Hvordan bør sæddrepende krem brukes, ifølge leksjonen?","o":["Alene som et fullstendig prevensjonsmiddel","Sammen med kondom for å øke sikkerheten mot uønsket graviditet","Sammen med p-piller i stedet for kondom","Sammen med p-stav for bedre beskyttelse"],"a":1,"e":"Leksjonen sier at det anbefales å bruke sæddrepende krem sammen med kondom for å øke sikkerheten mot uønsket graviditet, og at krem alene ikke er nok."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#6","l":8,"q":"Er svangerskapskontroll obligatorisk for gravide kvinner i Norge?","o":["Ja, alle gravide kvinner må gå på alle kontrollene","Nei, kontrollene er frivillige","Ja, men bare for kvinner som får sitt første barn","Ja, men bare hvis man mistenker komplikasjoner"],"a":1,"e":"Leksjonen sier at svangerskapskontrollene er frivillige."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#7","l":8,"q":"Hvor føder de fleste kvinner i Norge?","o":["Hjemme sammen med en jordmor","På en privat klinikk som koster penger","På sykehus","På en helsestasjon"],"a":2,"e":"Leksjonen sier at de fleste kvinner føder på sykehus, og at dette er gratis."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#8","l":8,"q":"Fra hvilken alder gir helsestasjonene i Norge helsekontroller til barn?","o":["Fra barnet er 5 år","Fra barnet er 3 år","Fra fødselen","Bare fra skolealder"],"a":2,"e":"Leksjonen sier at helsekontrollene foregår på helsestasjonen fra barna er babyer og fram til skolestart."},{"id":"health-family-planning-pregnancy-and-follow-up-of-children#9","l":8,"q":"Hva har kvinner rett til etter Abortloven i Norge hvis de bestemmer seg for abort?","o":["Bare medisinsk behandling uten informasjon","Rett til informasjon, veiledning og oppfølgingssamtaler","Bare retten til å få utført inngrepet","Ingenting, fordi avgjørelsen er helt privat"],"a":1,"e":"Leksjonen sier at kvinnen har rett til informasjon, veiledning og oppfølgingssamtaler."},{"id":"health-health-and-lifestyle#0","l":9,"q":"Hva døde mange av i Norge tidligere som følge av fattigdom, ifølge leksjonen?","o":["Underernæring og tuberkulose","Kreft og hjerte- og karsykdommer","Diabetes og fedme","Depresjon og angst"],"a":0,"e":"Leksjonen sier at mange tidligere døde av sykdommer som følge av fattigdom, for eksempel underernæring eller tuberkulose."},{"id":"health-health-and-lifestyle#1","l":9,"q":"Hvordan er levestandarden i Norge i dag?","o":["Lav","Høy","Gjennomsnittlig","Synkende"],"a":1,"e":"Leksjonen sier at levestandarden i Norge er høy i dag."},{"id":"health-health-and-lifestyle#2","l":9,"q":"Hva gjør at vi har større sjanse for å holde oss friske lenger, ifølge leksjonen?","o":["Å spise ofte og slappe av hjemme","Å spise sunt og være fysisk aktiv","Å sove mindre og jobbe mer","Å unngå all fysisk aktivitet"],"a":1,"e":"Leksjonen sier at vi har større sjanse for å holde oss friske lenger hvis vi spiser sunt og er fysisk aktive."},{"id":"health-health-and-lifestyle#3","l":9,"q":"Hva er de vanligste dødsårsakene i Norge i dag?","o":["Tuberkulose og underernæring","Astma og allergi","Kreft og hjerte- og karsykdommer","Fedme og diabetes"],"a":2,"e":"Leksjonen sier at hjerte- og karsykdommer sammen med kreft er den vanligste dødsårsaken i Norge."},{"id":"health-health-and-lifestyle#4","l":9,"q":"Hvordan beskriver leksjonen hvor viktig psykisk helse er?","o":["Psykisk helse er mindre viktig enn fysisk helse","Psykisk helse er bare viktig for personer med depresjon","Psykisk helse er like viktig som fysisk helse","Psykisk helse har ingen betydning for hvor lenge vi lever"],"a":2,"e":"Leksjonen sier at psykisk helse er like viktig som fysisk helse."},{"id":"health-health-and-lifestyle#5","l":9,"q":"Hvem har ansvar for å sikre god helse, ifølge leksjonen?","o":["Bare velferdssamfunnet","Bare den enkelte","Både velferdssamfunnet og den enkelte","Verken velferdssamfunnet eller den enkelte"],"a":2,"e":"Leksjonen sier at velferdssamfunnet tar på seg et stort ansvar for å sikre befolkningen god helse, men at det også er opp til den enkelte hvordan han eller hun lever livet sitt og passer på helsen."},{"id":"health-health-and-lifestyle#6","l":9,"q":"Ifølge leksjonen, hvilke helseproblemer ser helsearbeidere at flere innvandrere enn nordmenn har?","o":["Astma, allergi og tuberkulose","Kreft, astma og hjerte- og karsykdommer","Diabetes, fedme og dårlig tannhelse","Tuberkulose, kreft og allergi"],"a":2,"e":"Leksjonen sier at helsearbeidere ser at flere innvandrere enn nordmenn blant annet har diabetes, fedme, dårlig tannhelse, feilernæring (mangel på jern og vitamin D) og depresjoner."},{"id":"health-health-and-lifestyle#7","l":9,"q":"Hva får barn i Norge gratis, ifølge leksjonen?","o":["Gratis medisiner mot alle sykdommer","Gratis vaksiner mot flere sykdommer","Gratis sporttrening","Gratis tannbehandling"],"a":1,"e":"Leksjonen sier at barn får tilbud om gratis vaksiner mot flere sykdommer."},{"id":"health-health-and-lifestyle#8","l":9,"q":"Hvilke helseproblemer sier leksjonen er et økende problem i Norge?","o":["Tuberkulose og underernæring","Astma og allergi","Diabetes og fedme","Tuberkulose og allergi"],"a":2,"e":"Leksjonen sier at diabetes og fedme er et økende problem i Norge, mens tuberkulose og underernæring er sykdommer som mange tidligere døde av."},{"id":"health-health-and-lifestyle#9","l":9,"q":"Hva forlenger livet, ifølge et norsk ordtak i leksjonen?","o":["Å sove mye","Å jobbe hardt hver dag","En god latter","Å unngå stress og forandring"],"a":2,"e":"Leksjonen sier at vi i Norge sier at en god latter forlenger livet."},{"id":"health-health-services#0","l":10,"q":"Hva er et offentlig helsevesen i Norge?","o":["At staten tar ansvar for at innbyggerne får den behandlingen de trenger, uavhengig av personlig økonomi","At staten bare hjelper dem som ikke har råd til å betale for behandlingen selv","At alle må betale full pris for sin egen behandling","At private leger står for all helsehjelp i Norge"],"a":0,"e":"I et offentlig helsevesen tar staten ansvaret for at innbyggerne får den behandlingen de trenger, uavhengig av personlig økonomi."},{"id":"health-health-services#1","l":10,"q":"Hvor ofte kan du bytte fastlege?","o":["Én gang i året","To ganger i året","Tre ganger i året","Fire ganger i året"],"a":1,"e":"Du kan bytte fastlege hvis du ikke er fornøyd, men ikke oftere enn to ganger i året."},{"id":"health-health-services#2","l":10,"q":"Hva må du gjøre hvis du skal til en legespesialist?","o":["Ringe nødnummeret for å bestille time","Gå direkte til legespesialisten uten henvisning","Få henvisning fra fastlegen din","Be en ansatt på apoteket om å skaffe deg time hos legespesialisten"],"a":2,"e":"For å få time hos en legespesialist må man som hovedregel ha henvisning fra fastlegen."},{"id":"health-health-services#3","l":10,"q":"Hva er poliklinisk behandling ved et sykehus?","o":["Behandling der du ligger på sykehuset over natten","Behandling ved et sykehus uten at du er innlagt","Behandling som er gratis for alle pasienter","Behandling som bare legespesialister kan gi"],"a":1,"e":"Poliklinisk behandling betyr at du får behandling ved et sykehus, men at du ikke er innlagt der."},{"id":"health-health-services#4","l":10,"q":"Hva koster det å være innlagt på sykehus i Norge?","o":["Mellom 150 og 300 kroner","Pasienten betaler bare for behandling og mat","Det er gratis","500 kroner per dag"],"a":2,"e":"Det er gratis å ligge på offentlig sykehus, og det offentlige dekker alle kostnader til behandling, opphold og mat."},{"id":"health-health-services#5","l":10,"q":"Hvilket nødnummer må du ringe hvis noen blir alvorlig skadet og trenger øyeblikkelig hjelp?","o":["116 117","113","112","118"],"a":1,"e":"Hvis noen blir alvorlig syke eller skadet og trenger øyeblikkelig hjelp, må du ringe medisinsk nødnummer 113."},{"id":"health-health-services#6","l":10,"q":"Hvor kan du kjøpe milde smertestillende medisiner i Norge?","o":["Bare på apotek, med resept fra lege","Bare på sykehus, etter at du har vært hos lege","Bare hos fastlegen, etter at du har bestilt time","På apotek, i matbutikken eller på bensinstasjoner"],"a":3,"e":"Noen legemidler, for eksempel milde smertestillende medisiner, kan du også kjøpe i matbutikken eller på bensinstasjoner, ikke bare på apotek."},{"id":"health-health-services#7","l":10,"q":"Hvilke barn kan bestemme om foreldrene skal få innsyn i helseopplysninger?","o":["Barn over 12 år","Barn over 14 år","Barn over 16 år","Barn over 18 år"],"a":2,"e":"Barn over 16 år kan bestemme om foreldrene skal få innsyn i helseopplysninger."},{"id":"health-health-services#8","l":10,"q":"Må barn under 16 år betale egenandel?","o":["Ja, de betaler halv pris","Ja, de betaler full pris som voksne","Nei, de betaler ikke egenandel","De betaler bare hvis de går til en legespesialist"],"a":2,"e":"Barn under 16 år betaler ikke egenandel."},{"id":"health-health-services#9","l":10,"q":"Hva er et frikort i det norske helsevesenet?","o":["Et kort som gjør at du slipper å stå i kø for å få time","Et kort som betyr at du slipper å betale egenandel resten av kalenderåret","Et kort som gir gratis tilgang til private helsetjenester","Et kort som gjør at du kan gå til en hvilken som helst legespesialist uten henvisning"],"a":1,"e":"Når du har betalt en bestemt sum i egenandeler i løpet av et år, får du frikort og slipper å betale egenandeler resten av kalenderåret."},{"id":"health-identity#0","l":11,"q":"Ifølge leksjonen formes identiteten av våre egenskaper og personlighetstrekk. Hva spiller også inn?","o":["høyden vår, vekten vår og fargen på øynene våre","hvor vi bor, hvem vi omgås og interessene våre","blodtypen vår, genene våre og året vi ble født","stjernetegnet vårt, årstiden og dagen vi ble født"],"a":1,"e":"Leksjonen sier at sosiale faktorer som hvor vi bor, hvem vi omgås og interessene våre også spiller inn når identiteten formes."},{"id":"health-identity#1","l":11,"q":"Hvem man blir forelsket i og seksuelt tiltrukket av, forteller noe om ...","o":["kjønnsuttrykk","sosial status","seksuell identitet","personlighetstrekk"],"a":2,"e":"Leksjonen sier at hvem man blir forelsket i og seksuelt tiltrukket av, forteller noe om seksuell identitet."},{"id":"health-identity#2","l":11,"q":"Tradisjonelt har kjønnet vårt blitt bestemt ved fødselen ut fra ...","o":["personlig ønske","psykologiske tester","fysiologi","kulturelle oppfatninger"],"a":2,"e":"Leksjonen sier at fysiologi tradisjonelt har bestemt kjønnet vårt ved fødselen, gutt eller jente."},{"id":"health-identity#3","l":11,"q":"Hva har tradisjonelt forsterket oppfatningen av at kjønn er enten gutt eller jente?","o":["vitenskapelig forskning","tydelige kjønnsrollemønstre","læreplanen i skolen","relasjoner i familien"],"a":1,"e":"Leksjonen sier at tydelige kjønnsrollemønstre har forsterket at kjønn bestemmes ved fødselen som gutt eller jente."},{"id":"health-identity#4","l":11,"q":"Begrepet «kjønnsuttrykk» betyr ...","o":["hvordan man beskriver følelsene sine om kjønn","hvem man er tiltrukket av","hvordan man kler seg eller på andre måter understreker kjønn","det kjønnet man er født med"],"a":2,"e":"Leksjonen sier at hvordan man selv kler seg eller på andre måter understreker kjønn, kaller vi kjønnsuttrykk."},{"id":"health-identity#5","l":11,"q":"Ifølge leksjonen er det i dag større åpenhet for at ...","o":["alles kjønn skal defineres helt likt","alle skal ha den samme kjønnsidentiteten","denne todelingen ikke stemmer for alle","alle forestillinger om kjønn skal fjernes"],"a":2,"e":"Leksjonen sier at det i dag er større åpenhet for at todelingen i gutt og jente ikke stemmer for alle."},{"id":"health-identity#6","l":11,"q":"Leksjonen sier at noen vil definere seg som noe annet enn kjønnet de er født med, eller ...","o":["uten noe kjønn","som det motsatte kjønnet for alltid","midt mellom de to tradisjonelle kjønnene","som flere kjønn samtidig"],"a":2,"e":"Leksjonen sier at noen vil definere seg som noe annet enn kjønnet de er født med, eller midt mellom de to tradisjonelle kjønnene."},{"id":"health-identity#7","l":11,"q":"Hvilken påstand om seksuell legning støttes av leksjonen?","o":["Alle definerer seg som enten heteroseksuelle eller homoseksuelle.","Noen ønsker ikke å definere sin seksuelle legning som noe fast.","Seksuell legning er det samme som kjønnsidentitet.","Alle har den samme seksuelle legningen."],"a":1,"e":"Leksjonen sier at noen definerer seg som heteroseksuelle eller homoseksuelle, mens andre ikke ønsker å definere sin seksuelle legning som noe fast."},{"id":"health-identity#8","l":11,"q":"Ifølge leksjonen, hvilket av disse er et eksempel på en sosial faktor som påvirker identiteten?","o":["kroppshøyde","øyenfarge","interessene våre","arvestoffet vårt"],"a":2,"e":"Leksjonen nevner interessene våre som en sosial faktor som spiller inn på identiteten, sammen med hvor vi bor og hvem vi omgås."},{"id":"health-identity#9","l":11,"q":"Hvilken påstand beskriver identitet riktig, ut fra leksjonen?","o":["Identiteten bestemmes bare av seksuell legning.","Identiteten formes bare av egenskaper og personlighetstrekk, uten sosial påvirkning.","Identiteten formes av egenskaper og personlighetstrekk, og påvirkes av sosiale faktorer som hvem vi omgås.","Identiteten er den samme for alle mennesker."],"a":2,"e":"Leksjonen sier at identiteten formes av egenskaper og personlighetstrekk, og at sosiale faktorer som hvor vi bor, hvem vi omgås og interessene våre også spiller inn."},{"id":"health-mental-health#0","l":12,"q":"Hvorfor spør legen John om han føler seg trist og ensom, når John klager over vondt i magen?","o":["For å få John til å tenke på noe annet enn magen","Fordi psykisk og fysisk helse henger sammen","Fordi vondt i magen aldri er et ekte fysisk problem","Fordi John tidligere har sagt at han var deprimert"],"a":1,"e":"Legen har tatt alle mulige prøver og finner ikke noe galt med magen, så han spør hvordan John har det ellers."},{"id":"health-mental-health#1","l":12,"q":"Ifølge leksjonen, hva kan være årsaker til psykiske problemer?","o":["Bare at man er arvelig disponert","Vanskelige situasjoner, krigsopplevelser og stress","Bare fysiske sykdommer som vondt i magen","Bare feil mat og for lite trening"],"a":1,"e":"Leksjonen sier at psykiske lidelser kan komme av vanskelige situasjoner i livet, kriser, ulykker eller opplevelser i krigssituasjoner, og at stress kan være en utløsende faktor."},{"id":"health-mental-health#2","l":12,"q":"Hva forklarer leksjonen om psykologens taushetsplikt?","o":["Psykologen må fortelle familien din alt du snakker om","Psykologen må melde alle problemer til legen din","Psykologen kan ikke fortelle videre til andre det du har sagt","Psykologen fører journaler som andre leger kan lese"],"a":2,"e":"Legen sier at psykologen har taushetsplikt og ikke kan fortelle noe av det John sier, videre til andre."},{"id":"health-mental-health#3","l":12,"q":"Ifølge leksjonen, hvem kan ofte hjelpe oss med å finne løsninger på problemene våre når vi trenger profesjonell hjelp?","o":["En nabo eller en kollega","En advokat eller en bankrådgiver","En psykolog eller en annen fagperson","En lærer eller en helsesykepleier"],"a":2,"e":"Leksjonen sier at vi noen ganger trenger profesjonell hjelp, og at en psykolog eller andre fagpersoner ofte kan hjelpe oss med å finne løsninger på problemene våre."},{"id":"health-mental-health#4","l":12,"q":"Hva kan fastlegen gjøre for å hjelpe en som har psykiske problemer?","o":["Henvise personen til psykolog","Si at personen må løse problemene sine alene","Foreslå at personen slutter å snakke om det","Nekte å behandle psykiske problemer"],"a":0,"e":"Leksjonen sier at fastlegen kan gi henvisning til psykolog hvis vi trenger det."},{"id":"health-mental-health#5","l":12,"q":"Hvordan beskriver leksjonen nordmenns syn på psykisk helse i dag?","o":["De synes psykisk sykdom er skamfullt","De mener at psykiske helseproblemer ikke er ekte","De har en åpen og forståelsesfull holdning til psykisk sykdom","De tror at psykiske helseproblemer er sjeldne"],"a":2,"e":"Leksjonen sier at et flertall av Norges befolkning i dag har en åpen og forståelsesfull holdning til psykisk sykdom."},{"id":"health-mental-health#6","l":12,"q":"Ifølge leksjonen, hvordan bør mennesker med psykisk sykdom behandles i Norge?","o":["De bør få mindre hjelp enn mennesker med fysisk sykdom","De bør ikke få hjelp fra det offentlige","De bør behandles på lik linje med mennesker med fysisk sykdom","De bør bare få hjelp av familien"],"a":2,"e":"Leksjonen sier at folk flest mener at psykisk syke må få behandling og hjelp fra helsevesenet på lik linje med de som har fysiske lidelser."},{"id":"health-mental-health#7","l":12,"q":"Hva sier leksjonen om muligheten for å bli frisk av psykisk sykdom?","o":["Psykisk sykdom blir alltid verre over tid","Psykisk sykdom kan aldri bli bedre","De fleste i Norge har tro på at det er mulig å bli frisk av psykiske lidelser","Bare de som er arvelig disponert, kan bli friske"],"a":2,"e":"Leksjonen sier at man har tro på at det er mulig å bli frisk av psykiske lidelser."},{"id":"health-mental-health#8","l":12,"q":"Hvilke problemer fortalte John legen om da han kom tilbake noen uker senere?","o":["Vondt i ryggen, hodepine, feber og hoste","Tannpine, svimmelhet, sult og vekttap","Tretthet, sinne, dårlig søvn og mareritt","Vondt i halsen, øresmerter, utslett og hårtap"],"a":2,"e":"Ved det andre besøket sier John at han alltid er sliten, av og til blir sint uten grunn, sover dårlig og har mareritt om ting han opplevde i hjemlandet sitt."},{"id":"health-mental-health#9","l":12,"q":"Hvordan reagerte John først da legen foreslo psykolog?","o":["Han sa med en gang at det var en god idé","Han sa at det ikke var noe i veien med hodet hans","Han ba om å få snakke med en annen type lege","Han sa at han heller ville snakke med familien"],"a":1,"e":"Da legen foreslår psykolog, svarer John først «Psykolog? Det er ikke noe i veien med hodet mitt», og først etterpå sier han at han kan prøve."},{"id":"health-moving-to-a-new-country#0","l":13,"q":"Hva heter den psykiske prosessen som beskriver hvordan folk tilpasser seg når de flytter til et nytt land?","o":["Den kulturelle tilpasningssyklusen","Den psykiske migrasjonsprosessen","Det følelsesmessige integreringsstadiet","Tilpasningsperioden etter bosetting"],"a":1,"e":"Leksjonen kaller dette en «psykisk migrasjonsprosess i tre faser» og forklarer at mennesker som flytter til et nytt land ofte går gjennom den."},{"id":"health-moving-to-a-new-country#1","l":13,"q":"Hvordan er det vanlig å føle seg den første tiden, i fase 1 av den psykiske migrasjonsprosessen?","o":["Sliten og lei","Glad og optimistisk","Usikker og urolig","Sint og skuffet"],"a":1,"e":"Teksten sier at den første tiden er det vanlig å føle seg glad og optimistisk, mens det å føle seg usikker, sliten og lei hører til fase 2."},{"id":"health-moving-to-a-new-country#2","l":13,"q":"Ifølge leksjonen, hva sier Amaniel at de har mistet ved å flytte til Norge?","o":["Bare jobben og pengene","Bare familien og vennene","Familie, venner, tradisjoner og språk","Huset og tingene sine"],"a":2,"e":"Amaniel sier: «Vi har mistet så mye: familie, venner, tradisjoner og språk.»"},{"id":"health-moving-to-a-new-country#3","l":13,"q":"I fase 2, hva gjør at man føler seg usikker i det nye landet?","o":["Været og klimaet","Høye levekostnader og dyre boliger","Alt det fremmede i det nye landet","Dårlige skoler for barna"],"a":2,"e":"Leksjonen sier at alt det fremmede i det nye landet kan gjøre at man føler seg usikker i fase 2."},{"id":"health-moving-to-a-new-country#4","l":13,"q":"Hvor lenge varer den psykiske migrasjonsprosessen i tre faser vanligvis?","o":["Alltid nøyaktig ett år for alle","Det er forskjellig fra menneske til menneske","Omtrent to måneder for alle","Alltid mellom to og fem år"],"a":1,"e":"Leksjonen sier at hvor lenge de ulike fasene varer, er forskjellig fra menneske til menneske."},{"id":"health-moving-to-a-new-country#5","l":13,"q":"Hva kombinerer man i fase 3 for å finne sin plass i det nye samfunnet?","o":["Tradisjoner fra hjemlandet og populærkultur","Det positive og verdiene i det nye landet og verdier og tanker fra hjemlandet","Bare det nye språket og gamle skikker","Nye venner og gamle venner"],"a":1,"e":"Når man tar til seg det positive i det nye landet og kombinerer det med verdier og tanker fra hjemlandet, finner man sin plass i det nye samfunnet."},{"id":"health-moving-to-a-new-country#6","l":13,"q":"Hvordan har Sebene det med å ha flyttet til Norge?","o":["Hun er sliten og har hjemlengsel","Hun er forvirret og frustrert","Hun er glad og føler at framtiden er trygg","Hun er sint og vil reise"],"a":2,"e":"Sebene sier at hun er så glad for at de endelig er kommet til Norge, og at hun føler at framtiden er trygg nå."},{"id":"health-moving-to-a-new-country#7","l":13,"q":"I fase 1, hva tenker man mer på enn på det man har mistet?","o":["Vanskeligheter med det nye språket","De nye mulighetene man har fått","At man savner det gamle landet","Problemer med å finne jobb"],"a":1,"e":"I fase 1 tenker man kanskje mer på de nye mulighetene man har fått, og ikke så mye på det man har reist fra og mistet."},{"id":"health-moving-to-a-new-country#8","l":13,"q":"Hva klager Amaniel mest over ved å bo i det nye landet?","o":["Maten er dårlig og været er kaldt","Han har ikke jobb, forstår ikke språket og må ha hjelp til alt","Han savner sport og underholdning","Han har ingen familie i nærheten og skolene er dårlige"],"a":1,"e":"Amaniel sier: «Jeg har ikke jobb, jeg forstår ikke språket, og jeg må ha hjelp til alt.»"},{"id":"health-moving-to-a-new-country#9","l":13,"q":"Hvordan har synet på framtiden forandret seg i fase 3 sammenlignet med fase 2?","o":["Den ser mørkere og mer håpløs ut","Den er den samme som før flyttingen","Den ser lysere ut fordi livet blir lettere","Den forsvinner helt fra tankene"],"a":2,"e":"I fase 3 føles livet igjen lettere for de fleste, og framtiden ser lysere ut."},{"id":"history-norway-from-1814-to-1905#0","l":14,"q":"Hvorfor måtte den danske kongen gi Norge til Sverige i 1814?","o":["Frankrike tapte Napoleonskrigene, og Danmark-Norge sto på Frankrikes side","Den svenske hæren beseiret Danmark i en direkte krig","England krevde at Norge skulle gis til Sverige","Det norske folket stemte for å bli en del av Sverige"],"a":0,"e":"Danmark-Norge sto på Frankrikes side i Napoleonskrigene, og da Frankrike tapte, måtte den danske kongen gi fra seg Norge til Sverige, som hadde stått på Englands side."},{"id":"history-norway-from-1814-to-1905#1","l":14,"q":"Hvor mange mektige menn kom sammen på Eidsvoll i 1814?","o":["50","112","200","312"],"a":1,"e":"I 1814 kom 112 mektige menn sammen på Eidsvoll for blant annet å skrive en grunnlov for det selvstendige Norge."},{"id":"history-norway-from-1814-to-1905#2","l":14,"q":"Når ble Stortinget grunnlagt?","o":["1805","1810","1814","1820"],"a":2,"e":"Nasjonalforsamlingen, Stortinget, ble grunnlagt i 1814."},{"id":"history-norway-from-1814-to-1905#3","l":14,"q":"Hva var nasjonalromantikken?","o":["En militær bevegelse som ville forene de skandinaviske landene","En religiøs bevegelse som la vekt på tro på naturen","En retning innenfor kunst og kultur som pekte på nasjonale særtrekk","Et politisk parti som styrte Norge fra 1850 til 1900"],"a":2,"e":"Nasjonalromantikken vokste fram rundt midten av 1800-tallet som en ny retning innenfor kunst og kultur i Europa, der det var viktig å peke på nasjonale særtrekk."},{"id":"history-norway-from-1814-to-1905#4","l":14,"q":"Hvem lagde skriftspråket nynorsk?","o":["Karl Johan, kongen av Sverige og Norge","Ivar Aasen, en språkforsker","Prins Carl, den første selvstendige norske kongen","De 112 mennene som kom sammen på Eidsvoll"],"a":1,"e":"Språkforskeren Ivar Aasen reiste rundt i Norge og samlet språkeksempler fra de ulike dialektene, og av dem lagde han nynorsk."},{"id":"history-norway-from-1814-to-1905#5","l":14,"q":"Hvor mange prosent av befolkningen i Norge bodde i byene på slutten av 1800-tallet?","o":["femten prosent","tjuetre prosent","trettifem prosent","sytti prosent"],"a":2,"e":"Før 1850 bodde ca. femten prosent av befolkningen i byer, men på slutten av 1800-tallet bodde trettifem prosent i byene."},{"id":"history-norway-from-1814-to-1905#6","l":14,"q":"Hvorfor flyttet mange fra landsbygda til byene på 1800-tallet?","o":["De ville slippe det harde livet med jordbruk","Det ble startet opp fabrikker, og de ville ha arbeid","Myndighetene tvang dem til å flytte","Det hadde blitt for kaldt å bo på landsbygda"],"a":1,"e":"Det ble startet opp fabrikker i byene, og mange flyttet fra landsbygda til byene for å få arbeid."},{"id":"history-norway-from-1814-to-1905#7","l":14,"q":"Omtrent hvor mange nordmenn utvandret til Amerika mellom 1850 og 1920?","o":["to hundre tusen","fem hundre tusen","åtte hundre tusen","én million"],"a":2,"e":"Mellom 1850 og 1920 utvandret mer enn åtte hundre tusen nordmenn til Amerika."},{"id":"history-norway-from-1814-to-1905#8","l":14,"q":"Hvilken dato erklærte Stortinget at unionen med Sverige var oppløst?","o":["7. mai 1905","7. juni 1905","17. juni 1905","17. juli 1905"],"a":1,"e":"Stortinget erklærte 7. juni 1905 at den svenske kongen ikke lenger var Norges konge, og at unionen med Sverige var oppløst."},{"id":"history-norway-from-1814-to-1905#9","l":14,"q":"Hvem ble den første kongen i Norge etter at unionen med Sverige var oppløst?","o":["Karl Johan, en svensk prins","Den danske prins Carl, som tok navnet Haakon","En norsk adelsmann som folket valgte","Ivar Aasen, som ble valgt på grunn av sitt arbeid for kulturen"],"a":1,"e":"Den danske prins Carl ble valgt som ny konge i Norge, tok det norske kongenavnet Haakon og var konge fra 1905 til han døde i 1957."},{"id":"history-present-day-norway#0","l":15,"q":"Hvilke verdier er de viktigste i det norske samfunnet i dag, ifølge leksjonen?","o":["Likeverd og friheten til å bestemme over sitt eget liv","Hardt arbeid og religiøs tro","Rikdom og militær styrke","Personlig suksess og konkurranse"],"a":0,"e":"Leksjonen sier at noen av de viktigste verdiene i det norske samfunnet i dag er likeverd og friheten til å bestemme over sitt eget liv."},{"id":"history-present-day-norway#1","l":15,"q":"Når ble arbeiderbevegelsen i Norge mer organisert?","o":["Fra 1850-årene","Fra 1880-årene","Fra 1950-årene","Fra 1970-årene"],"a":1,"e":"Leksjonen sier at arbeiderbevegelsen ble mer organisert fra 1880-årene da det ble skapt flere industriarbeidsplasser."},{"id":"history-present-day-norway#2","l":15,"q":"Hva er et resultat av arbeiderbevegelsens kamp?","o":["Rett for arbeiderne til å eie fabrikkene","Gratis bolig til alle arbeidere","Kortere arbeidsdag","Rett til lønn hele livet"],"a":2,"e":"Leksjonen sier at arbeiderbevegelsen har kjempet fram blant annet kortere arbeidsdag, bedre sikkerhetsforhold, sykeforsikringer og økonomisk støtte ved arbeidsledighet."},{"id":"history-present-day-norway#3","l":15,"q":"Hvilket år fikk kvinner i Norge stemmerett?","o":["1890","1913","1950","1976"],"a":1,"e":"Leksjonen sier at kvinner i Norge allerede i 1913 fikk stemmerett."},{"id":"history-present-day-norway#4","l":15,"q":"Hva ga abortloven fra 1976 kvinner rett til?","o":["Å eie eiendom uavhengig av ektemannen","Å jobbe i alle yrker uten tillatelse","Å bestemme selv om de vil ta abort","Å stemme ved alle valg"],"a":2,"e":"Leksjonen sier at loven fra 1976 blant annet ga kvinnen rett til selvbestemt abort."},{"id":"history-present-day-norway#5","l":15,"q":"Hvor langt ut i svangerskapet har kvinner rett til abort etter den nye abortloven fra 2025?","o":["Før uke 11","Før uke 15","Før uke 19","Før uke 24"],"a":2,"e":"Leksjonen sier at den nye abortloven i 2025 gir rett til abort før uke 19 i svangerskapet."},{"id":"history-present-day-norway#6","l":15,"q":"Når ble det første gang funnet olje i Nordsjøen?","o":["1960","1967","1975","1980"],"a":1,"e":"Leksjonen sier at det ble funnet olje i Nordsjøen første gang i 1967."},{"id":"history-present-day-norway#7","l":15,"q":"Hvem eier oljeressursene i Norge, ifølge leksjonen?","o":["Private oljeselskaper","Det offentlige (staten)","Utenlandske investorer","Fagforeningene til oljearbeiderne"],"a":1,"e":"Leksjonen sier at oljeressursene ble beholdt i offentlig eie, og at private selskaper bare fikk kjøpe rettigheter til å lete etter, bore og utvinne olje i begrensede områder og tidsrom."},{"id":"history-present-day-norway#8","l":15,"q":"Omtrent hvor stor andel av norske arbeidstakere er organisert i en fagforening i dag?","o":["Rundt 25 prosent","Rundt 50 prosent","Rundt 75 prosent","Rundt 90 prosent"],"a":1,"e":"Leksjonen sier at rundt halvparten av alle arbeidstakere i dag er organisert i en fagforening, altså rundt 50 prosent."},{"id":"history-present-day-norway#9","l":15,"q":"Hvor stor andel av befolkningen i Norge bor i byer og tettsteder i dag, ifølge leksjonen?","o":["Rundt 35 prosent","Rundt 50 prosent","Rundt 80 prosent","Rundt 95 prosent"],"a":2,"e":"Leksjonen sier at rundt 80 prosent av befolkningen i dag bor i byer og tettsteder."},{"id":"history-the-first-norwegians#0","l":16,"q":"Når kom de første menneskene til Norge?","o":["For rundt 20 000 år siden","For rundt 12 000 år siden","For rundt 5 000 år siden","For rundt 2 000 år siden"],"a":1,"e":"Leksjonen sier at de første menneskene kom til Norge for rundt tolv tusen år siden."},{"id":"history-the-first-norwegians#1","l":16,"q":"Hvordan kom de første menneskene til Norge?","o":["Over isen","Med båt fra fastlandet i Europa","De fulgte flokker med dyr som vandret","Gjennom en landkorridor fra øst"],"a":0,"e":"Om vinteren lå det is mellom fastlandet sør i Europa og norskekysten, og man tror at både mennesker og dyr kom til Norge over isen."},{"id":"history-the-first-norwegians#2","l":16,"q":"Hvilken periode varte fra 1800 f.Kr. til 500 f.Kr.?","o":["Steinalderen","Bronsealderen","Jernalderen","Vikingtiden"],"a":1,"e":"Leksjonen oppgir at bronsealderen varte fra 1800 f.Kr. til 500 f.Kr."},{"id":"history-the-first-norwegians#3","l":16,"q":"Hva lærte kvinnene å gjøre i bronsealderen?","o":["Hente jernmalm fra myrene","Spinne garn og veve tøy av ulla til sauen","Lage våpen av bronse","Reise som handelsfolk til andre land"],"a":1,"e":"Leksjonen sier at kvinnene i bronsealderen lærte å spinne garn og veve tøy fra ulla til sauen."},{"id":"history-the-first-norwegians#4","l":16,"q":"I hvilken periode var klimaet i Norge mildere enn i dag?","o":["Steinalderen","Bronsealderen","Jernalderen","Vikingtiden"],"a":1,"e":"Leksjonen sier at klimaet i bronsealderen var mildere enn klimaet i Norge i dag."},{"id":"history-the-first-norwegians#5","l":16,"q":"Hvordan laget menneskene redskapene sine i jernalderen?","o":["Av stein og bein fra skogen","Av bronse som de fikk gjennom handel med andre land","Av smeltet jernmalm som de fant i myrene","Av materialer som vikingene tok med fra andre land"],"a":2,"e":"Leksjonen forteller at menneskene i Norge lærte å lage jern av smeltet jernmalm fra myrene og brukte jernet til redskap og våpen."},{"id":"history-the-first-norwegians#6","l":16,"q":"I hvilket år ble Harald Hårfagre konge over hele Norge?","o":["I år 800","I år 872","I år 1030","I år 1050"],"a":1,"e":"Leksjonen sier at vikingen Harald Hårfagre ble konge over hele Norge i år 872."},{"id":"history-the-first-norwegians#7","l":16,"q":"Hva var religionen til vikingene knyttet til?","o":["Kristen lære som de tok med hjem fra Europa","Havånder som styrte vinden og været på sjøen","Norrøne guder som kunne hjelpe med god avling","Jernredskapene de brukte i arbeidet hver dag"],"a":2,"e":"Leksjonen sier at vikingenes religion var knyttet til fortellinger om de norrøne gudene og hvordan de kunne hjelpe til med god avling, fruktbarhet og krigføring."},{"id":"history-the-first-norwegians#8","l":16,"q":"I hvilket år sto slaget på Stiklestad?","o":["I år 1000","I år 1010","I år 1030","I år 1050"],"a":2,"e":"Leksjonen sier at 1030 er et viktig år i norsk historie, fordi det da sto et slag på Stiklestad."},{"id":"history-the-first-norwegians#9","l":16,"q":"Hvem var Olav Haraldsson i slaget på Stiklestad?","o":["En mektig høvding som forsvarte den gamle norrøne religionen","En handelsmann blant vikingene som kom fra fastlandet i Europa","En kristen mann som kriget mot dem som trodde på den gamle vikingreligionen","En arbeider med bronse og jern som leverte våpen til begge sider"],"a":2,"e":"Leksjonen forteller at den kristne Olav Haraldsson kriget mot mektige høvdinger som trodde på den gamle vikingreligionen."},{"id":"history-the-middle-ages-and-the-unions#0","l":17,"q":"Når ble kristendommen mer utbredt blant de mektige bøndene og høvdingene i Norge?","o":["Etter at Olav Haraldsson ble drept i 1030 og sønnen fikk hjelp av kirken til å gjøre ham til en helgen","I vikingtiden før år 1000","Etter at Norge kom i union med Danmark og Sverige i 1397","Først etter at Martin Luther begynte det religiøse opprøret"],"a":0,"e":"Etter at Olav Haraldsson ble drept i 1030, fikk sønnen hans hjelp av kirken til å gjøre faren til en helgen, og etter hvert ble flere av de mektige bøndene og høvdingene kristne."},{"id":"history-the-middle-ages-and-the-unions#1","l":17,"q":"Omtrent hvor mange mennesker bodde det i Norge rundt år 1300?","o":["150 000","250 000","400 000","500 000"],"a":2,"e":"Leksjonen sier at folketallet i Norge steg fra 150 000 til omtrent 400 000 i årene mellom 1000 og 1300."},{"id":"history-the-middle-ages-and-the-unions#2","l":17,"q":"Hvor mange mennesker regner man med at døde av svartedauden på verdensbasis?","o":["Mellom 10 og 30 millioner","Mellom 30 og 60 millioner","Mellom 75 og 200 millioner","Mellom 200 og 400 millioner"],"a":2,"e":"Leksjonen sier at man på verdensbasis regner med at mellom 75 millioner og 200 millioner mennesker døde i pandemien."},{"id":"history-the-middle-ages-and-the-unions#3","l":17,"q":"Hva slags tegn fikk menneskene som ble smittet av svartedauden, på kroppen?","o":["Røde utslett over hele kroppen","Lilla blåmerker og kraftig blødning","Store, blåsvarte byller på kroppen","Hovne hender og føtter"],"a":2,"e":"Pandemien ble kalt svartedauden fordi de som ble smittet, fikk store, blåsvarte byller på kroppen."},{"id":"history-the-middle-ages-and-the-unions#4","l":17,"q":"Hvilken av disse byene er IKKE nevnt som en av de første byene i Norge i middelalderen?","o":["Bergen","Trondheim","Stavanger","Lillehammer"],"a":3,"e":"Leksjonen nevner Bergen (Bjørgvin), Trondheim (Nidaros), Oslo, Stavanger og Tønsberg, men ikke Lillehammer."},{"id":"history-the-middle-ages-and-the-unions#5","l":17,"q":"Hva skjedde med bøndene i middelalderen som ikke greide å betale skatten?","o":["De måtte jobbe som tjenere for kongen","De måtte bli med i kirken","De måtte gi fra seg jord","De ble sendt for å jobbe i byene"],"a":2,"e":"Leksjonen sier at de som ikke greide å betale skatten, måtte gi fra seg jord."},{"id":"history-the-middle-ages-and-the-unions#6","l":17,"q":"I hvilket år kom Norge i union med Danmark og Sverige?","o":["1300","1350","1397","1450"],"a":2,"e":"Leksjonen sier at Norge fra 1397 var i union med Danmark og Sverige."},{"id":"history-the-middle-ages-and-the-unions#7","l":17,"q":"Hvor lenge varte unionen mellom Danmark og Norge?","o":["Omtrent 200 år","Omtrent 300 år","Omtrent 400 år","Helt til 1945"],"a":2,"e":"Leksjonen sier at unionen mellom Danmark og Norge varte helt til 1814, og den begynte i 1397, altså omtrent 400 år."},{"id":"history-the-middle-ages-and-the-unions#8","l":17,"q":"Hvilken makt protesterte den tyske munken Martin Luther mot fra 1517?","o":["Kongens makt over kirken","Makten til den katolske kirken","Adelen og kontrollen deres over skatter","Det danske kongedømmets styre over Norge"],"a":1,"e":"I 1517 begynte et religiøst opprør da den tyske munken Martin Luther protesterte mot makten til den katolske kirken."},{"id":"history-the-middle-ages-and-the-unions#9","l":17,"q":"I hvilket år sluttet protestantismen å være statsreligion i Norge?","o":["1814","1905","2000","2012"],"a":3,"e":"Protestantismen var statsreligion i Norge helt fram til statskirkeordningen ble avviklet i 2012."},{"id":"history-world-war-i-and-world-war-ii#0","l":18,"q":"Hvilket år ble Norge et selvstendig land igjen?","o":["1898","1905","1913","1914"],"a":1,"e":"Teksten sier at Norge i 1905 igjen ble et selvstendig land."},{"id":"history-world-war-i-and-world-war-ii#1","l":18,"q":"Hvilken rettighet fikk menn over 25 år i Norge i 1898?","o":["Retten til å jobbe åtte timer om dagen","Retten til å stemme ved stortingsvalg","Retten til syketrygd","Retten til å bruke elektrisitet"],"a":1,"e":"Teksten sier at menn over 25 år hadde stemmerett ved stortingsvalg fra 1898."},{"id":"history-world-war-i-and-world-war-ii#2","l":18,"q":"Hvilket transportmiddel fikk noen norske byer tidlig på 1900-tallet?","o":["T-bane under bakken","Elektrisk trikk","Høyhastighetstog","Busser med motor"],"a":1,"e":"Teksten sier at noen byer fikk elektrisk trikk."},{"id":"history-world-war-i-and-world-war-ii#3","l":18,"q":"Ifølge en egen lov, hvem skulle bygge ut vannkraften i Norge?","o":["Bare staten","Bare store selskaper","Private","Utenlandske investorer"],"a":2,"e":"En egen lov sørget for at vannkraften ble bygd ut av private, mens selve vannkraftressursen fortsatt ble eid av det offentlige."},{"id":"history-world-war-i-and-world-war-ii#4","l":18,"q":"Hvilke varer ble rasjonert i Norge under den første verdenskrigen?","o":["Kull, stål og tømmer","Korn, kaffe og sukker","Mel, smør og ost","Olje, gass og kull"],"a":1,"e":"Teksten sier at det under krigen ble innført rasjonering på varer som korn, kaffe og sukker."},{"id":"history-world-war-i-and-world-war-ii#5","l":18,"q":"Hva kjennetegnet økonomien i Norge i mellomkrigstiden?","o":["Rask økonomisk vekst og industrialisering","Økonomisk krise og mange arbeidsledige","Full uavhengighet fra europeisk handel","Bygging av nye militære styrker"],"a":1,"e":"Teksten sier at det var økonomisk krise i Norge i nesten hele mellomkrigstiden, og at mange var arbeidsledige."},{"id":"history-world-war-i-and-world-war-ii#6","l":18,"q":"Når ble Norge okkupert av tyske tropper?","o":["1. september 1939","9. april 1940","8. mai 1945","9. desember 1939"],"a":1,"e":"Teksten sier at Norge ble okkupert av tyske tropper 9. april 1940."},{"id":"history-world-war-i-and-world-war-ii#7","l":18,"q":"Hvem ledet den tyskvennlige regjeringen som styrte Norge under den andre verdenskrigen?","o":["Kong Haakon VII","Edvard Munch","Vidkun Quisling","Einar Gerhardsen"],"a":2,"e":"Teksten sier at Norge ble styrt av en tyskvennlig regjering ledet av Vidkun Quisling."},{"id":"history-world-war-i-and-world-war-ii#8","l":18,"q":"Omtrent hvor mange nordmenn flyktet til Sverige under den andre verdenskrigen?","o":["Rundt ti tusen","Rundt tretti tusen","Rundt femti tusen","Rundt hundre tusen"],"a":2,"e":"Teksten sier at rundt femti tusen nordmenn flyktet til Sverige i løpet av krigen."},{"id":"history-world-war-i-and-world-war-ii#9","l":18,"q":"Hvor mange norske jøder overlevde og kom tilbake til Norge etter at de var sendt til konsentrasjonsleirer?","o":["38","103","773","1000"],"a":0,"e":"Teksten sier at 773 ble sendt til konsentrasjonsleirer, og at bare 38 av dem overlevde og kom tilbake til Norge etter krigen."},{"id":"human-rights-and-democracy-democracy-in-norway#0","l":19,"q":"Hvor mange fylker er det i Norge?","o":["14","15","16","20"],"a":1,"e":"I leksjonen står det at det er 15 fylker og 357 kommuner i Norge (01.01.2025)."},{"id":"human-rights-and-democracy-democracy-in-norway#1","l":19,"q":"Hvilket av alternativene er et ansvarsområde for staten?","o":["Renovasjon","Fylkesveier","Videregående opplæring","Utenrikspolitikk"],"a":3,"e":"Utenrikspolitikk er et av statens ansvarsområder, mens de andre alternativene hører til fylkeskommunene eller kommunene."},{"id":"human-rights-and-democracy-democracy-in-norway#2","l":19,"q":"Hvilket område er fylkeskommunens ansvar?","o":["Barnehager","Eldreomsorg","Videregående opplæring","Grunnskoler"],"a":2,"e":"Videregående opplæring er et av fylkeskommunens ansvarsområder, mens de andre alternativene er kommunens ansvar."},{"id":"human-rights-and-democracy-democracy-in-norway#3","l":19,"q":"Hvor mange representanter sitter på Stortinget?","o":["150","157","169","176"],"a":2,"e":"I leksjonen står det at det sitter 169 representanter på Stortinget, som velges av folket for fire år om gangen."},{"id":"human-rights-and-democracy-democracy-in-norway#4","l":19,"q":"Hvor lenge velges stortingsrepresentantene for?","o":["To år","Tre år","Fire år","Fem år"],"a":2,"e":"Ifølge leksjonen velges stortingsrepresentantene av folket for fire år om gangen."},{"id":"human-rights-and-democracy-democracy-in-norway#5","l":19,"q":"Hvilken av disse er en av Stortingets viktigste oppgaver?","o":["Å gjennomføre lovene i praksis","Å vedta statsbudsjettet","Å ha ansvar for fylkesveier","Å drive barnehager"],"a":1,"e":"Å vedta statsbudsjettet er en av Stortingets viktigste oppgaver ifølge leksjonen."},{"id":"human-rights-and-democracy-democracy-in-norway#6","l":19,"q":"Kan publikum være til stede i Stortinget og høre politikerne diskutere?","o":["Nei, Stortinget er stengt for publikum","Ja, alle som vil, kan være til stede","Bare medlemmer av politiske partier kan være til stede","Bare under stortingsvalg"],"a":1,"e":"I leksjonen står det at alle som vil, kan være til stede i Stortinget og høre politikerne diskutere ulike saker."},{"id":"human-rights-and-democracy-democracy-in-norway#7","l":19,"q":"Hvor ofte har regjeringen et statsråd med kongen?","o":["Hver mandag","Hver onsdag","Hver fredag","Hver søndag"],"a":2,"e":"Leksjonen sier at regjeringen har et møte med kongen hver fredag, og disse møtene kalles statsråd."},{"id":"human-rights-and-democracy-democracy-in-norway#8","l":19,"q":"Hvor mange uavhengige myndigheter deler maktfordelingsprinsippet makten mellom i Norge?","o":["To","Tre","Fire","Fem"],"a":1,"e":"Maktfordelingsprinsippet deler makten mellom tre uavhengige myndigheter: Stortinget, regjeringen og domstolene."},{"id":"human-rights-and-democracy-democracy-in-norway#9","l":19,"q":"Hvordan er forholdet mellom regjeringen og Stortinget når det gjelder nye lover?","o":["Regjeringen vedtar lovene, og Stortinget gjennomfører dem","Regjeringen foreslår lover, og Stortinget vedtar dem","Stortinget foreslår lover, og regjeringen vedtar dem","Begge foreslår og vedtar lover like mye"],"a":1,"e":"Regjeringen foreslår nye lover og lovendringer, men Stortinget vedtar lovene og lovendringene."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#0","l":20,"q":"Når ble FNs menneskerettighetserklæring vedtatt?","o":["1945","1948","1950","1952"],"a":1,"e":"I leksjonen står det at FNs menneskerettighetserklæring ble vedtatt i 1948."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#1","l":20,"q":"Hva er stemmerettsalderen i Norge?","o":["16 år","18 år","20 år","21 år"],"a":1,"e":"I leksjonen står det at stemmerettsalderen i Norge i dag er 18 år."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#2","l":20,"q":"Hva av dette er IKKE lov i Norge når det gjelder ytringsfrihet?","o":["Å kritisere politikken til styresmaktene","Å diskutere religion","Å komme med rasistiske ytringer","Å si sine politiske meninger"],"a":2,"e":"I leksjonen står det at det ikke er lov å komme med rasistiske og andre hatefulle ytringer, verken muntlig eller skriftlig."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#3","l":20,"q":"Hva betyr rettssikkerhet når det gjelder fengsel?","o":["Hvem som helst kan settes i fengsel hvis styresmaktene bestemmer det","Ingen kan dømmes til fengsel uten at det har vært en rettssak først","Bare rike mennesker trenger en rettssak før de dømmes til fengsel","Det er ikke nødvendig med rettssak ved alvorlige forbrytelser"],"a":1,"e":"I leksjonen står det at rettssikkerhet blant annet betyr at ingen kan dømmes til fengsel uten at det har vært en rettssak først."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#4","l":20,"q":"Fra hvilken alder kan man melde seg inn i eller ut av en menighet eller et livssynssamfunn på egen hånd i Norge?","o":["10 år","13 år","15 år","18 år"],"a":2,"e":"I leksjonen står det at man fra man er 15 år har rett til å melde seg inn i eller ut av menigheter eller livssynssamfunn på egen hånd."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#5","l":20,"q":"Hvem har lov til å stemme ved stortingsvalg i Norge?","o":["Personer som har bodd i Norge i minst 6 måneder","Norske statsborgere som er minst 18 år","Alle innbyggere i Norge som er minst 16 år","Personer som har bodd i Norge de siste 3 årene"],"a":1,"e":"I leksjonen står det at du må være norsk statsborger for å stemme ved stortingsvalg, og at stemmerettsalderen i Norge er 18 år."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#6","l":20,"q":"Hva av dette beskrives i leksjonen som en trussel mot demokratiet?","o":["Høy valgdeltakelse","Sterk tillit til politikerne","Falske nyheter og hatprat","Uavhengige dommere"],"a":2,"e":"I leksjonen står det at falske nyheter og hatprat som stanser den åpne samfunnsdebatten, kan være en trussel mot demokratiet."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#7","l":20,"q":"Hva av dette er et eksempel på organisasjonsfrihet?","o":["Muligheten til å reise til hvilket som helst land","Retten til å delta i lovlige demonstrasjoner","Retten til å se på tv uten begrensninger","Retten til å jobbe uten kontrakt"],"a":1,"e":"I leksjonen står det at organisasjonsfrihet blant annet betyr at man har rett til å uttrykke sine meninger gjennom lovlige demonstrasjoner."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#8","l":20,"q":"Hvilket prinsipp sørger for at alle har like rettigheter og muligheter uavhengig av alder, etnisitet eller kjønn?","o":["Privat rikdom","Godkjenning fra styresmaktene","Likestilling","Familiestatus"],"a":2,"e":"I leksjonen står det under «Likestilling» at alle mennesker skal ha like rettigheter og muligheter uavhengig av alder, etnisitet, funksjonsevne, kjønn, religion og seksuell orientering."},{"id":"human-rights-and-democracy-democratic-rights-and-duties#9","l":20,"q":"Hva er det norske samfunnet i stor grad basert på, ifølge leksjonen?","o":["Streng kontroll fra styresmaktene","Konkurranse mellom enkeltpersoner","Gjensidig tillit","Begrensede rettigheter for innbyggerne"],"a":2,"e":"I leksjonen står det at det norske samfunnet i stor grad er basert på gjensidig tillit, der styresmaktene stoler på innbyggerne og innbyggerne stoler på at de får riktig behandling."},{"id":"human-rights-and-democracy-elections-and-political-parties#0","l":21,"q":"Hvor ofte er det politiske valg i Norge?","o":["Hvert år","Annethvert år","Hvert tredje år","Hvert fjerde år"],"a":1,"e":"Det er politiske valg i Norge annethvert år, og det veksler mellom stortingsvalg og lokalvalg."},{"id":"human-rights-and-democracy-elections-and-political-parties#1","l":21,"q":"Hva betyr det at vi har hemmelige valg i Norge?","o":["At man ved lov må holde det hemmelig hvem man har stemt på","At man ikke trenger å fortelle andre hvilket parti man stemmer på","At det er ulovlig å stemme offentlig","At bare noen få mennesker kan få vite hva man har stemt"],"a":1,"e":"Hemmelige valg betyr at vi ikke behøver å fortelle andre hvilket parti vi stemmer på."},{"id":"human-rights-and-democracy-elections-and-political-parties#2","l":21,"q":"Hva er stemmerettsalderen i Norge?","o":["16 år","17 år","18 år","21 år"],"a":2,"e":"Stemmerettsalderen i Norge er 18 år."},{"id":"human-rights-and-democracy-elections-and-political-parties#3","l":21,"q":"Hva må du være for å stemme ved stortingsvalg i Norge?","o":["Bosatt i Norge","Norsk statsborger","Å ha bodd i Norge i ett år","En voksen over 18 år"],"a":1,"e":"For å stemme ved stortingsvalg må du være norsk statsborger."},{"id":"human-rights-and-democracy-elections-and-political-parties#4","l":21,"q":"Hvor lenge må du ha bodd i Norge for å stemme ved kommune- og fylkestingsvalg?","o":["Minst ett år","Minst to år","Minst tre år","Minst fem år"],"a":2,"e":"For å stemme ved kommune- og fylkestingsvalg må du ha bodd i Norge de siste tre årene."},{"id":"human-
