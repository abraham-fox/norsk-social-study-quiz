50 metres from houses and cabins.'"},{"id":"sustainability-nature-and-natural-resources#4","l":37,"q":"During which months is lighting a fire prohibited in or near forests in Norway?","o":["June to August","January to March","15 April to 15 September","May to October"],"a":2,"e":"The lesson states 'Lighting a fire in the forest or near a forest is prohibited from 15 April to 15 September.'"},{"id":"sustainability-nature-and-natural-resources#5","l":37,"q":"What must you do if you want to stay in the same place in nature for more than two days?","o":["notify the police","ask for the landowner's permission","pay a fee to the government","register with the local tourism office"],"a":1,"e":"The lesson says 'If you would like to spend more than two days in the same place, you have to ask for the landowner's permission.'"},{"id":"sustainability-nature-and-natural-resources#6","l":37,"q":"Which metal is specifically mentioned as an especially important export product for Norway?","o":["copper","iron","aluminium","tin"],"a":2,"e":"The lesson states 'Metals are important export products, especially aluminium.'"},{"id":"sustainability-nature-and-natural-resources#7","l":37,"q":"Which sources of electricity production are mentioned in the lesson about Norway?","o":["coal and natural gas","hydropower and wind power","nuclear and solar power","wind and solar power"],"a":1,"e":"The lesson mentions both water in rivers and waterfalls used for electricity and windmills used to produce electric power."},{"id":"sustainability-nature-and-natural-resources#8","l":37,"q":"What attracts tourists to Norway according to the lesson?","o":["skiing and hiking in mountains","the fjords and the Midnight Sun","museums and cultural sites","winter sports only"],"a":1,"e":"The lesson states 'Tourists come from all over the world to see the fjords and the Midnight Sun.'"},{"id":"sustainability-nature-and-natural-resources#9","l":37,"q":"Why is nature itself considered a resource in Norway?","o":["because trees grow there","because tourists come from all over the world to see it","because oil is found there","because it requires legal protection"],"a":1,"e":"The lesson explains 'Nature in itself is also a resource. Tourists come from all over the world to see the fjords and the Midnight Sun.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#0","l":38,"q":"What is the main aim of nature conservation and environmental protection?","o":["To make money from selling natural resources","To ensure that people, animals and plants have good biotopes for the future","To stop all human activity in nature","To increase the production of recycled materials"],"a":1,"e":"The lesson states that nature conservation and environmental protection 'aim to ensure that people, animals and plants have good biotopes, also for the future.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#1","l":38,"q":"How is reuse different from recycling?","o":["Reuse means breaking things down into raw materials; recycling means other people use the item","Reuse means other people use the item; recycling means breaking down and making something new","They are exactly the same thing","Reuse is only for clothes; recycling is only for plastic"],"a":1,"e":"The lesson defines reuse as 'things we no longer need can be reused by other people' and recycling as 'things can be broken down into raw materials and put together again in a new way.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#2","l":38,"q":"How much waste does each person in Norway dispose of per year?","o":["Several dozen kilos","Several hundred kilos","Several thousand kilos","More than one million kilos"],"a":1,"e":"The lesson states 'Every person in Norway disposes of more than several hundred kilos of waste each year.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#3","l":38,"q":"What does 'separating waste at source' mean?","o":["Throwing all waste into one container at home","Taking waste to the recycling center only once per year","People sorting their own waste at home","Burning waste to reduce its volume"],"a":2,"e":"The lesson explains: 'People in many municipalities sort their own waste. This is called separating waste at source.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#4","l":38,"q":"What is food waste according to the lesson?","o":["Food that is expired and no longer safe to eat","Food that has been cooked but left uneaten","Edible food that is thrown out or not used for human consumption","Food that is left on plates in restaurants"],"a":2,"e":"The lesson defines food waste as 'when edible food is thrown out or used as something other than food for human consumption.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#5","l":38,"q":"According to the lesson, what proportion of the world's food production is thrown out?","o":["About one tenth","About one quarter","About one third","About one half"],"a":2,"e":"The lesson states 'One third of all the food that is produced around the world is thrown out.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#6","l":38,"q":"According to the lesson, what is true about the food that is thrown out globally every year?","o":["It is mostly sent to poor countries as food aid","It is mostly used to make fuel for cars and buses","It would be enough to feed all the hungry people in the world","It is mostly sorted at source and made into new food"],"a":2,"e":"The lesson says that the food that is thrown out globally every year would be enough to feed all the hungry people in the world."},{"id":"sustainability-nature-conservation-and-environmental-protection#7","l":38,"q":"Which sources produce the majority of greenhouse gas emissions in Norway?","o":["Agriculture and farming","Household heating and cooking","Oil and gas production, industry, mining, and road traffic","Air transport and international shipping"],"a":2,"e":"The lesson states 'The majority of emissions come from oil and gas production, industry and mining, as well as road traffic.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#8","l":38,"q":"What does it mean when a car is described as 'zero-emission'?","o":["The car produces less pollution than older cars","The car does not emit greenhouse gases","The car uses only electricity from renewable sources","The car is more expensive to buy than petrol cars"],"a":1,"e":"The lesson defines it clearly: 'A zero-emission car does not emit greenhouse gases.'"},{"id":"sustainability-nature-conservation-and-environmental-protection#9","l":38,"q":"What is Norway's goal for passenger transport increases in its largest cities?","o":["All new transport should involve private electric cars","All increases should involve public transportation, cycling, or walking","Everyone should use electric cars instead of public transport","Car traffic should increase along with population growth"],"a":1,"e":"The lesson states 'Another goal is that all increases in passenger transport in the largest cities involve public transportation, cycling or walking.'"},{"id":"sustainability-sustainable-development#0","l":39,"q":"What is the main goal of the UN Sustainable Development Goals (SDGs)?","o":["To increase international trade between countries","To eradicate poverty, combat inequality, and stop climate change by 2030","To improve transportation systems worldwide","To create more jobs for everyone"],"a":1,"e":"The lesson states that the SDGs' goal is to eradicate poverty, combat different types of inequality and stop climate change by 2030."},{"id":"sustainability-sustainable-development#1","l":39,"q":"What is the main difference between weather and climate?","o":["Weather is the average over a long period; climate is what we see every day","Weather is what we see every day; climate is the average over a long period","Weather is what we see in one country; climate is what we see in the whole world","Weather is what we see in summer; climate is what we see in winter"],"a":1,"e":"The lesson says the weather is what we see every day, while the climate is the average weather measured over a long period."},{"id":"sustainability-sustainable-development#2","l":39,"q":"According to the lesson, what do most climate researchers believe causes rapid climate change?","o":["Changes in the sun's energy","Natural ocean currents","Human CO2 emissions","The earth's natural cycles"],"a":2,"e":"The lesson states that most climate researchers believe human CO2 emissions are behind the rapid and far-reaching climate changes we see today."},{"id":"sustainability-sustainable-development#3","l":39,"q":"Which of the following is NOT mentioned as a climate change happening today?","o":["The earth's temperature is rising","The ice is melting","Precipitation is becoming less varied","The ocean is becoming more acidic"],"a":2,"e":"The lesson mentions more varied precipitation, not less varied precipitation, making this option incorrect."},{"id":"sustainability-sustainable-development#4","l":39,"q":"According to the lesson, which of these are examples of renewable resources?","o":["Oil, coal, and gas","Trees, wind, and sunshine","Only metals and minerals","Only oil and water"],"a":1,"e":"The lesson lists trees, wind, sunshine, animals, plants, water, and precipitation as examples of renewable resources."},{"id":"sustainability-sustainable-development#5","l":39,"q":"Which of these is classified as a non-renewable resource?","o":["Wind","Water","Coal","Trees"],"a":2,"e":"The lesson specifically lists coal as an example of a non-renewable resource."},{"id":"sustainability-sustainable-development#6","l":39,"q":"What is a main advantage of eating locally produced food?","o":["It is always cheaper than imported food","It never requires crop sprays","It requires less transport, which saves greenhouse gas emissions","It always tastes better than imported food"],"a":2,"e":"The lesson states that when food is produced locally, there is less need for transport and we save greenhouse gas emissions."},{"id":"sustainability-sustainable-development#7","l":39,"q":"According to the lesson, what is easier to control with locally produced food?","o":["The price, the packaging and the shelf life","The taste, the colour and the size of the food","Crop sprays, use of antibiotics and animal welfare","Export rules, customs duties and import taxes"],"a":2,"e":"The lesson says it is easier to control the production of locally produced food, such as crop sprays, the use of antibiotics and animal welfare conditions."},{"id":"sustainability-sustainable-development#8","l":39,"q":"What does the term 'renewable resource' mean according to the lesson?","o":["A resource that must be recycled regularly","A self-renewing natural resource that is not used up if exploited properly","A resource that can be used only once","A resource found only in developed countries"],"a":1,"e":"The lesson defines renewable resources as self-renewing natural resources that are not used up if exploited properly."},{"id":"sustainability-sustainable-development#9","l":39,"q":"By what year does the UN aim to achieve the Sustainable Development Goals?","o":["2020","2025","2030","2035"],"a":2,"e":"The lesson states that the goal of the SDGs is to eradicate poverty and stop climate change by 2030."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#0","l":40,"q":"What is violence according to the lesson?","o":["A legal punishment administered by courts","Abuse of another person","A conflict between people that doesn't cause harm","A type of criminal investigation"],"a":1,"e":"The lesson explicitly defines violence as abuse of another person."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#1","l":40,"q":"According to the lesson, what are the types of abuse that violence can include?","o":["Only physical and psychological abuse","Physical, psychological, sexual and material abuse","Only physical abuse","Only sexual and material abuse"],"a":1,"e":"The lesson lists four types of abuse: physical, psychological, sexual, or material."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#2","l":40,"q":"What is domestic violence?","o":["Violence that occurs in public places","Violence between family members or in other close relationships","Violence only between married couples","Violence that causes minor injuries"],"a":1,"e":"The lesson defines domestic violence as violence between family members or in other close relationships, or between children and adults where the adult has care responsibility."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#3","l":40,"q":"What does Norwegian law say about violence?","o":["All use of violence is prohibited","Some violence is permitted in certain situations","Violence is only illegal if it causes serious harm","Domestic violence is permitted under Norwegian law"],"a":0,"e":"The lesson states 'All types of violence are illegal in Norway.'"},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#4","l":40,"q":"Is domestic violence considered a private matter in Norway?","o":["Yes, it is a private family matter","No, it is not a private matter","It is private unless someone is seriously injured","It is only a public matter if children are involved"],"a":1,"e":"The lesson explicitly states 'Domestic violence is thus not a private matter.'"},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#5","l":40,"q":"According to the lesson, what effect can witnessing violence have on children?","o":["It has no negative effect","It helps children develop emotional strength","It can be harmful to children","It only affects children if they are directly targeted"],"a":2,"e":"The lesson states 'It can be harmful for children to witness violence.'"},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#6","l":40,"q":"Which group is mentioned in the lesson as being particularly at risk of domestic violence?","o":["Only older adults","Only divorced people","LGBTIQ+ community members","Only wealthy families"],"a":2,"e":"The lesson mentions that 'Lesbian, gay, bisexual, transgender, intersex persons and other members of the LGBTIQ+ community may be particularly at risk of such violence.'"},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#7","l":40,"q":"What does the lesson say about forced marriage and female genital mutilation?","o":["They are traditional practices that should be respected","They are forms of violence that cannot be tolerated","They are legal in Norway under certain conditions","They are only harmful if performed without consent"],"a":1,"e":"The lesson states 'Forced marriage and female genital mutilation are also violence and cannot be tolerated.'"},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#8","l":40,"q":"What responsibility does society have regarding people who are subjected to violence?","o":["To leave violence in the home to the family itself","To protect and take care of everyone subjected to violence","To help only the victims who move out of their homes","To punish every family member in a home with violence"],"a":1,"e":"The lesson states that society has the responsibility to protect and take care of everyone subjected to violence."},{"id":"the-right-to-a-free-and-independent-life-domestic-violence#9","l":40,"q":"According to the lesson, what can negative social control involve?","o":["Only financial pressure","Only social criticism","Violence","Only psychological manipulation without violence"],"a":2,"e":"The lesson mentions 'Negative social control can also entail violence.'"},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#0","l":41,"q":"What is female genital mutilation?","o":["A procedure that damages or removes outer genital parts for non-therapeutic reasons","A procedure that damages or removes outer genital parts for therapeutic medical reasons","A minor surgical procedure to treat certain medical conditions","A voluntary procedure that some women choose for cultural reasons"],"a":0,"e":"The lesson defines female genital mutilation as a procedure that damages or removes the outer genital parts for non-therapeutic reasons."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#1","l":41,"q":"What is the maximum prison sentence for aggravated female genital mutilation in Norway?","o":["6 years","10 years","15 years","20 years"],"a":2,"e":"The lesson states that in cases of aggravated female genital mutilation, the punishment could be imprisonment for a term of up to 15 years."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#2","l":41,"q":"According to Norwegian law, if a woman consents to female genital mutilation, is it still illegal?","o":["No, consent makes it legal","No, it is permitted if the woman is an adult","Yes, it is still illegal regardless of consent","No, it is only illegal if the woman objects"],"a":2,"e":"The lesson explicitly states that even if the girl or the woman consents to the circumcision, the procedure is still illegal."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#3","l":41,"q":"What is the maximum prison sentence for breaching the duty to avert female genital mutilation?","o":["6 months","1 year","3 years","5 years"],"a":1,"e":"The lesson states that not fulfilling the duty to avert female genital mutilation could be punished by imprisonment for a term of up to one year."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#4","l":41,"q":"Is it illegal in Norway to take a girl out of the country to have female genital mutilation performed?","o":["No, what happens outside Norway is not covered by Norwegian law","No, it is permitted if the parents consent","Yes, it is illegal to take a girl out of Norway for this purpose","No, it is only illegal if done in Norway"],"a":2,"e":"The lesson states that it is illegal to take a girl out of Norway and impart harm on her genitals abroad."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#5","l":41,"q":"According to the lesson, why is female genital mutilation illegal in Norway?","o":["Because there are no qualified doctors to perform it","Because it is too expensive for the government to allow","Because it violates equality between the sexes and the right to decide over one's own body","Because it is only practised in a few countries"],"a":2,"e":"The lesson explains that equality between the sexes is an important value in Norwegian society and that everyone can decide over their own body, values violated by female genital mutilation."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#6","l":41,"q":"According to the lesson, where can someone who is at risk of female genital mutilation seek help?","o":["the tax office","the health centre","the post office","the public library"],"a":1,"e":"The lesson lists the health centre, together with the regular GP and the police, as a place where someone at risk of female genital mutilation can seek help."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#7","l":41,"q":"Is it legal in Norway to restore or reconstruct female genital mutilation that was performed previously?","o":["Yes, if the woman consents","Yes, if a qualified medical doctor performs it","No, it is illegal to restore or reconstruct earlier female genital mutilation","Yes, it is permitted for health and hygiene reasons"],"a":2,"e":"The lesson states that it is also illegal to restore or reconstruct earlier female genital mutilation."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#8","l":41,"q":"According to the lesson, how can female genital mutilation harm girls?","o":["It has no lasting effects","It only causes pain during the procedure","It can afflict the girl for the rest of her life","It only affects girls during their teenage years"],"a":2,"e":"The lesson states that female genital mutilation is harmful and can afflict the girl for the rest of her life."},{"id":"the-right-to-a-free-and-independent-life-female-genital-mutilation#9","l":41,"q":"Is it legal to assist another person in performing female genital mutilation in Norway?","o":["Yes, if you are a family member helping with a cultural tradition","Yes, if the girl or woman consents","No, it is illegal to assist anyone in harming a girl's or woman's genitals","Yes, if a medical professional performs the procedure"],"a":2,"e":"The lesson states that it is illegal to assist anyone in harming a girl's or woman's genitals."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#0","l":42,"q":"What is the minimum age to get married in Norway?","o":["16 years old","17 years old","18 years old","19 years old"],"a":2,"e":"The Marriage Act states that any person who is over 18 years of age may contract a marriage in Norway."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#1","l":42,"q":"Who can enter into marriage in Norway?","o":["Only people of opposite sex","Only people of same sex","People of opposite or same sex","Only unmarried people aged 25 or older"],"a":2,"e":"The lesson states that two persons of the opposite or same sex can enter into marriage."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#2","l":42,"q":"What is a love marriage?","o":["Parents find a spouse for their children","A marriage between wealthy people","The couple find each other and decide to get married","A marriage approved by the government"],"a":2,"e":"A love marriage is when the couple find each other themselves and decide to get married."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#3","l":42,"q":"What is the main difference between an arranged marriage and a forced marriage?","o":["Arranged marriages don't require parental involvement; forced marriages do","In arranged marriages children accept the parents' choice; in forced marriages they are pressured or forced","Arranged marriages are traditional, forced marriages are modern","Both are equally illegal in Norway"],"a":1,"e":"The lesson defines arranged marriage as when parents play an important role and children accept the choice, while forced marriage involves parents putting pressure or forcing children to marry."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#4","l":42,"q":"What is the punishment for forcing someone to marry in Norway?","o":["A fine of 50,000 kroner","Imprisonment for up to 3 years","Imprisonment for up to 6 years","Community service for two years"],"a":2,"e":"The Penal Code states that any person who forces someone to marry can be punished by imprisonment for a term of up to six years."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#5","l":42,"q":"If someone is forced to marry, what can they do in a Norwegian court?","o":["They can only get a divorce after a waiting period","They can get the marriage annulled","They must remain in the marriage","They can only separate informally"],"a":1,"e":"The lesson states that someone who is forced or pressured to marry can go to a Norwegian court and get the marriage annulled."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#6","l":42,"q":"How many years after the marriage can someone get a forced marriage annulled in a Norwegian court?","o":["1 year","3 years","5 years","10 years"],"a":2,"e":"The lesson specifies that annulment of a forced marriage must be done within five years of the marriage."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#7","l":42,"q":"What is the punishment for someone who helps force another person to marry?","o":["They face no legal consequences","They must pay a larger fine than the main offender","They receive only a warning","They receive the same punishment as the person forcing the marriage"],"a":3,"e":"The lesson states that aiding and abetting a forced marriage is punished in the same way as forcing a marriage—imprisonment for up to six years."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#8","l":42,"q":"Do women and men have the same right to choose a spouse in Norway?","o":["No, men have more rights","No, women have more rights","Yes, they have the same rights","This depends on their age and location"],"a":2,"e":"The Marriage Act states that women and men have the same right to freely choose their spouse."},{"id":"the-right-to-a-free-and-independent-life-forced-marriage#9","l":42,"q":"What must be true for a marriage to be valid in Norway?","o":["It must be approved by the extended family","It must involve two people of opposite sex","It must be entered into voluntarily","It must be registered within one month of the ceremony"],"a":2,"e":"The lesson states that marriages must be entered into voluntarily, and forced marriage is not valid under Norwegian law."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#0","l":43,"q":"What is social control?","o":["The framework that surrounds an individual's behaviour and way of life","A government financial support scheme for families with strict rules","Rules that only apply to immigrants learning Norwegian","Laws that prevent young people from working"],"a":0,"e":"The lesson defines social control as the framework that surrounds an individual's behaviour and way of life."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#1","l":43,"q":"According to the lesson, who can set frameworks for an individual's behaviour?","o":["Parents and society through rules and laws","Only the government through laws","Only parents and family members","Only schools and teachers"],"a":0,"e":"The lesson explains that parents set frameworks around their children's lives, and society sets frameworks through written and unwritten rules and laws."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#2","l":43,"q":"When does social control become perceived as negative?","o":["When parents set any rules at all","When someone thinks the rules are too strict and unreasonable","When society has both written and unwritten rules","When children become teenagers"],"a":1,"e":"The lesson states that when rules are perceived as unreasonable, social control is seen as something negative."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#3","l":43,"q":"What is one consequence of negative social control mentioned in the lesson?","o":["It helps children become more independent","It can deny the individual the right to live an independent life","It prevents parents from trusting their children","It makes rules easier to understand"],"a":1,"e":"The lesson explains that negative social control can deny the individual the personal freedom and right to live an independent life."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#4","l":43,"q":"Why did Merhet have to stop playing handball?","o":["Her school didn't have a handball team","She wanted to focus on her studies","Her father didn't like her wearing shorts when playing","She was too busy with other activities"],"a":2,"e":"The lesson states that Merhet had to stop playing handball because her father doesn't like her wearing shorts when she plays."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#5","l":43,"q":"How old was Merhet's brother when Merhet was 14?","o":["12 years old","14 years old","16 years old","18 years old"],"a":2,"e":"The lesson mentions that Merhet's brother is two years older than her, making him 16 when she is 14."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#6","l":43,"q":"What did Merhet's mother do every night?","o":["She helped Merhet with the homework she got at school","She checked Merhet's phone to see who she had talked to","She went out to meet her own friends in town","She checked Merhet's school books and her grades"],"a":1,"e":"The lesson states that Merhet's mother checks her phone every night to see who she has talked and sent messages to."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#7","l":43,"q":"What did Merhet notice about how her parents treated her as she entered puberty?","o":["They gave her more freedom","They became much stricter","They stopped caring about her activities","They moved to a different city"],"a":1,"e":"The lesson explains that as Merhet entered puberty, she noticed that her parents had become much stricter."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#8","l":43,"q":"Two years later, what was different about Merhet's life compared to her Norwegian school friends?","o":["They had stricter parents than hers","She had the same freedoms they did","There was a big difference in their day-to-day lives","They couldn't sleep over at each other's houses either"],"a":2,"e":"The lesson states that there is a big difference between Merhet's day-to-day life and that of her Norwegian school friends."},{"id":"the-right-to-a-free-and-independent-life-negative-social-control#9","l":43,"q":"According to the lesson, what resource is available at Merhet's school that might help her?","o":["A social worker who specializes in family problems","A minority counsellor","A psychologist who works with immigrant families","A support group for young people with strict parents"],"a":1,"e":"The lesson mentions that Merhet has heard there is a minority counsellor at her school."},{"id":"this-is-norway-equality#0","l":44,"q":"What is one of the most important values in Norwegian society?","o":["Individual success","Equality between people","Family loyalty","Hard work"],"a":1,"e":"The lesson states that 'Equality between people is one of the most important values in Norwegian society.'"},{"id":"this-is-norway-equality#1","l":44,"q":"When did women's rights come into focus in Norwegian society?","o":["In the 1940s","In the 1970s","In the 1990s","In the 2000s"],"a":1,"e":"The lesson explicitly states 'During the 1970s, women's rights in society and the opportunities available to women in education and the labour market came into focus.'"},{"id":"this-is-norway-equality#2","l":44,"q":"What does the lesson say about women in the Norwegian workforce today?","o":["Far fewer women than men are employed","Almost as many women as men are in employment","Twice as many men as women are employed","Equal numbers with no gender differences"],"a":1,"e":"The lesson states 'Women's labour force participation has increased strongly since then, and today almost as many women as men are in employment.'"},{"id":"this-is-norway-equality#3","l":44,"q":"Which of the following is an example of equality in practice in Norway?","o":["Different pay based on gender","Equal pay for equal work","More leadership positions for men","Traditional role divisions in families"],"a":1,"e":"The lesson lists 'the principle of equal pay for equal work' as an example of how society tries to give everybody the same opportunities."},{"id":"this-is-norway-equality#4","l":44,"q":"What do surveys show about housework in Norwegian families?","o":["Men do more housework than women","Women and men do exactly equal amounts","Women spend more time on housework than men","Young families do no housework"],"a":2,"e":"The lesson states 'surveys show that women still spend more time on housework than men do.'"},{"id":"this-is-norway-equality#5","l":44,"q":"What is Section 185 of the 2005 General Civil Penal Code commonly called?","o":["The freedom paragraph","The equality paragraph","The racism paragraph","The family paragraph"],"a":2,"e":"The lesson says 'Section 185 of the 2005 General Civil Penal Code is often called the racism paragraph.'"},{"id":"this-is-norway-equality#6","l":44,"q":"Section 185 prohibits discriminatory or hateful statements aimed at what?","o":["People's income, education, hobbies or political opinions","People's job, home town, dialect or family situation","People's ethnicity, skin colour, religion or disability","People's wealth, social class, workplace or marital status"],"a":2,"e":"The lesson says that Section 185 prohibits discriminatory or hateful statements aimed at people's ethnicity, skin colour, life stance, religion, sexual orientation, gender identity/gender expression or disability."},{"id":"this-is-norway-equality#7","l":44,"q":"What is the main purpose of Section 185 of the Penal Code?","o":["To increase government power","To limit all freedom of expression equally","To protect minorities","To control employment"],"a":2,"e":"The lesson explicitly states 'The object of the racism paragraph is to protect minorities.'"},{"id":"this-is-norway-equality#8","l":44,"q":"Which statement about higher education in Norway is correct according to the lesson?","o":["Far more men than women have a higher education.","Roughly the same number of women and men have a higher education.","Far more women than men have a higher education.","Women and men with a higher education choose the same fields."],"a":1,"e":"The lesson says that roughly the same number of women and men now have a higher education, but their choices are often still traditional."},{"id":"this-is-norway-equality#9","l":44,"q":"What does equality mean, according to the lesson?","o":["All people should earn the same amount of money.","All people have the same abilities and skills.","All people have the same value, regardless of background.","All people must have the same job and education."],"a":2,"e":"The lesson says that equality means that all people have the same value regardless of gender, age, functional impairments, cultural background, ethnicity or sexual orientation."},{"id":"this-is-norway-facts-about-norway#0","l":45,"q":"What is Svalbard?","o":["A mountain range in western Norway","A group of islands that belongs to Norway","A city in northern Norway","A large fjord in eastern Norway"],"a":1,"e":"The lesson states that Svalbard is a group of islands that belongs to Norway."},{"id":"this-is-norway-facts-about-norway#1","l":45,"q":"Norway is divided into how many municipalities?","o":["150","250","357","450"],"a":2,"e":"The lesson says Norway is divided into 357 municipalities."},{"id":"this-is-norway-facts-about-norway#2","l":45,"q":"How many counties does Norway have?","o":["10","12","15","20"],"a":2,"e":"The lesson states that Norway is divided into 15 counties."},{"id":"this-is-norway-facts-about-norway#3","l":45,"q":"Approximately how long is Norway's entire coastline?","o":["15,000 kilometres","25,148 kilometres","35,000 kilometres","40,000 kilometres"],"a":1,"e":"The lesson says Norway's extensive coastline is 25,148 kilometres long."},{"id":"this-is-norway-facts-about-norway#4","l":45,"q":"How many islands are there along Norway's coast?","o":["About 5,000","About 15,000","About 25,000","About 50,000"],"a":3,"e":"The lesson states there are around 50,000 islands along the coast."},{"id":"this-is-norway-facts-about-norway#5","l":45,"q":"What can you say about the summer in northern Norway?","o":["It is long and very cold with no sun","It is short but light and pleasant with the Midnight Sun","It is long, warm and very sunny","It is rainy and dark for several months"],"a":1,"e":"The lesson says the summers in Northern Norway are short but the Midnight Sun makes them light and pleasant."},{"id":"this-is-norway-facts-about-norway#6","l":45,"q":"Compared to Eastern Norway, which is true about Western Norway?","o":["It has more rain and spring comes earlier","It has less rain and spring comes later","It has the same weather patterns","It never snows in winter"],"a":0,"e":"The lesson states that spring comes early in Western Norway and it rains more in Western Norway than in Eastern Norway."},{"id":"this-is-norway-facts-about-norway#7","l":45,"q":"What is the highest temperature ever recorded in Norway?","o":["28 degrees Celsius","32.5 degrees Celsius","35.6 degrees Celsius","40 degrees Celsius"],"a":2,"e":"The lesson says the highest temperature ever recorded in Norway was 35.6 degrees Celsius in Nesbyen on 20 June 1970."},{"id":"this-is-norway-facts-about-norway#8","l":45,"q":"How much larger is India compared to Norway?","o":["About 5 times larger","About 8 times larger","Almost 10 times larger","About 15 times larger"],"a":2,"e":"The lesson states that India is almost ten times as large as Norway."},{"id":"this-is-norway-facts-about-norway#9","l":45,"q":"How much of Norway's population lives in Eastern Norway?","o":["One third","One half","Two thirds","Three quarters"],"a":1,"e":"The lesson says that half of the population lives in Eastern Norway."},{"id":"this-is-norway-minority-and-majority-in-norway#0","l":46,"q":"How many Europeans emigrated to America between 1820 and 1930?","o":["About 5 million","About 10 million","More than 30 million","About 50 million"],"a":2,"e":"The lesson states that more than 30 million Europeans moved to America from 1820 to 1930."},{"id":"this-is-norway-minority-and-majority-in-norway#1","l":46,"q":"Approximately how many people emigrated from Norway to America between 1820 and 1930?","o":["About 300,000","Around 800,000","About 2 million","About 5 million"],"a":1,"e":"The lesson states that around 800,000 people emigrated from Norway alone during this period."},{"id":"this-is-norway-minority-and-majority-in-norway#2","l":46,"q":"How many people in Norway were born abroad or have parents born abroad?","o":["More than 0.5 million","More than 1 million","More than 2 million","More than 3 million"],"a":1,"e":"The lesson states that more than one million people in Norway were born abroad or to parents who were born abroad."},{"id":"this-is-norway-minority-and-majority-in-norway#3","l":46,"q":"Which countries do the largest groups of immigrants in Norway come from?","o":["Germany, France, Spain, and Italy","Poland, Lithuania, Ukraine, Sweden, and Syria","Denmark, Sweden, Finland, and Iceland","India, Pakistan, Bangladesh, and the Philippines"],"a":1,"e":"The lesson lists Poland, Lithuania, Ukraine, Sweden, and Syria as the countries from which the largest immigrant groups in Norway come."},{"id":"this-is-norway-minority-and-majority-in-norway#4","l":46,"q":"Where do most immigrants in Norway live?","o":["In small villages","In rural farming areas","In cities","In coastal towns"],"a":2,"e":"The lesson states that although immigrants live in all municipalities, more immigrants live in the cities than in the countryside."},{"id":"this-is-norway-minority-and-majority-in-norway#5","l":46,"q":"What is a national minority in Norway?","o":["Recent immigrants who arrived in the past 10 years","Ethnic groups with a connection to Norway going back centuries","People who speak a foreign language at home","Refugees from countries at war"],"a":1,"e":"The lesson defines national minorities as ethnic groups living in Norway that have a connection to the country going back centuries."},{"id":"this-is-norway-minority-and-majority-in-norway#6","l":46,"q":"Which group is a national minority in Norway according to the lesson?","o":["Poles","Lithuanians","Sami","Syrians"],"a":2,"e":"The lesson lists Sami as one of the national minorities in Norway, along with Jews, Kven, Forest Finns, Roma, and Romani/tater."},{"id":"this-is-norway-minority-and-majority-in-norway#7","l":46,"q":"In what year did Norway ratify an agreement on national minorities' rights?","o":["1950","1975","1999","2010"],"a":2,"e":"The lesson states that Norway ratified an agreement on national minorities' rights in 1999."},{"id":"this-is-norway-minority-and-majority-in-norway#8","l":46,"q":"What does Norway's agreement on national minorities' rights require the central government to do?","o":["Make sure national minorities adopt Norwegian culture","Enable national minorities to preserve their culture","Limit how many national minorities can live in Norway","Require all national minorities to become citizens"],"a":1,"e":"The lesson states that the central government is obliged to enable people who belong to national minorities to preserve and develop their culture, including religion, language, traditions and cultural heritage."},{"id":"this-is-norway-minority-and-majority-in-norway#9","l":46,"q":"What is important for immigrants to use their resources and contribute to society in Norway?","o":["Good physical health","Good Norwegian language skills","A large family network","Previous professional experience"],"a":1,"e":"The lesson states that one of the keys to ensuring integration is that everyone who lives in Norway has good Norwegian language skills."},{"id":"this-is-norway-red-letter-days-and-public-holidays#0","l":47,"q":"When is New Year's Day celebrated?","o":["December 31","January 1","January 6","February 1"],"a":1,"e":"The lesson states that the first day of the year is 1 January, which is called New Year's Day."},{"id":"this-is-norway-red-letter-days-and-public-holidays#1","l":47,"q":"Is Sami National Day a public holiday in Norway?","o":["Yes, it is a public holiday","No, it is only an official flag-flying day","Yes, but only in northern Norway","Only for Sami citizens"],"a":1,"e":"The lesson states that Sami National Day on 6 February is an official flag-flying day, but not a public holiday."},{"id":"this-is-norway-red-letter-days-and-public-holidays#2","l":47,"q":"When did International Women's Day begin to be celebrated every year in Norway?","o":["1915","1970","1972","1976"],"a":2,"e":"The lesson states that International Women's Day has been celebrated every year in Norway since 1972."},{"id":"this-is-norway-red-letter-days-and-public-holidays#3","l":47,"q":"How many days after Easter is Ascension Day celebrated?","o":["30 days","40 days","50 days","60 days"],"a":1,"e":"The lesson states that Ascension Day is on a Thursday 40 days after Easter."},{"id":"this-is-norway-red-letter-days-and-public-holidays#4","l":47,"q":"Which red-letter day celebrates the signing of the Norwegian constitution?","o":["Labour Day","Constitution Day","Women's Day","Ascension Day"],"a":1,"e":"The lesson states that Constitution Day celebrates the signing of the Norwegian constitution on 17 May 1814."},{"id":"this-is-norway-red-letter-days-and-public-holidays#5","l":47,"q":"What is Constitution Day primarily a day for?","o":["Political speeches and marches","Workers and labour rights","Children","Religious ceremonies"],"a":2,"e":"The lesson states that Constitution Day is first and foremost a day for children."},{"id":"this-is-norway-red-letter-days-and-public-holidays#6","l":47,"q":"On what date is Labour Day celebrated?","o":["March 1","April 1","May 1","June 1"],"a":2,"e":"The lesson states that International Labour Day is celebrated on 1 May."},{"id":"this-is-norway-red-letter-days-and-public-holidays#7","l":47,"q":"What is December 24 called in Norwegian tradition?","o":["New Year's Eve","Boxing Day","Christmas Eve","Christmas Day"],"a":2,"e":"The lesson states that 24 December is called Christmas Eve."},{"id":"this-is-norway-red-letter-days-and-public-holidays#8","l":47,"q":"Is New Year's Eve a public holiday in Norway?","o":["Yes, it is always a public holiday","No, it is not a public holiday","It is a half-day public holiday","It is a public holiday only in some regions"],"a":1,"e":"The lesson states that New Year's Eve is not a public holiday."},{"id":"this-is-norway-red-letter-days-and-public-holidays#9","l":47,"q":"In which months can Easter occur?","o":["February or March","March or April","April or May","May or June"],"a":1,"e":"The lesson states that Easter is in either March or April, with exact dates varying from year to year."},{"id":"this-is-norway-religion-and-life-stance#0","l":48,"q":"What does it mean when Norway is described as a secular society?","o":["The country is not characterized by religion in private life or laws","Religion is completely banned in all public places","Only one official religion is allowed in Norway","Citizens can be punished for practicing their own religion"],"a":0,"e":"The lesson states that a secular society means it is not characterised by religion, both among private individuals and when laws are devised."},{"id":"this-is-norway-religion-and-life-stance#1","l":48,"q":"When did it become legal for Norwegians to leave the state church?","o":["1750","1845","1912","2012"],"a":1,"e":"The lesson explicitly states it was against the law for Norwegians to leave the state church until 1845."},{"id":"this-is-norway-religion-and-life-stance#2","l":48,"q":"What was Norway's state religion until 2012?","o":["Catholicism","Protestantism","Orthodox Christianity","Islam"],"a":1,"e":"The lesson says that up until 2012, Protestantism was the state religion of Norway, and the Church of Norway was the state church."},{"id":"this-is-norway-religion-and-life-stance#3","l":48,"q":"What approach do many Norwegians have to religion today?","o":["A strict approach, following religious rules every day","A relaxed approach, although many go to church at important events","A distant approach, avoiding everything connected with religion","A private approach, practising religion only in secret"],"a":1,"e":"The lesson states that today many Norwegians have a much more relaxed approach to religion, although many people go to church in connection with important events like christenings, confirmations, weddings and funerals."},{"id":"this-is-norway-religion-and-life-stance#4","l":48,"q":"What is one aspect of full freedom of religion in Norway?","o":["You can practice your religion without fear of persecution or punishment","The government decides what religion everyone must follow","Religious people are required to wear special religious clothing","All citizens must be members of a religious community"],"a":0,"e":"The lesson explains that full freedom of religion means you can practise your religion without fear of persecution or punishment."},{"id":"this-is-norway-religion-and-life-stance#5","l":48,"q":"When did it become legal to establish non-Christian religious communities in Norway?","o":["Around 1700","Around 1850","1925","1975"],"a":1,"e":"The lesson states that it was only in around 1850 that it became legal to establish non-Christian religious communities in Norway."},{"id":"this-is-norway-religion-and-life-stance#6","l":48,"q":"According to the lesson, what is true of people in Norway who are not members of the Church of Norway?","o":["They can be punished for not being church members","They must all belong to another Christian community","They belong to other religious communities or to none","They are not allowed to practise any other religion"],"a":2,"e":"The lesson states that the rest of the population either belong to other religious communities or to no such community at all."},{"id":"this-is-norway-religion-and-life-stance#7","l":48,"q":"How are registered religious and life stance communities funded in Norway?","o":["Only through private donations from members","They receive no government support at all","They receive the same amount per member as the Church of Norway from government and municipalities","Religious communities receive more funding than life stance communities"],"a":2,"e":"The lesson explains that registered religious and life stance communities receive the same amount for each member as the Church of Norway does from central government and municipalities."},{"id":"this-is-norway-religion-and-life-stance#8","l":48,"q":"What is the situation for the state church in Norway today?","o":["The Church of Norway is still the official state church","Norway no longer has a state church or an official religion","Norway has a Catholic state church instead of a Protestant one","Each municipality chooses its own state church and religion"],"a":1,"e":"The lesson states that Norway thus no longer has a state church or an official religion."},{"id":"this-is-norway-religion-and-life-stance#9","l":48,"q":"According to the lesson example with Kåre, why do many modern Norwegians participate in church activities despite not being strictly religious?","o":["They are required by law to attend church services","They value the tradition, atmosphere, and solemnity even without being deeply religious","They fear government penalties for not attending","Religious participation has increased dramatically in recent years"],"a":1,"e":"The lesson shows through Kåre's example that people value the atmosphere, tradition, and solemnity of church events even when they do not consider themselves religious."},{"id":"this-is-norway-the-sami-people#0","l":49,"q":"In which four countries do the Sami people live?","o":["Norway, Sweden, Denmark and Finland","Norway, Sweden, Finland and Russia","Finland, Sweden, Russia and Poland","Norway, Iceland, Greenland and Canada"],"a":1,"e":"The lesson states that the Sami live in four countries: Norway, Sweden, Finland and Russia."},{"id":"this-is-norway-the-sami-people#1","l":49,"q":"Why cannot a person who only speaks Norwegian understand a Sami person?","o":["Sami is only a written language","Sami languages are completely different from Norwegian","Sami is not spoken in daily life","Sami has the same grammar as Norwegian"],"a":1,"e":"The lesson explains that Sami languages are completely different from Norwegian, so a Norwegian speaker cannot understand Sami."},{"id":"this-is-norway-the-sami-people#2","l":49,"q":"What did Sami people traditionally make a living from?","o":["Agriculture and oil drilling","Hunting, trapping and fishing","Manufacturing and trade","Farming and mining"],"a":1,"e":"The lesson states that traditionally, Sami have made a living from hunting, trapping and fishing, and many Sami still own reindeer."},{"id":"this-is-norway-the-sami-people#3","l":49,"q":"On what date is Sami National Day?","o":["6 January","6 February","6 May","6 November"],"a":1,"e":"The lesson clearly states that Sami National Day is on 6 February."},{"id":"this-is-norway-the-sami-people#4","l":49,"q":"What is the Sami national costume called?","o":["Bunad","Kofte","Lavvo","Joik"],"a":1,"e":"The lesson states that the Sami have national costumes that are called kofte."},{"id":"this-is-norway-the-sami-people#5","l":49,"q":"What were Sami children not allowed to do during the 'Norwegianisation' period?","o":["Speak Norwegian at home","Learn Sami","Wear traditional costumes","Own reindeer"],"a":1,"e":"The lesson states that during Norwegianisation, Sami children had to go to Norwegian schools and they were not allowed to learn Sami."},{"id":"this-is-norway-the-sami-people#6","l":49,"q":"In what year were Sami children first allowed to learn Sami in schools?","o":["1902","1945","1959","1965"],"a":2,"e":"The lesson states that in 1959, the Sami language was again allowed to be used as a language in schools."},{"id":"this-is-norway-the-sami-people#7","l":49,"q":"The 1902 act restricted land ownership in Norway. Until when was this act in force?","o":["1945","1955","1965","1975"],"a":2,"e":"The lesson states that an act from 1902 was in force until 1965, which restricted land ownership to those who could speak, read and write Norwegian."},{"id":"this-is-norway-the-sami-people#8","l":49,"q":"When did the Sami Parliament open?","o":["1959","1965","1989","2000"],"a":2,"e":"The lesson states that the Sami Parliament opened in 1989."},{"id":"this-is-norway-the-sami-people#9","l":49,"q":"How often are members elected to the Sami Parliament?","o":["Every 2 years","Every 3 years","Every 4 years","Every 5 years"],"a":2,"e":"The lesson states that members are elected to the Sami Parliament every four years."},{"id":"working-life-job-seeking#0","l":50,"q":"What is a job application?","o":["A letter where you write about yourself and your background","A document showing your work experience and education","A formal request to the government for employment permission","A form that the employer fills out to describe the job"],"a":0,"e":"The lesson states 'The application is a letter where you write a little about yourself and your background.'"},{"id":"working-life-job-seeking#1","l":50,"q":"What information should be included in a CV?","o":["Your personal opinions about different types of work","A brief description of your work experience and education","Detailed information about your family and personal life","A list of all the jobs you did not want to do"],"a":1,"e":"The lesson defines 'The CV is a document where you briefly describe your work experience and education.'"},{"id":"working-life-job-seeking#2","l":50,"q":"What language should your application and CV be written in?","o":["English","Your home country's language","Correct Norwegian","Any language that the employer understands"],"a":2,"e":"The lesson states 'The application and CV should be written in correct Norwegian.'"},{"id":"working-life-job-seeking#3","l":50,"q":"What does the lesson say about all the information you provide in your application and CV?","o":["It must be approved by the municipality","It may be a little exaggerated","Every part of it must be correct","It must be signed by a past employer"],"a":2,"e":"The lesson states: 'All the information you provide must be correct.'"},{"id":"working-life-job-seeking#4","l":50,"q":"What is low in Norway?","o":["The number of job vacancies","The quality of education","The cost of living","Unemployment"],"a":3,"e":"The lesson opens with 'Although unemployment is low in Norway, there can still be strong competition for vacant jobs.'"},{"id":"working-life-job-seeking#5","l":50,"q":"Who can ask questions during a job interview?","o":["Only the employer","Only the applicant","Both the applicant and the employer","Only the employer's manager"],"a":2,"e":"The lesson states 'Both of them can ask questions' about the interview process."},{"id":"working-life-job-seeking#6","l":50,"q":"When preparing for a job interview, what should you think about?","o":["Only the questions you will ask","The location of the interview and the clothes you will wear","Only how to answer difficult questions","Whether you really want the job"],"a":1,"e":"The interview tips state 'Find out where the interview is going to be' and 'Think about the clothes you are going to wear.'"},{"id":"working-life-job-seeking#7","l":50,"q":"What does an employer consider when deciding who to hire?","o":["Only the person's education and qualifications","Only the person's work experience","Education, experience, references, personality, and qualities that suit the position","Only whether the person has a firm handshake"],"a":2,"e":"The lesson states employers consider 'experience, good references, personality that will suit the working environment, qualities that suit the position' in addition to education."},{"id":"working-life-job-seeking#8","l":50,"q":"What should you do if you want to work in Norway?","o":["Wait for employers to contact you","Actively search for a job","Only apply to large companies","Only use job agencies"],"a":1,"e":"The lesson states 'If you want to work, you have to actively search for a job.'"},{"id":"working-life-job-seeking#9","l":50,"q":"Why do employers call applicants in to interviews?","o":["To let the applicant try the job for a day","To get an impression of the applicant","To check the applicant's language test","To sign a work contract with the applicant"],"a":1,"e":"The lesson says that at the interview the person responsible for hiring will get an impression of the applicant."},{"id":"working-life-laws-and-rules-in-working-life#0","l":51,"q":"Who is responsible for adopting laws in Norway?","o":["The employers' organisations","The members of the Storting","The trade unions","The companies"],"a":1,"e":"The lesson states that 'The members of the Storting adopt laws.'"},{"id":"working-life-laws-and-rules-in-working-life#1","l":51,"q":"What is the key difference between laws and collective agreements?","o":["Laws apply to everyone, while collective agreements apply only to specific industries","Collective agreements apply to everyone, while laws apply only to specific industries","Laws apply only to large companies, while collective agreements apply to everyone","Laws apply only to employers, while collective agreements apply only to employees"],"a":0,"e":"The lesson states that the laws apply to all employers and employees, while collective agreements only apply to the specific industries that have devised the agreements."},{"id":"working-life-laws-and-rules-in-working-life#2","l":51,"q":"Which of these does the Working Environment Act cover?","o":["Holiday pay and how much holiday you get","Hiring, working hours and absence from work","When holidays are taken and illness during holidays","Union membership and the right to strike"],"a":1,"e":"The lesson lists hiring and contracts, working hours and absence from work among the things the Working Environment Act covers."},{"id":"working-life-laws-and-rules-in-working-life#3","l":51,"q":"Who has chief responsibility for the working environment in the workplace?","o":["The employees","The employer","The trade unions","The Storting"],"a":1,"e":"The lesson states that the employer has chief responsibility for the working environment in the workplace."},{"id":"working-life-laws-and-rules-in-working-life#4","l":51,"q":"Which of these is an obligation of the employee?","o":["To decide the wages in the workplace","To decide when everyone takes holidays","To help create a good working environment","To hire and fire other employees"],"a":2,"e":"The lesson states that the employee is obliged to help create a good working environment."},{"id":"working-life-laws-and-rules-in-working-life#5","l":51,"q":"Which of these does the Holidays Act cover?","o":["Working hours and absence from work","Holiday pay and illness during holidays","Hiring and contracts for new employees","Health, safety and the environment (HSE)"],"a":1,"e":"The lesson states that the Holidays Act covers, among other things, illness during holidays and holiday pay."},{"id":"working-life-laws-and-rules-in-working-life#6","l":51,"q":"How much holiday per year is an employee entitled to in Norway?","o":["3 weeks","4 weeks and 1 day, but many people have 5 weeks","6 weeks","2 weeks and 5 days"],"a":1,"e":"The lesson states 'Employees in Norway are entitled to four weeks + one day's holiday each year, but many people have five weeks' holiday.'"},{"id":"working-life-laws-and-rules-in-working-life#7","l":51,"q":"What factor determines how much holiday pay an employee receives?","o":["The size of the company","How many weeks of holiday they take","How much they earned the previous year","The number of employees in the workplace"],"a":2,"e":"The lesson states 'How much holiday pay we get depends on how much we earned the previous year.'"},{"id":"working-life-laws-and-rules-in-working-life#8","l":51,"q":"During holiday, do employees receive their normal salary?","o":["Yes, they receive their full regular salary","No, they receive holiday pay instead of regular pay","Yes, they receive both regular pay and holiday pay","It depends on the union agreement"],"a":1,"e":"The lesson states 'We do not receive pay during the holidays, but holiday pay.'"},{"id":"working-life-laws-and-rules-in-working-life#9","l":51,"q":"Who enters into collective agreements in working life?","o":["The members of the Storting through the laws they adopt","Employers and employees through their organisations","The government and ministries through new rules","Municipalities and counties through local rules"],"a":1,"e":"The lesson states that employers and employees enter into agreements through their respective organisations."},{"id":"working-life-pay-and-taxes#0","l":52,"q":"How are wages usually paid in Norway?","o":["In cash from the employer once a week","Into a bank account once a month","Into a bank account twice a year","In cash from the employer after each project"],"a":1,"e":"The lesson says wages are usually paid into a bank account once a month on a certain date."},{"id":"working-life-pay-and-taxes#1","l":52,"q":"Why do women on average earn less than men in Norway?","o":["Because employers pay women less money for doing the same job","Because women more often work part-time and choose lower-paying occupations","Because fewer women have university education","Because women are not allowed to work in certain industries"],"a":1,"e":"The lesson explains that women earn less because they more often work part-time and choose occupations with lower pay levels."},{"id":"working-life-pay-and-taxes#2","l":52,"q":"If an employee is a member of a trade union, who can negotiate pay on their behalf?","o":["The Tax Administration","The trade union","The Working Environment Agency","The employee's bank"],"a":1,"e":"The lesson states that when employees are members of a trade union, the trade union often negotiates pay on behalf of its members."},{"id":"working-life-pay-and-taxes#3","l":52,"q":"According to the lesson, what does the Norwegian welfare system depend on?","o":["Donations from wealthy citizens","Taxes paid by employees and employers","Money from other countries","Voluntary contributions from workers"],"a":1,"e":"The lesson states that Norwegian society is completely dependent on people paying different direct and indirect taxes to finance the welfare system."},{"id":"working-life-pay-and-taxes#4","l":52,"q":"How does the Norwegian tax system work?","o":["Everyone pays the same amount of tax","Those who earn more pay more tax","Those who earn less pay more tax","Tax is based on where you live"],"a":1,"e":"The lesson explains that those who earn a lot pay most tax, and those who earn less pay less tax, based on the principle that those who have a lot should give a lot back."},{"id":"working-life-pay-and-taxes#5","l":52,"q":"Who is responsible for ensuring that the Tax Administration has accurate information about you?","o":["The Tax Administration only","Your employer only","You","The Trade Union"],"a":2,"e":"The lesson states that you are responsible for ensuring that the Tax Administration has accurate information about you."},{"id":"working-life-pay-and-taxes#6","l":52,"q":"What must an employer do when deducting tax from an employee's salary?","o":["Calculate the total tax for the country","Deduct tax from gross pay and transfer it to tax authorities","Decide whether the employee should pay tax","Tell the employee to pay taxes directly to the government"],"a":1,"e":"The lesson states it is the employer's duty to deduct tax from the employees' gross pay and transfer it to the tax authorities."},{"id":"working-life-pay-and-taxes#7","l":52,"q":"What must an employment contract contain according to the Working Environment Act?","o":["Only information about holidays","Description of the position, pay, and working hours arrangements","Only the employee's personal address","Only information about sick leave"],"a":1,"e":"The lesson states that an employment contract must contain a description of the position, pay, and working hours arrangements."},{"id":"working-life-pay-and-taxes#8","l":52,"q":"What happens to an employee who does undeclared work if they become ill?","o":["They receive full sick pay from their employer","They receive half of their normal salary","They do not receive sick pay","The government pays them sick benefits"],"a":2,"e":"The lesson lists no sick pay as one of the consequences of undeclared work for employees."},{"id":"working-life-pay-and-taxes#9","l":52,"q":"When do employees in Norway receive an overview of their income and tax from the previous year?","o":["In January","In February","In March or April","In November"],"a":2,"e":"The lesson states that in March/April, everyone receives a digital overview of their income and tax from the previous year."},{"id":"working-life-the-labour-market-in-norway#0","l":53,"q":"What were the most important industries in Norway 150 years ago?","o":["Oil and gas production","Manufacturing and factories","Agriculture, forestry, and fishing","Passenger transport and retail"],"a":2,"e":"The lesson states that agriculture, forestry and fishing were the most important industries in Norway 150 years ago."},{"id":"working-life-the-labour-market-in-norway#1","l":53,"q":"When was oil discovered in the North Sea?","o":["In the early 1950s","In the late 1960s","In the early 1980s","In the late 1990s"],"a":1,"e":"The lesson says oil was discovered in the North Sea in the late 1960s."},{"id":"working-life-the-labour-market-in-norway#2","l":53,"q":"What percentage of Norway's population worked in agriculture in 1950?","o":["Less than 3 percent","Between 5 and 10 percent","More than 20 percent","About 15 percent"],"a":2,"e":"The lesson states that in 1950, more than 20 per cent of the population worked in agriculture."},{"id":"working-life-the-labour-market-in-norway#3","l":53,"q":"Why can Norway produce more food today even though fewer people work in agriculture?","o":["More farmland has been developed","Farming machinery makes production more efficient","More people work part-time in farming","Better weather conditions"],"a":1,"e":"The lesson explains that farming machinery makes food production easier and more efficient, which is why Norway produces more food despite fewer agricultural workers."},{"id":"working-life-the-labour-market-in-norway#4","l":53,"q":"Where are most jobs found in Norway today?","o":["In agriculture and fishing","In oil and gas industries","In service occupations","In manufacturing and factories"],"a":2,"e":"The lesson states that today, most jobs are found in service occupations."},{"id":"working-life-the-labour-market-in-norway#5","l":53,"q":"Which of these is mentioned as a service occupation in the lesson?","o":["Oil drilling","Forest logging","Working in a shop","Mining"],"a":2,"e":"The lesson lists working in shops as one of the service occupations where people can find jobs in Norway."},{"id":"working-life-the-labour-market-in-norway#6","l":53,"q":"What happened to industrial jobs in Norway during the past 30 years?","o":["They increased by 50 percent","They remained stable","There was a strong decrease","They tripled in number"],"a":2,"e":"The lesson says there has been a strong decrease in the number of people working in industry during the past 30 years."},{"id":"working-life-the-labour-market-in-norway#7","l":53,"q":"In which century did factories begin to be built in Norway, leading many people to move to towns and cities?","o":["17th century","18th century","19th century","20th century"],"a":2,"e":"The lesson states that in the late 19th century, factories were built and many people moved to the towns and cities to work."},{"id":"working-life-the-labour-market-in-norway#8","l":53,"q":"Why is Norway focusing on 'green' jobs in the future?","o":["Oil prices are too low","Climate challenges make this transition necessary","There are no jobs in service sectors","The government wants to reduce wages"],"a":1,"e":"The lesson explains that climate challenges will necessitate a transition to 'green' jobs."},{"id":"working-life-the-labour-market-in-norway#9","l":53,"q":"What happened to many Norwegians during the first half of the 20th century?","o":["They moved to Russia","They left for the USA and settled there","They returned to farming","They moved to other Scandinavian countries"],"a":1,"e":"The lesson states that many Norwegians left for the USA and settled there during the first half of the 20th century."},{"id":"working-life-the-welfare-state#0","l":54,"q":"What is the main idea behind Norway being a welfare state?","o":["Everyone is equally important and should have the opportunity to live a good life","The government gives free money to anyone who asks for it","Only people who have worked for many years deserve welfare support","Wealthy people should pay for the welfare of poor people"],"a":0,"e":"The lesson states 'Norway is a welfare society built around the idea of equality. This means that everyone is equally important, and that everyone shall have the opportunity to live a good life.'"},{"id":"working-life-the-welfare-state#1","l":54,"q":"Over what period of time was the Norwegian welfare state built?","o":["About 50 years","About 100 years","About 200 years","All at once when Norway became independent in 1905"],"a":1,"e":"The lesson states 'The Norwegian welfare state has been built benefit by benefit over the course of 100 years.'"},{"id":"working-life-the-welfare-state#2","l":54,"q":"What is the most important requirement for a welfare state to function?","o":["International financial support from other countries","Large natural resources like oil and gas","As many people as possible working and paying tax","Donations from wealthy citizens"],"a":2,"e":"The lesson states 'A welfare state depends on as many people as possible working and paying tax.'"},{"id":"working-life-the-welfare-state#3","l":54,"q":"In Norway, who has the main responsibility for providing welfare benefits?","o":["Private companies and charities","Extended families and local communities","The central government and the municipalities","County authorities working alone"],"a":2,"e":"The lesson states 'The central government and municipalities are mainly responsible for the provision of welfare benefits.'"},{"id":"working-life-the-welfare-state#4","l":54,"q":"What is one of the main purposes of a NAV office?","o":["To collect taxes from all Norwegian citizens","To negotiate salaries between employers and workers","To help people find work or get financial assistance during difficult periods","To provide free housing to all residents"],"a":2,"e":"The lesson states 'The NAV office can help us if we need to qualify to find work or if we need financial assistance during periods of illness or other difficult periods of life.'"},{"id":"working-life-the-welfare-state#5","l":54,"q":"Where can you find a NAV office in Norway?","o":["Only in the three largest cities","Only in the capital city, Oslo","In every municipality in Norway","Only in county towns"],"a":2,"e":"The lesson states 'Every municipality in Norway has a NAV office.'"},{"id":"working-life-the-welfare-state#6","l":54,"q":"What proportion of Norway's national budget does NAV administer?","o":["About one quarter","About one third","About one half","Less than one tenth"],"a":1,"e":"The lesson states 'NAV administers approx. one third of the national budget.'"},{"id":"working-life-the-welfare-state#7","l":54,"q":"What proportion of the gainfully employed in Norway today work in the public sector?","o":["About one quarter","About one third","About one half","About one tenth"],"a":1,"e":"The lesson states that approx. one third of the gainfully employed in Norway today work in the public sector."},{"id":"working-life-the-welfare-state#8","l":54,"q":"Which of the following is an example of a welfare benefit mentioned in the lesson?","o":["Free swimming pools","Free hospital care","Free fitness centers","Free public transport"],"a":1,"e":"The lesson lists 'free hospital care' among examples of welfare schemes in Norway."},{"id":"working-life-the-welfare-state#9","l":54,"q":"What is the use of the welfare system in Norway largely based on?","o":["Strict control from the central government and punishment of cheaters","Trust between the central government and the people","Charity and gifts from wealthy people","International loans and agreements with other countries"],"a":1,"e":"The lesson states that the use of the welfare system is largely based on trust, and that the central government and the people trust each other."},{"id":"working-life-trade-unions#0","l":55,"q":"Approximately what percentage of employees in Norway are members of a trade union?","o":["Around 30 per cent","Around 50 per cent","Around 70 per cent","Around 90 per cent"],"a":1,"e":"The lesson states that approximately 50 per cent of employees in Norway are members of a trade union or labour organisation."},{"id":"working-life-trade-unions#1","l":55,"q":"What is the most important task of a trade union?","o":["To organize social events for employees","To negotiate pay and other rights with employers","To manage the company's finances","To hire and fire employees"],"a":1,"e":"The lesson clearly states that the most important task of a trade union is to negotiate pay and other rights with employers."},{"id":"working-life-trade-unions#2","l":55,"q":"Besides pay, which right can trade unions negotiate with employers?","o":["the right to a company car","the right to on-the-job training","the right to free housing","the right to free meals"],"a":1,"e":"The lesson says that the rights trade unions negotiate besides pay could be working hours, holidays and the right to on-the-job training."},{"id":"working-life-trade-unions#3","l":55,"q":"What are employees entitled to do if employers and employees fail to reach agreement during negotiations?","o":["Report the employer to the police","Go on strike","Quit their job immediately without notice","Demand compensation from the government"],"a":1,"e":"The lesson states that if the parties fail to reach agreement, the employees are entitled to go on strike."},{"id":"working-life-trade-unions#4","l":55,"q":"How does Norwegian working life treat employee participation?","o":["It discourages employee involvement in decisions","It only allows managers to make decisions","It facilitates employee participation and democracy in the workplace","It prevents workers from speaking about their concerns"],"a":2,"e":"The lesson states that Norwegian working life facilitates employee participation and democracy in the workplace."},{"id":"working-life-trade-unions#5","l":55,"q":"What right do individual employees have in organizing their work?","o":["The right to make all company decisions","The right to refuse to follow company rules","The right to be heard and to participate in organizing their own work situation","The right to negotiate contracts alone without the union"],"a":2,"e":"The lesson states that individual employees have the right to be heard and to participate in organizing their own work situation."},{"id":"working-life-trade-unions#6","l":55,"q":"What can employees do through their trade union?","o":["Avoid following agreements made with employers","Work without any supervision from management","Take part in discussions and receive information about the enterprise","Force the employer to hire their relatives"],"a":2,"e":"The lesson states that through their trade unions, employees take part in discussions and receive information about the enterprise."},{"id":"working-life-trade-unions#7","l":55,"q":"Who has the obligation to safeguard health, safety and the environment (HSE) in the workplace?","o":["Only the government","Only the safety representative","All employers","Only the employees themselves"],"a":2,"e":"The lesson states that all employers have an obligation to safeguard health, safety and environment (HSE) in the workplace."},{"id":"working-life-trade-unions#8","l":55,"q":"HSE work in the workplace must be organised and followed up by an employee representative, a representative of the management and who else?","o":["a personnel manager","a safety representative","a health inspector","a company doctor"],"a":1,"e":"The lesson states that HSE work must be organised and followed up by an employee representative, a safety representative and a representative of the management."},{"id":"working-life-trade-unions#9","l":55,"q":"When negotiations conclude and agreements are written, what must happen?","o":["Only employers must follow the agreements","Only employees must follow the agreements","Both employers and employees are obliged to comply with the agreements","The agreements are optional for both parties"],"a":2,"e":"The lesson states that when agreements are written, employers and employees are obliged to comply with them."},{"id":"working-life-ways-to-find-work#0","l":56,"q":"Which of these is NOT mentioned as a way to find a job in Norway?","o":["Using your network","Using nav.no and finn.no websites","Applying through temping agencies","Sending CVs by mail to all companies"],"a":3,"e":"The lesson lists network, nav.no and finn.no, and temping agencies as ways to find work, but does not mention sending CVs by mail."},{"id":"working-life-ways-to-find-work#1","l":56,"q":"Why are references important to employers in Norway?","o":["They show where you went to school","They show your family background","They describe how you performed in previous jobs","They prove you have Norwegian citizenship"],"a":2,"e":"The lesson states that employers think references are important because they can ask previous employers about how the applicant performs at work."},{"id":"working-life-ways-to-find-work#2","l":56,"q":"Who can provide a good reference about your work performance?","o":["Only family members","Only educational institutions","A former boss or colleague","Only government agencies"],"a":2,"e":"The lesson explains that a former boss or colleague can give good references about work performance."},{"id":"working-life-ways-to-find-work#3","l":56,"q":"What percentage of jobs in Norway are estimated to be filled through networks without advertising?","o":["10 to 20 percent","30 to 40 percent","60 to 80 percent","90 to 100 percent"],"a":2,"e":"The lesson states that between 60 and 80 per cent of jobs in Norway are filled through people's networks without being advertised."},{"id":"working-life-ways-to-find-work#4","l":56,"q":"What is the main challenge for people finding their first job in Norway?","o":["The job market does not have any openings","They may not have references or an extensive network","They are not allowed to work in Norway","All employers require many years of work experience"],"a":1,"e":"The lesson states that finding a job for the first time in Norway can be difficult because people may not have references or an extensive network."},{"id":"working-life-ways-to-find-work#5","l":56,"q":"How can a person without experience develop their network and obtain references?","o":["By reading job advertisements in newspapers","By doing practical training in a workplace, taking courses, or doing odd jobs","By asking the government for employment","By moving to a different city in Norway"],"a":1,"e":"The lesson explains that practical training and various odd jobs enable you to develop your network and obtain references."},{"id":"working-life-ways-to-find-work#6","l":56,"q":"According to the lesson, what is your network?","o":["Everyone who lives in the same city as you","Everyone who has the same job as you","Everyone you know, meet and are in contact with","Everyone who comes from the same country as you"],"a":2,"e":"The lesson says your network is all the people you know, meet and are in contact with, such as family, friends, colleagues, neighbours, teachers and case officers."},{"id":"working-life-ways-to-find-work#7","l":56,"q":"Which websites are specifically mentioned in the lesson as places to look for jobs in Norway?","o":["regjeringen.no and stortinget.no","nav.no and finn.no","ssb.no and nrk.no","norge.no and oslo.no"],"a":1,"e":"The lesson lists nav.no and finn.no as internet options for finding a job in Norway."},{"id":"working-life-ways-to-find-work#8","l":56,"q":"What is one main purpose of doing practical training in the workplace according to the lesson?","o":["To earn money instead of finding a real job","To avoid looking for a permanent job","To develop your network and obtain references for future employment","To learn Norwegian language and culture only"],"a":2,"e":"The lesson states that practical training enables you to develop your network and obtain references."},{"id":"working-life-ways-to-find-work#9","l":56,"q":"What strategy does the lesson suggest for people finding their first job in Nor
